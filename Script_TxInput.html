<script>
/* ============================================================
   TRANSACTION INPUT — Redesigned UX
   ============================================================ */

let TX_TYPE = 'expense';
let TX_TRANSFER_DIR = 'mm-to-mm';
let TX_SELECTED_CATEGORY = '';
let TX_SELECTED_SUBCATEGORY = '';
let TX_SELECTED_ACCOUNT = '';
let TX_SELECTED_ACCOUNT_TO = '';
let TX_RECENT = JSON.parse(safeStorage.getItem('txRecent') || '[]');

/* === OPEN ACTION SHEET === */
function mmShowActionSheet(type) {
  // Close FAB
  const btn = document.getElementById('mmFabBtn');
  const menu = document.getElementById('mmFabMenu');
  const overlay = document.getElementById('mmFabOverlay');
  if (btn) btn.classList.remove('open');
  if (menu) menu.classList.remove('open');
  if (overlay) overlay.classList.add('hidden');

  // Reset state
  TX_SELECTED_CATEGORY = '';
  TX_SELECTED_SUBCATEGORY = '';
  TX_SELECTED_ACCOUNT = '';
  TX_SELECTED_ACCOUNT_TO = '';

  // Set type
  txSwitchType(type);

  // Set today's date
  const today = localISODate();
  document.getElementById('txDateHidden').value = today;
  txUpdateDateDisplay();

  // Clear fields
  document.getElementById('txAmountInput').value = '';
  document.getElementById('txNotesInput').value = '';

  // Show sheet
  document.getElementById('mmActionSheet').classList.remove('hidden');

  // Deliberately not auto-focusing the amount field: on a phone that forces
  // the keyboard open over the sheet before the user has picked anything.
  // They tap the amount when they are ready.

  // Render chips
  txRenderCategories();
  txRenderAccounts();
  txRenderRecent();
}

function mmCloseActionSheet() {
  document.getElementById('mmActionSheet').classList.add('hidden');
}

function mmCloseActionSheetBackdrop(event) {
  if (event.target === event.currentTarget) mmCloseActionSheet();
}

/* === TYPE SWITCHING === */
function txSwitchType(type) {
  TX_TYPE = type;
  document.querySelectorAll('.tx-type-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.type === type);
  });

  // Show/hide transfer sections
  const catSection = document.getElementById('txCategorySection');
  const subSection = document.getElementById('txSubcategorySection');
  const accToSection = document.getElementById('txAccountToSection');
  const accLabel = document.getElementById('txAccountLabel');
  const dirSection = document.getElementById('txTransferDirSection');

  if (type === 'transfer') {
    catSection.style.display = 'none';
    subSection.style.display = 'none';
    accToSection.style.display = 'block';
    if (dirSection) dirSection.style.display = 'block';
    TX_TRANSFER_DIR = 'mm-to-mm';
    txUpdateTransferDirUI();
  } else {
    catSection.style.display = 'block';
    subSection.style.display = TX_SELECTED_CATEGORY ? 'block' : 'none';
    accToSection.style.display = 'none';
    if (dirSection) dirSection.style.display = 'none';
    accLabel.textContent = 'Account';
  }

  TX_SELECTED_ACCOUNT = '';
  TX_SELECTED_ACCOUNT_TO = '';
  txRenderCategories();
  txRenderAccounts();
}

/* === TRANSFER DIRECTION === */
function txSelectTransferDir(dir) {
  TX_TRANSFER_DIR = dir;
  TX_SELECTED_ACCOUNT = '';
  TX_SELECTED_ACCOUNT_TO = '';
  txUpdateTransferDirUI();
  txRenderAccounts();
}

function txUpdateTransferDirUI() {
  const accLabel = document.getElementById('txAccountLabel');
  const accToLabel = document.getElementById('txAccountToLabel');
  const dirChips = document.querySelectorAll('#txTransferDirChips .tx-chip');

  dirChips.forEach(chip => {
    const isActive =
      (chip.textContent.includes('Account → Account') && TX_TRANSFER_DIR === 'mm-to-mm') ||
      (chip.textContent.includes('Account → Invest') && TX_TRANSFER_DIR === 'mm-to-invest') ||
      (chip.textContent.includes('Invest → Account') && TX_TRANSFER_DIR === 'invest-to-mm');
    chip.classList.toggle('active', isActive);
  });

  if (TX_TRANSFER_DIR === 'mm-to-mm') {
    if (accLabel) accLabel.textContent = 'From Account';
    if (accToLabel) accToLabel.textContent = 'To Account';
  } else if (TX_TRANSFER_DIR === 'mm-to-invest') {
    if (accLabel) accLabel.textContent = 'From Account';
    if (accToLabel) accToLabel.textContent = 'To Platform (Invest)';
  } else if (TX_TRANSFER_DIR === 'invest-to-mm') {
    if (accLabel) accLabel.textContent = 'From Platform (Invest)';
    if (accToLabel) accToLabel.textContent = 'To Account';
  }
}

/* === DATE === */
function txUpdateDateDisplay() {
  const input = document.getElementById('txDateHidden');
  const labelEl = document.getElementById('txDateLabel');
  const valueEl = document.getElementById('txDateValue');
  const val = input.value;
  const today = localISODate();
  const yesterday = localISODate(new Date(Date.now() - 86400000));

  if (val === today) {
    labelEl.textContent = 'Today';
  } else if (val === yesterday) {
    labelEl.textContent = 'Yesterday';
  } else {
    labelEl.textContent = '';
  }
  const d = new Date(val + 'T00:00:00');
  valueEl.textContent = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
}

/* === AMOUNT FORMATTING === */
document.addEventListener('DOMContentLoaded', () => {
  const amtInput = document.getElementById('txAmountInput');
  if (amtInput) {
    amtInput.addEventListener('input', () => {
      let raw = amtInput.value.replace(/[^\d]/g, '');
      if (raw) {
        amtInput.value = Number(raw).toLocaleString('id-ID');
      } else {
        amtInput.value = '';
      }
    });
  }
});

/* === CATEGORY CHIPS === */
/* Categories come from the database, not a literal list — otherwise a category
   added in Settings would never show up here. Expense chips follow the budget
   allocation order the user set; anything only present in mm_categories is
   appended after it. */
const TX_FALLBACK_COLORS = ['#22d3ee','#fbbf24','#f472b6','#818cf8','#a78bfa','#2dd4bf','#fb923c','#94a3b8'];

function txAvailableCategories() {
  const wantType = TX_TYPE === 'income' ? 'Income' : 'Expense';
  const names = [];

  if (wantType === 'Expense' && typeof MM_ALLOCATION !== 'undefined') {
    MM_ALLOCATION.forEach(a => { if (a.category && names.indexOf(a.category) === -1) names.push(a.category); });
  }
  if (typeof MM_CATEGORIES !== 'undefined') {
    MM_CATEGORIES
      .filter(c => c.type === wantType && c.category)
      .forEach(c => { if (names.indexOf(c.category) === -1) names.push(c.category); });
  }
  // Nothing loaded yet (sheet opened before the dashboard finished) — keep the
  // known defaults so the user is never faced with an empty picker.
  if (!names.length) {
    (wantType === 'Income' ? ['Bisyaroh','Other'] : ['Living','Playing','Alms','Invest'])
      .forEach(n => names.push(n));
  }

  return names.map((name, i) => {
    const alloc = (typeof MM_ALLOCATION !== 'undefined')
      ? MM_ALLOCATION.find(a => a.category === name) : null;
    const cfg = MM_CATEGORY_CONFIG[name];
    return {
      name: name,
      color: (alloc && alloc.color) || (cfg && cfg.color) || TX_FALLBACK_COLORS[i % TX_FALLBACK_COLORS.length]
    };
  });
}

function txRenderCategories() {
  const container = document.getElementById('txCategoryChips');
  if (!container) return;

  const categories = txAvailableCategories();

  container.innerHTML = categories.map(cat => {
    const isActive = TX_SELECTED_CATEGORY === cat.name;
    const icon = lucideIconSvg(MM_CATEGORY_CONFIG[cat.name] ? MM_CATEGORY_CONFIG[cat.name].icon : 'tag', 16);
    return `<button class="tx-chip ${isActive ? 'active' : ''}" style="--chip-color:${cat.color}" onclick="txSelectCategory('${jsStr(cat.name)}')">
      <span class="tx-chip-icon">${icon}</span>
      <span>${cat.name}</span>
    </button>`;
  }).join('');
}

function txSelectCategory(category) {
  TX_SELECTED_CATEGORY = TX_SELECTED_CATEGORY === category ? '' : category;
  TX_SELECTED_SUBCATEGORY = '';
  txRenderCategories();
  txRenderSubcategories();
}

/* === SUBCATEGORY CHIPS === */
function txRenderSubcategories() {
  const container = document.getElementById('txSubcategoryChips');
  const section = document.getElementById('txSubcategorySection');
  if (!container || !section) return;

  if (!TX_SELECTED_CATEGORY) {
    section.style.display = 'none';
    return;
  }

  const subs = MM_CATEGORIES
    .filter(c => c.type === (TX_TYPE === 'income' ? 'Income' : 'Expense') && c.category === TX_SELECTED_CATEGORY && c.subcategory)
    .map(c => c.subcategory);

  if (!subs.length) {
    section.style.display = 'none';
    return;
  }

  section.style.display = 'block';
  const color = mmCategoryColor(TX_SELECTED_CATEGORY);
  container.innerHTML = subs.map(sub => {
    const isActive = TX_SELECTED_SUBCATEGORY === sub;
    return `<button class="tx-chip tx-chip-sm ${isActive ? 'active' : ''}" style="--chip-color:${color}" onclick="txSelectSubcategory('${jsStr(sub)}')">
      <span>${escapeHtml(sub)}</span>
    </button>`;
  }).join('');
}

function txSelectSubcategory(sub) {
  TX_SELECTED_SUBCATEGORY = TX_SELECTED_SUBCATEGORY === sub ? '' : sub;
  txRenderSubcategories();
}

/* === ACCOUNT CHIPS === */
function txRenderAccounts() {
  const container = document.getElementById('txAccountChips');
  const containerTo = document.getElementById('txAccountToChips');
  if (!container) return;

  const accounts = MM_ACCOUNTS.filter(a => a.status !== 'Deleted');

  // Sort by usage frequency from recent
  const freqMap = {};
  TX_RECENT.forEach(r => {
    freqMap[r.account] = (freqMap[r.account] || 0) + 1;
  });
  const sorted = [...accounts].sort((a, b) => (freqMap[b.name] || 0) - (freqMap[a.name] || 0));

  // Get investment platforms for invest transfers
  const platforms = (typeof APP_SETTINGS !== 'undefined' && APP_SETTINGS.Platform) ? APP_SETTINGS.Platform : [];

  // Determine what to show for "From" chips
  if (TX_TYPE === 'transfer' && TX_TRANSFER_DIR === 'invest-to-mm') {
    // From: investment platforms
    container.innerHTML = platforms.map(p => {
      const isActive = TX_SELECTED_ACCOUNT === p;
      return `<button class="tx-chip ${isActive ? 'active' : ''}" style="--chip-color:#8b5cf6" onclick="txSelectAccount('${jsStr(p)}')">
        <span>📈 ${escapeHtml(p)}</span>
      </button>`;
    }).join('');
  } else {
    // From: regular accounts
    container.innerHTML = sorted.map(acc => {
      const isActive = TX_SELECTED_ACCOUNT === acc.name;
      return `<button class="tx-chip ${isActive ? 'active' : ''}" style="--chip-color:var(--accent)" onclick="txSelectAccount('${jsStr(acc.name)}')">
        <span>${escapeHtml(acc.name)}</span>
      </button>`;
    }).join('');
  }

  // Transfer: To chips
  if (containerTo && TX_TYPE === 'transfer') {
    if (TX_TRANSFER_DIR === 'mm-to-invest') {
      // To: investment platforms
      containerTo.innerHTML = platforms.map(p => {
        const isActive = TX_SELECTED_ACCOUNT_TO === p;
        return `<button class="tx-chip ${isActive ? 'active' : ''}" style="--chip-color:#3b82f6" onclick="txSelectAccountTo('${jsStr(p)}')">
          <span>📈 ${escapeHtml(p)}</span>
        </button>`;
      }).join('');
    } else {
      // To: regular accounts
      containerTo.innerHTML = sorted.map(acc => {
        const isActive = TX_SELECTED_ACCOUNT_TO === acc.name;
        return `<button class="tx-chip ${isActive ? 'active' : ''}" style="--chip-color:var(--accent2)" onclick="txSelectAccountTo('${jsStr(acc.name)}')">
          <span>${escapeHtml(acc.name)}</span>
        </button>`;
      }).join('');
    }
  }
}

function txSelectAccount(name) {
  TX_SELECTED_ACCOUNT = TX_SELECTED_ACCOUNT === name ? '' : name;
  txRenderAccounts();
}

function txSelectAccountTo(name) {
  TX_SELECTED_ACCOUNT_TO = TX_SELECTED_ACCOUNT_TO === name ? '' : name;
  txRenderAccounts();
}

/* === RECENTLY USED === */
function txRenderRecent() {
  const container = document.getElementById('txRecentChips');
  const section = document.getElementById('txRecentlyUsed');
  if (!container || !section) return;

  const relevant = TX_RECENT.filter(r => r.type === TX_TYPE).slice(0, 4);

  if (!relevant.length) {
    section.style.display = 'none';
    return;
  }

  section.style.display = 'block';
  container.innerHTML = relevant.map(r => {
    const label = [r.category, r.account].filter(Boolean).join(' · ');
    return `<button class="tx-recent-chip" onclick="txApplyRecent('${jsStr(r.category)}','${jsStr(r.subcategory || '')}','${jsStr(r.account)}')">
      <span class="tx-recent-label">${escapeHtml(label)}</span>
    </button>`;
  }).join('');
}

function txApplyRecent(category, subcategory, account) {
  TX_SELECTED_CATEGORY = category;
  TX_SELECTED_SUBCATEGORY = subcategory;
  TX_SELECTED_ACCOUNT = account;
  txRenderCategories();
  txRenderSubcategories();
  txRenderAccounts();
}

/* === SUBMIT === */
function txSubmit() {
  const amountRaw = document.getElementById('txAmountInput').value.replace(/[^\d]/g, '');
  const amount = Number(amountRaw);
  const date = document.getElementById('txDateHidden').value;
  const notes = document.getElementById('txNotesInput').value;

  if (!amount || amount <= 0) {
    showToast('Masukkan nominal.', 'error');
    document.getElementById('txAmountInput').focus();
    return;
  }

  if (TX_TYPE !== 'transfer' && !TX_SELECTED_CATEGORY) {
    showToast('Pilih kategori.', 'error');
    return;
  }

  if (!TX_SELECTED_ACCOUNT) {
    showToast(TX_TYPE === 'transfer' && TX_TRANSFER_DIR === 'invest-to-mm' ? 'Pilih platform.' : 'Pilih akun.', 'error');
    return;
  }

  if (TX_TYPE === 'transfer' && !TX_SELECTED_ACCOUNT_TO) {
    showToast(TX_TRANSFER_DIR === 'mm-to-invest' ? 'Pilih platform tujuan.' : 'Pilih akun tujuan.', 'error');
    return;
  }

  if (TX_TYPE === 'transfer' && TX_TRANSFER_DIR === 'mm-to-mm' && TX_SELECTED_ACCOUNT === TX_SELECTED_ACCOUNT_TO) {
    showToast('Akun asal dan tujuan harus berbeda.', 'error');
    return;
  }

  // Build payload based on transfer direction
  let account = TX_SELECTED_ACCOUNT;
  let accountTo = TX_TYPE === 'transfer' ? TX_SELECTED_ACCOUNT_TO : '';
  let category = TX_TYPE === 'transfer' ? '' : TX_SELECTED_CATEGORY;

  if (TX_TYPE === 'transfer') {
    if (TX_TRANSFER_DIR === 'mm-to-invest') {
      accountTo = 'Invest:' + TX_SELECTED_ACCOUNT_TO;
    } else if (TX_TRANSFER_DIR === 'invest-to-mm') {
      account = 'Invest:' + TX_SELECTED_ACCOUNT;
    }
  }

  const payload = {
    date: date,
    type: TX_TYPE.charAt(0).toUpperCase() + TX_TYPE.slice(1),
    account: account,
    accountTo: accountTo,
    category: category,
    subcategory: TX_SELECTED_SUBCATEGORY,
    amount: amount,
    notes: notes
  };

  const btn = document.getElementById('txSaveBtn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  google.script.run
    .withSuccessHandler(result => {
      btn.disabled = false;
      btn.textContent = 'Save Transaction';
      if (result && result.success) {
        // Success animation
        btn.textContent = '✓ Saved!';
        btn.style.background = 'var(--success)';
        // A short buzz confirms the save without the user having to read the
        // button — logging an expense is usually a glance, not a stare.
        if (navigator.vibrate) navigator.vibrate(12);
        setTimeout(() => {
          btn.textContent = 'Save Transaction';
          btn.style.background = '';
          mmCloseActionSheet();
        }, 800);

        // Save to recent
        txSaveRecent(payload);

        // Invalidate cache
        MM_DASHBOARD = null;
        MM_SEARCH_CACHE = null;
        mmLoadDashboard();
      } else {
        showToast('Gagal menyimpan.', 'error');
      }
    })
    .withFailureHandler(err => {
      btn.disabled = false;
      btn.textContent = 'Save Transaction';
      showToast(err.message || 'Gagal.', 'error');
    })
    .mmAddTransaction(payload);
}

function txSaveRecent(payload) {
  const entry = {
    type: payload.type.toLowerCase(),
    category: payload.category,
    subcategory: payload.subcategory,
    account: payload.account
  };

  // Remove duplicates
  TX_RECENT = TX_RECENT.filter(r =>
    !(r.type === entry.type && r.category === entry.category && r.account === entry.account)
  );

  TX_RECENT.unshift(entry);
  TX_RECENT = TX_RECENT.slice(0, 10); // Keep max 10
  safeStorage.setItem('txRecent', JSON.stringify(TX_RECENT));
}

/* === SHEETS: SCROLLING, KEYBOARD, NO PULL-TO-REFRESH ===
   Dragging inside an input sheet used to reload the page. When the sheet's
   content fit (or was already at its top) the drag had nothing to scroll, so
   it chained through the fixed backdrop to the document, and Android Chrome
   read a downward drag at the top of the document as pull-to-refresh. With
   the keyboard open it was worse: the keyboard covered the lower half of the
   sheet but the sheet did not shrink, so there was nothing left to scroll.

   1. Keyboard: --kb holds the height the on-screen keyboard takes from the
      bottom of the layout viewport; sheets sit above it and shrink to what
      is still visible, so their content scrolls. (Chrome with
      interactive-widget=resizes-content already shrinks the viewport and
      --kb stays 0.)
   2. Touch guard: while an overlay is open, a vertical drag that the element
      under the finger cannot scroll any further is cancelled instead of
      chaining out to the page. On the page itself, a downward drag at the
      very top is cancelled too, so the browser never starts a refresh. */
(function () {
  const OVERLAYS = '.action-sheet-backdrop:not(.hidden), .modal-backdrop:not(.hidden), .mm-search:not(.hidden), .auth-gate:not(.hidden)';
  const root = document.documentElement;

  function updateKeyboardInset() {
    const vv = window.visualViewport;
    if (!vv) return;
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    root.style.setProperty('--kb', Math.round(kb) + 'px');
    root.style.setProperty('--vvh', Math.round(vv.height) + 'px');
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateKeyboardInset);
    window.visualViewport.addEventListener('scroll', updateKeyboardInset);
    updateKeyboardInset();
  }

  // Keep the focused field visible once the keyboard has finished opening.
  document.addEventListener('focusin', function (e) {
    const t = e.target;
    if (!t || !t.closest || !t.matches('input, textarea, select')) return;
    const sheet = t.closest('.action-sheet-content, .modal-card');
    if (!sheet) return;
    setTimeout(function () {
      try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) { t.scrollIntoView(); }
    }, 320);
  });

  function scrollableY(el, stop) {
    while (el && el !== stop && el !== document.body) {
      if (el.nodeType === 1) {
        const oy = getComputedStyle(el).overflowY;
        if ((oy === 'auto' || oy === 'scroll') && el.scrollHeight > el.clientHeight + 1) return el;
      }
      el = el.parentElement;
    }
    return null;
  }

  let startX = 0, startY = 0, lastY = 0, lockedAxis = null;
  document.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = lastY = e.touches[0].clientY;
    lockedAxis = null;
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (e.touches.length !== 1) return;
    const y = e.touches[0].clientY;
    // Direction of THIS move, not of the whole gesture: a drag that first
    // went up at the bottom of a sheet and then turned back down is a
    // scroll-up and must not be cancelled.
    const dy = y - lastY;
    lastY = y;
    if (!e.cancelable) return;
    if (!lockedAxis) {
      const tx = e.touches[0].clientX - startX, ty = y - startY;
      if (Math.abs(tx) < 4 && Math.abs(ty) < 4) return;
      lockedAxis = Math.abs(ty) >= Math.abs(tx) ? 'y' : 'x';
    }
    // Sideways drags (chip rows, charts) are never ours to stop.
    if (lockedAxis !== 'y' || dy === 0) return;

    const overlay = document.querySelector(OVERLAYS);
    if (overlay) {
      if (!overlay.contains(e.target)) { e.preventDefault(); return; }
      const scroller = scrollableY(e.target, overlay.parentElement);
      if (!scroller) { e.preventDefault(); return; }
      const atTop = scroller.scrollTop <= 0;
      const atBottom = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 1;
      if ((dy > 0 && atTop) || (dy < 0 && atBottom)) e.preventDefault();
      return;
    }

    // Page: stop the pull-to-refresh gesture at the top, unless the finger is
    // on an inner scroller that can still move up.
    if (dy > 0 && window.scrollY <= 0) {
      const inner = scrollableY(e.target, null);
      if (!inner || inner.scrollTop <= 0) e.preventDefault();
    }
  }, { passive: false });

  /* Input sheets: every open starts at the top of the form, and a chip row
     that is re-rendered (selecting a chip rebuilds the row, which resets its
     sideways scroll) brings the selected chip back into view. */
  function revealActive(row) {
    const chip = row.querySelector('.active');
    if (!chip || row.scrollWidth <= row.clientWidth) return;
    const left = chip.offsetLeft - (row.clientWidth - chip.offsetWidth) / 2;
    row.scrollLeft = Math.max(0, left);
  }
  document.querySelectorAll('.tx-input-sheet').forEach(function (sheet) {
    const backdrop = sheet.parentElement;
    const body = sheet.querySelector('.tx-sheet-body');
    new MutationObserver(function () {
      if (backdrop.classList.contains('hidden')) return;
      if (body) body.scrollTop = 0;
      sheet.querySelectorAll('.tx-chips').forEach(revealActive);
    }).observe(backdrop, { attributes: true, attributeFilter: ['class'] });

    sheet.querySelectorAll('.tx-chips').forEach(function (row) {
      new MutationObserver(function () { revealActive(row); })
        .observe(row, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
    });
  });
})();

</script>
