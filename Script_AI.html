<script>
/* === AI ASSISTANT ===
   A chat that answers questions about the user's own money. Each request
   sends a fresh snapshot of their data (balances, budget, this month's
   transactions, monthly history) as the system instruction, so answers
   always reflect what is on screen right now.

   Answers come from DeepSeek (OpenAI-compatible chat API, which allows
   calls straight from the browser).

   The API key is never in the source: the app is public on GitHub Pages,
   so a key in the bundle would be readable by anyone and spend the user's
   balance. It lives in this browser's storage only, pasted in by the user. */
const MM_AI_KEY_STORE = 'deepseek_api_key';
const MM_AI_ENDPOINT = 'https://api.deepseek.com/chat/completions';
const MM_AI_MODEL = 'deepseek-flash';
const MM_AI_KEY_URL = 'https://platform.deepseek.com/api_keys';

// The assistant used Gemini before; its key and model memo are no longer
// read, so they don't stay behind in storage.
safeStorage.removeItem('gemini_api_key');
safeStorage.removeItem('gemini_model_ok');
const MM_AI_SUGGESTIONS = [
  'Bagaimana kondisi keuanganku bulan ini?',
  'Kategori mana yang paling boros?',
  'Berapa yang aman kubelanjakan per hari?',
  'Bandingkan bulan ini dengan bulan lalu',
  'Berapa yang bisa kutabung bulan ini?'
];

let MM_AI_HISTORY = [];   // {role: 'user' | 'model', parts: [{text}]}, plus status/error on answers
let MM_AI_BUSY = false;
let MM_AI_ABORT = null;
let MM_AI_OPENER = null;  // focus returns here when the chat closes
// Investment Tracker data and archived month summaries, fetched once each
// time the chat opens (they change rarely, and a question shouldn't wait on
// three extra round trips).
let MM_AI_EXTRA = null;

function mmAiGetKey() { return (safeStorage.getItem(MM_AI_KEY_STORE) || '').trim(); }

/* ---------- open / close ---------- */
/* The chat is a popup tied to the floating bubble (#aiFab): the bubble
   turns into a "close" chevron while the panel is open. */
function mmAiSetFab(open) {
  const fab = document.getElementById('aiFab');
  const scrim = document.getElementById('mmAiScrim');
  if (fab) {
    fab.classList.toggle('is-open', open);
    fab.setAttribute('aria-expanded', String(open));
    fab.setAttribute('aria-label', open ? 'Tutup asisten keuangan AI' : 'Buka asisten keuangan AI');
  }
  if (scrim) scrim.classList.toggle('hidden', !open);
}

function mmToggleAiChat() {
  const sheet = document.getElementById('mmAiSheet');
  if (sheet && !sheet.classList.contains('hidden')) mmCloseAiChat();
  else mmOpenAiChat();
}

function mmOpenAiChat() {
  const sheet = document.getElementById('mmAiSheet');
  if (!sheet) return;
  if (!sheet.classList.contains('hidden')) return;
  const fab = document.getElementById('aiFab');
  // Focus returns to the bubble when the panel closes, unless the chat was
  // opened from somewhere else (drawer, settings) that is still on screen.
  MM_AI_OPENER = (document.activeElement && document.activeElement !== document.body) ? document.activeElement : fab;
  sheet.classList.remove('hidden');
  document.body.classList.add('ai-open');
  mmAiSetFab(true);
  mmAiRender();
  // Warm the full history in the background; the first answer needs it.
  if (typeof mmLoadSearchData === 'function' && !MM_SEARCH_CACHE) mmLoadSearchData();
  MM_AI_EXTRA = mmAiLoadExtra();
  const input = document.getElementById('mmAiInput');
  // Keyboard users land in the field; on a phone focus goes to the dialog's
  // first control so the on-screen keyboard doesn't cover the suggestions.
  setTimeout(() => {
    if (input && mmAiGetKey() && window.matchMedia('(pointer: fine)').matches) input.focus();
    else { const close = sheet.querySelector('.ai-bar-close'); if (close) close.focus({ preventScroll: true }); }
  }, 80);
}

function mmCloseAiChat() {
  const sheet = document.getElementById('mmAiSheet');
  if (!sheet || sheet.classList.contains('hidden')) return;
  sheet.classList.add('hidden');
  document.body.classList.remove('ai-open');
  mmAiSetFab(false);
  const input = document.getElementById('mmAiInput');
  if (input) input.blur();
  const back = (MM_AI_OPENER && document.contains(MM_AI_OPENER) && MM_AI_OPENER.getClientRects().length)
    ? MM_AI_OPENER : document.getElementById('aiFab');
  if (back) back.focus({ preventScroll: true });
  MM_AI_OPENER = null;
}

function mmAiNewChat() {
  if (MM_AI_ABORT) MM_AI_ABORT.abort();
  MM_AI_HISTORY = [];
  mmAiRender();
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const sheet = document.getElementById('mmAiSheet');
  if (sheet && !sheet.classList.contains('hidden')) mmCloseAiChat();
});

/* ---------- key management ---------- */
function mmAiSaveKey(inputId) {
  const input = document.getElementById(inputId);
  const key = (input && input.value || '').trim();
  if (!/^sk-[A-Za-z0-9_-]{16,}$/.test(key)) { showToast('API key DeepSeek diawali "sk-" — periksa lagi', 'error'); return; }
  safeStorage.setItem(MM_AI_KEY_STORE, key);
  if (input) input.value = '';
  showToast('API key tersimpan di browser ini', 'success');
  mmAiRenderKeyStatus();
  mmAiRender();
}

function mmAiClearKey() {
  safeStorage.removeItem(MM_AI_KEY_STORE);
  showToast('API key dihapus dari browser ini', 'success');
  mmAiRenderKeyStatus();
  mmAiRender();
}

function mmAiRenderKeyStatus() {
  const status = document.getElementById('mmAiKeyStatus');
  const clear = document.getElementById('mmAiKeyClear');
  const key = mmAiGetKey();
  if (status) {
    status.innerHTML = key
      ? `<span class="ai-key-dot is-on"></span>Terpasang · berakhiran <strong>${escapeHtml(key.slice(-4))}</strong>`
      : `<span class="ai-key-dot"></span>Belum ada key. Buat di <a href="${MM_AI_KEY_URL}" target="_blank" rel="noopener">platform.deepseek.com</a>.`;
  }
  if (clear) clear.hidden = !key;
}

/* ---------- rendering ---------- */
function mmAiRender() {
  const log = document.getElementById('mmAiLog');
  const form = document.getElementById('mmAiForm');
  if (!log) return;
  const hasKey = !!mmAiGetKey();
  if (form) form.hidden = !hasKey;

  if (!hasKey) {
    log.innerHTML = `
      <div class="ai-intro">
        <span class="ai-intro-mark" aria-hidden="true">${lucideIconSvg('sparkles', 26)}</span>
        <h3>Pasang API key DeepSeek</h3>
        <p>Asisten membaca saldo, budget, dan transaksimu lalu menjawab pertanyaan soal kondisi keuanganmu. Key disimpan hanya di browser ini, tidak ikut ke server.</p>
        <div class="ai-key-row">
          <input type="password" id="mmAiKeyInline" class="form-input" placeholder="Tempel API key di sini" autocomplete="off" spellcheck="false"
                 onkeydown="if(event.key==='Enter'){mmAiSaveKey('mmAiKeyInline');}">
          <button type="button" class="btn-primary" onclick="mmAiSaveKey('mmAiKeyInline')">Simpan</button>
        </div>
        <p class="ai-fine">Belum punya? Buat di <a href="${MM_AI_KEY_URL}" target="_blank" rel="noopener">platform.deepseek.com</a>.</p>
      </div>`;
    return;
  }

  if (!MM_AI_HISTORY.length) {
    log.innerHTML = `
      <div class="ai-intro">
        <span class="ai-intro-mark" aria-hidden="true">${lucideIconSvg('sparkles', 26)}</span>
        <h3>Tanya soal keuanganmu</h3>
        <p>Jawaban disusun dari saldo, budget, dan riwayat transaksimu, bukan angka karangan.</p>
        <div class="ai-suggest">
          ${MM_AI_SUGGESTIONS.map(s => `<button type="button" class="ai-chip" onclick="mmAiAsk('${jsStr(s)}')">${escapeHtml(s)}</button>`).join('')}
        </div>
      </div>`;
    return;
  }

  log.innerHTML = MM_AI_HISTORY.map((m, i) => mmAiMessageHtml(m, i)).join('');
  log.scrollTop = log.scrollHeight;
}

function mmAiMessageHtml(m, i) {
  const text = (m.parts || []).map(p => p.text || '').join('');
  if (m.role === 'user') return `<div class="ai-msg is-user"><div class="ai-bubble">${escapeHtml(text).replace(/\n/g, '<br>')}</div></div>`;
  const body = m.error
    ? `<div class="ai-error">${lucideIconSvg('alert-circle', 16)}<span>${escapeHtml(m.error)}</span>
         <button type="button" onclick="mmAiRetry()">Coba lagi</button></div>`
    : (text ? mmAiMarkdown(text)
      : `<span class="ai-typing" aria-label="Sedang menulis"><i></i><i></i><i></i></span>${m.status ? `<small class="ai-status">${escapeHtml(m.status)}</small>` : ''}`);
  return `<div class="ai-msg is-model" data-i="${i}"><span class="ai-avatar" aria-hidden="true">${lucideIconSvg('sparkles', 14)}</span><div class="ai-answer">${body}</div></div>`;
}

// Re-renders only the answer being written, so a long chat does not
// re-parse every earlier message on each streamed chunk.
function mmAiUpdateLast() {
  const log = document.getElementById('mmAiLog');
  if (!log) return;
  const i = MM_AI_HISTORY.length - 1;
  const node = log.querySelector(`.ai-msg[data-i="${i}"]`);
  if (!node) { mmAiRender(); return; }
  const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 120;
  node.outerHTML = mmAiMessageHtml(MM_AI_HISTORY[i], i);
  if (nearBottom) log.scrollTop = log.scrollHeight;
}

function mmAiSetBusy(busy) {
  MM_AI_BUSY = busy;
  const log = document.getElementById('mmAiLog');
  if (log) log.setAttribute('aria-busy', busy ? 'true' : 'false');
  const send = document.getElementById('mmAiSend');
  if (send) {
    send.innerHTML = busy ? lucideIconSvg('square', 16) : lucideIconSvg('send', 18);
    send.setAttribute('aria-label', busy ? 'Hentikan' : 'Kirim');
    send.classList.toggle('is-stop', busy);
  }
}

/* Minimal markdown: escape everything first, then add back the few
   constructs the model uses — bold, italic, code, headings, lists, tables. */
function mmAiInline(s) {
  return s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
}

function mmAiMarkdown(src) {
  const lines = escapeHtml(src).split('\n');
  let html = '', list = null, table = [];
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  const flushTable = () => {
    if (!table.length) return;
    const rows = table.filter(r => !/^\|?\s*:?-{2,}/.test(r));
    const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => mmAiInline(c.trim()));
    html += '<div class="ai-table"><table>' + rows.map((r, idx) =>
      '<tr>' + cells(r).map(c => idx === 0 ? `<th>${c}</th>` : `<td>${c}</td>`).join('') + '</tr>').join('') + '</table></div>';
    table = [];
  };
  lines.forEach(raw => {
    const line = raw.trimEnd();
    if (/^\s*\|.*\|\s*$/.test(line)) { closeList(); table.push(line.trim()); return; }
    flushTable();
    let m;
    if (!line.trim()) { closeList(); return; }
    if ((m = line.match(/^#{1,4}\s+(.*)$/))) { closeList(); html += `<h4>${mmAiInline(m[1])}</h4>`; return; }
    if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) {
      if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; }
      html += `<li>${mmAiInline(m[1])}</li>`; return;
    }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; }
      html += `<li>${mmAiInline(m[1])}</li>`; return;
    }
    closeList();
    html += `<p>${mmAiInline(line)}</p>`;
  });
  closeList(); flushTable();
  return html;
}

/* ---------- financial context ---------- */
function mmAiRp(v) {
  return 'Rp' + new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 }).format(Math.round(Number(v) || 0));
}

async function mmAiEnsureDashboard() {
  if (MM_DASHBOARD) return MM_DASHBOARD;
  try {
    return await new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).mmGetDashboard();
    });
  } catch (e) { return null; }
}

function mmAiCall(name, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args);
  });
}

// Each source on its own: a failure in one (say, the Investment Tracker
// tables are empty) still leaves the rest of the picture.
async function mmAiLoadExtra() {
  const [invest, investTx, summary] = await Promise.all([
    mmAiCall('getDashboardData').catch(() => null),
    mmAiCall('getHistoryData').catch(() => null),
    mmAiCall('mmGetSummaryRows').catch(() => [])
  ]);
  return { invest, investTx: (investTx && investTx.transactions) || [], summary: summary || [] };
}

function mmAiPct(fraction) {
  return (Number(fraction) * 100 || 0).toFixed(1).replace('.', ',') + '%';
}

function mmAiInvestContext(inv, txs) {
  if (!inv || !inv.summary) return '';
  const s = inv.summary, out = [];
  const pl = s.totalProfitLossIDR || 0;
  out.push(`\n## Investasi (Investment Tracker)\nDicatat terpisah dari akun Money Management di atas. Jangan menjumlahkan keduanya kecuali pengguna menanyakan total kekayaan; jika dijumlahkan, ingatkan bahwa bisa ada yang tercatat dua kali bila ada akun Money Management bertipe Investment.
- Nilai portofolio total: ${mmAiRp(s.totalPortfolioValueIDR)} (aset ${mmAiRp(s.totalInvestedAssetsIDR)} + kas di platform ${mmAiRp(s.totalCashIDR)})
- Modal di aset: ${mmAiRp(s.totalCapitalIDR)}; untung/rugi: ${pl >= 0 ? '+' : '−'}${mmAiRp(Math.abs(pl))} (${s.totalCapitalIDR > 0 ? mmAiPct(pl / s.totalCapitalIDR) : '0%'})
- Target "${(inv.target && inv.target.name) || 'Target'}": ${mmAiRp(inv.target && inv.target.amount)}; tercapai ${mmAiPct(s.progressPercent)}, kurang ${mmAiRp(s.remainingAmountIDR)}
- Rata-rata setoran per bulan: ${mmAiRp(s.averageMonthlyInvestmentIDR)}${s.estimatedMonthsLeft ? `; perkiraan target tercapai dalam ${s.estimatedMonthsLeft} bulan` : ''}`);

  const assets = (inv.portfolio || []).filter(a => a.Sector !== 'Cash' && ((a.TotalCapitalIDR || 0) !== 0 || (a.CurrentValueIDR || 0) !== 0))
    .sort((a, b) => (b.CurrentValueIDR || 0) - (a.CurrentValueIDR || 0));
  if (assets.length) out.push('\n## Portofolio per aset (platform | sektor | aset | modal | nilai sekarang | untung/rugi)\n' + assets.map(a =>
    `- ${a.Platform} | ${a.Sector} | ${a.Asset} | ${mmAiRp(a.TotalCapitalIDR)} | ${mmAiRp(a.CurrentValueIDR)} | ${(a.ProfitLossIDR || 0) >= 0 ? '+' : '−'}${mmAiRp(Math.abs(a.ProfitLossIDR || 0))} (${mmAiPct(a.GrowthPercent)})`).join('\n'));

  const sectors = (inv.allocationBySector || []).slice().sort((a, b) => (b.valueIDR || 0) - (a.valueIDR || 0));
  if (sectors.length) out.push('\n## Alokasi per sektor (nilai | aktual | target | status)\n' + sectors.map(x =>
    `- ${x.sector}: ${mmAiRp(x.valueIDR)} | ${mmAiPct((x.actualPercent || 0) / 100)} | ${x.targetPercent ? x.targetPercent + '%' : 'tanpa target'} | ${({ Balanced: 'seimbang', Overweight: 'kelebihan', Underweight: 'kekurangan', 'No Target': '-' })[x.status] || x.status}`).join('\n'));

  const cash = (inv.cashByPlatform || []).filter(c => c.cashBalanceIDR);
  if (cash.length) out.push('\n## Kas di tiap platform investasi\n' + cash.map(c => `- ${c.platform}: ${mmAiRp(c.cashBalanceIDR)}`).join('\n'));

  const reb = inv.rebalanceSuggestions || [];
  if (reb.length) out.push('\n## Saran rebalance dari aplikasi (membagi kas ke sektor yang kekurangan)\n' + reb.map(r =>
    `- ${r.sector}: ${mmAiRp(r.suggestedAmountIDR)} (aktual ${mmAiPct(r.actualPercent / 100)} vs target ${r.targetPercent}%)`).join('\n'));

  if (txs.length) out.push('\n## Transaksi investasi terakhir (tanggal | jenis | platform | sektor | aset | nominal | catatan)\n' + txs.map(t =>
    `${t.date} | ${t.transactionType} | ${t.platform || '-'} | ${t.sector || '-'} | ${t.asset || '-'} | ${mmAiRp(t.amountIDR)} | ${(t.notes || '').replace(/\s+/g, ' ').slice(0, 50)}`).join('\n'));
  return out.join('\n');
}

async function mmAiBuildContext() {
  const d = await mmAiEnsureDashboard();
  let all = MM_SEARCH_CACHE;
  if (!all && typeof mmLoadSearchData === 'function') all = await mmLoadSearchData();
  all = all || [];

  const out = [];
  const now = new Date();
  out.push(`Tanggal hari ini: ${new Intl.DateTimeFormat('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(now)} (${localISODate(now)}).`);

  if (d) {
    const ctx = mmMonthContext();
    out.push(`\n## Ringkasan\n- Total saldo (akun yang tampil di dashboard): ${mmAiRp(d.netWorth)}\n- Saldo akhir bulan lalu: ${mmAiRp(d.prevNetWorth)}\n- Hari ke-${ctx.day} dari ${ctx.daysInMonth}, sisa ${ctx.daysLeft} hari termasuk hari ini`);

    const accs = (d.accounts || []).slice().sort((a, b) => (b.balance || 0) - (a.balance || 0));
    if (accs.length) out.push('\n## Akun\n' + accs.map(a =>
      `- ${a.name} (${a.type || 'Lainnya'})${a.showOnDashboard ? '' : ' [tidak dihitung di total]'}: ${mmAiRp(a.balance)}`).join('\n'));

    const pm = d.prevMonth || {};
    out.push(`\n## Bulan ini (${ctx.monthName})\n- Pemasukan: ${mmAiRp(d.totalIncome)}\n- Pengeluaran: ${mmAiRp(d.totalExpense)}\n- Selisih (pemasukan − pengeluaran): ${mmAiRp(d.saving)}\n- Bulan lalu: pemasukan ${mmAiRp(pm.income)}, pengeluaran ${mmAiRp(pm.expense)}; pengeluaran bulan lalu sampai tanggal yang sama: ${mmAiRp(pm.expenseToDate)}`);

    const a = mmAllowance(d);
    out.push(`\n## Jatah belanja\n- Dana aman dibelanjakan sampai akhir bulan: ${mmAiRp(a.safe)}${a.capped ? ' (dibatasi oleh saldo yang ada)' : ''}\n- Jatah per hari: ${mmAiRp(a.todayBudget)}\n- Sudah dibelanjakan hari ini: ${mmAiRp(a.spentToday)}`);

    const cards = (d.allocationCards || []).filter(c => (c.target || 0) > 0 || (c.spent || 0) > 0);
    if (cards.length) {
      out.push(`\n## Budget per pos\nDana budget = sisa saldo bulan lalu (${mmAiRp(d.carryover)}) + pemasukan bulan ini, dibagi sesuai persentase tiap pos. Pos tabungan/investasi/dana darurat adalah target menabung, bukan batas belanja.\n` +
        cards.map(c => {
          const pct = c.target > 0 ? Math.round(c.spent / c.target * 100) : 0;
          if (MM_NON_SPEND_RE.test(c.category || '')) {
            return `- ${c.category} (${c.percent}%, target menabung): terkumpul ${mmAiRp(c.spent)} dari target ${mmAiRp(c.target)} (${pct}%)`;
          }
          return `- ${c.category} (${c.percent}%): terpakai ${mmAiRp(c.spent)} dari ${mmAiRp(c.target)} (${pct}%), sisa ${mmAiRp(c.target - c.spent)}`;
        }).join('\n'));
    }

    const trend = (d.netWorthTrend || []).slice(-12);
    if (trend.length) out.push('\n## Tren saldo akhir bulan\n' + trend.map(t => `- ${t.month}: ${mmAiRp(t.netWorth)}`).join('\n'));
  }

  // Monthly history by category: every transaction ever recorded, plus the
  // summaries of months whose transactions were archived.
  const extra = await (MM_AI_EXTRA || (MM_AI_EXTRA = mmAiLoadExtra()));
  const months = {};
  (extra.summary || []).forEach(r => {
    const m = r.year + '-' + String(r.month).padStart(2, '0');
    const b = months[m] || (months[m] = { inc: 0, exp: 0, cats: {} });
    if (r.type === 'Income') b.inc += r.amount || 0;
    else if (r.type === 'Expense') {
      b.exp += r.amount || 0;
      const c = r.category || 'Lainnya';
      b.cats[c] = (b.cats[c] || 0) + (r.amount || 0);
    }
  });
  all.forEach(tx => {
    const m = String(tx.date || '').slice(0, 7);
    if (!m) return;
    const r = months[m] || (months[m] = { inc: 0, exp: 0, cats: {} });
    if (tx.type === 'Income') r.inc += tx.amount || 0;
    else if (tx.type === 'Expense') {
      r.exp += tx.amount || 0;
      const c = tx.category || 'Lainnya';
      r.cats[c] = (r.cats[c] || 0) + (tx.amount || 0);
    }
  });
  const keys = Object.keys(months).sort();
  if (keys.length) {
    out.push('\n## Riwayat bulanan Money Management (semua bulan)\n' + keys.map(k => {
      const r = months[k];
      const cats = Object.entries(r.cats).sort((x, y) => y[1] - x[1]).slice(0, 8).map(([c, v]) => `${c} ${mmAiRp(v)}`).join(', ');
      return `- ${k}: masuk ${mmAiRp(r.inc)}, keluar ${mmAiRp(r.exp)}${cats ? ' — ' + cats : ''}`;
    }).join('\n'));
  }

  // Totals per category and subcategory, computed here: asked to add up a
  // list of transactions itself, the model gets a different (wrong) sum
  // every time.
  const ym = localISODate(now).slice(0, 7);
  const pmYm = localISODate(new Date(now.getFullYear(), now.getMonth() - 1, 1)).slice(0, 7);
  const breakdown = (month) => {
    const cats = {};
    all.forEach(tx => {
      if (tx.type !== 'Expense' || String(tx.date || '').slice(0, 7) !== month) return;
      const c = tx.category || 'Lainnya';
      const r = cats[c] || (cats[c] = { total: 0, n: 0, subs: {} });
      r.total += tx.amount || 0; r.n++;
      const sub = tx.subcategory || '(tanpa subkategori)';
      const sr = r.subs[sub] || (r.subs[sub] = { total: 0, n: 0 });
      sr.total += tx.amount || 0; sr.n++;
    });
    return Object.entries(cats).sort((x, y) => y[1].total - x[1].total).map(([c, r]) =>
      `- ${c}: ${mmAiRp(r.total)} (${r.n} transaksi)` + Object.entries(r.subs).sort((x, y) => y[1].total - x[1].total)
        .map(([sname, sr]) => `\n  - ${sname}: ${mmAiRp(sr.total)} (${sr.n}x)`).join('')).join('\n');
  };
  const bdNow = breakdown(ym), bdPrev = breakdown(pmYm);
  if (bdNow) out.push(`\n## Pengeluaran bulan ini per kategori & subkategori (sudah dijumlahkan)\n${bdNow}`);
  if (bdPrev) out.push(`\n## Pengeluaran bulan lalu per kategori & subkategori (sudah dijumlahkan)\n${bdPrev}`);

  // This month and last month in detail, newest first.
  const pmStart = localISODate(new Date(now.getFullYear(), now.getMonth() - 1, 1));
  const recent = all.filter(tx => (tx.date || '') >= pmStart)
    .sort((x, y) => (y.date || '').localeCompare(x.date || '')).slice(0, 300);
  if (recent.length) {
    out.push('\n## Transaksi bulan ini & bulan lalu (tanggal | jenis | kategori/sub | akun | nominal | catatan)\n' + recent.map(tx =>
      `${tx.date} | ${tx.type} | ${[tx.category, tx.subcategory].filter(Boolean).join('/') || '-'} | ${tx.account || '-'}${tx.accountTo ? ' → ' + tx.accountTo : ''} | ${mmAiRp(tx.amount)} | ${(tx.notes || '').replace(/\s+/g, ' ').slice(0, 60)}`).join('\n'));
  }

  const inv = mmAiInvestContext(extra.invest, extra.investTx);
  out.push(inv || '\n## Investasi (Investment Tracker)\n(Data investasi belum ada atau gagal dimuat.)');

  if (!d && !all.length) out.push('\n(Data keuangan belum berhasil dimuat.)');
  return out.join('\n');
}

const MM_AI_RULES = `Kamu adalah asisten keuangan pribadi di aplikasi MoneyMate. Pengguna bertanya soal kondisi keuangannya sendiri.

Aturan:
- Jawab dalam bahasa Indonesia yang santai tapi jelas, sapa pengguna dengan "kamu".
- Dasarkan setiap angka HANYA pada DATA KEUANGAN di bawah. Jangan mengarang angka. Jika data tidak cukup, katakan terus terang apa yang kurang.
- Untuk total, pakai angka yang SUDAH DIJUMLAHKAN di data (ringkasan, budget, per kategori/subkategori, riwayat bulanan). Jangan menjumlahkan ulang daftar transaksi sendiri; daftar transaksi hanya untuk melihat contoh atau detail.
- Tulis nominal dalam format rupiah, contoh Rp1.250.000 atau Rp1,25 jt.
- Ringkas: mulai dengan jawaban langsung (1–2 kalimat), lalu poin pendukung seperlunya. Maksimal sekitar 180 kata kecuali diminta lebih rinci.
- Gunakan daftar berpoin untuk rincian; hindari tabel kecuali diminta membandingkan banyak angka.
- Boleh memberi saran praktis (menghemat, mengatur budget, menabung), tapi jangan merekomendasikan membeli/menjual saham, kripto, atau produk investasi tertentu.
- Transfer antar akun bukan pengeluaran. Pos tabungan/investasi/dana darurat adalah target menabung.
- Data mencakup Money Management (akun, transaksi, budget) dan Investment Tracker (portofolio, alokasi sektor, target, transaksi investasi). Boleh membahas kinerja portofolio, alokasi, dan saran rebalance yang sudah dihitung aplikasi.`;

/* ---------- sending ---------- */
function mmAiAsk(text) {
  const input = document.getElementById('mmAiInput');
  if (input) input.value = text;
  mmAiSubmit();
}

function mmAiSubmit(e) {
  if (e) e.preventDefault();
  if (MM_AI_BUSY) { if (MM_AI_ABORT) MM_AI_ABORT.abort(); return; }
  const input = document.getElementById('mmAiInput');
  const text = (input && input.value || '').trim();
  if (!text) return;
  input.value = '';
  mmAiAutosize();
  MM_AI_HISTORY.push({ role: 'user', parts: [{ text }] });
  mmAiRun();
}

function mmAiRetry() {
  if (MM_AI_BUSY) return;
  const last = MM_AI_HISTORY[MM_AI_HISTORY.length - 1];
  if (last && last.role === 'model') MM_AI_HISTORY.pop();
  mmAiRun();
}

function mmAiKey(e) {
  // Enter sends on a keyboard; on a phone the return key adds a line and
  // the send button sends.
  if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(pointer: fine)').matches) {
    e.preventDefault();
    mmAiSubmit();
  }
}

function mmAiAutosize() {
  const el = document.getElementById('mmAiInput');
  if (!el) return;
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  el.style.overflowY = el.scrollHeight > 140 ? 'auto' : 'hidden';
}

async function mmAiRun() {
  const key = mmAiGetKey();
  if (!key) { mmAiRender(); return; }
  const answer = { role: 'model', parts: [{ text: '' }] };
  MM_AI_HISTORY.push(answer);
  mmAiRender();
  mmAiSetBusy(true);
  MM_AI_ABORT = new AbortController();

  try {
    const context = await mmAiBuildContext();
    const body = {
      model: MM_AI_MODEL,
      stream: true,
      temperature: 0.4,
      max_tokens: 4096,
      messages: [
        { role: 'system', content: MM_AI_RULES + '\n\n=== DATA KEUANGAN ===\n' + context },
        // Only finished turns go back to the model; the empty answer slot and
        // failed attempts stay local.
        ...MM_AI_HISTORY.filter(m => m !== answer && !m.error).map(m => ({
          role: m.role === 'model' ? 'assistant' : 'user',
          content: (m.parts || []).map(p => p.text || '').join('')
        }))
      ]
    };
    await mmAiStream(key, body, answer);
    if (!answer.parts[0].text.trim()) throw new Error('Tidak ada jawaban. Coba ulangi pertanyaannya.');
  } catch (err) {
    if (err && err.name === 'AbortError') {
      if (!answer.parts[0].text) MM_AI_HISTORY.pop();
    } else {
      answer.error = mmAiErrorText(err);
    }
  } finally {
    MM_AI_ABORT = null;
    mmAiSetBusy(false);
    mmAiRender();
  }
}

// DeepSeek streams in the OpenAI format: "data: {choices:[{delta}]}" lines
// ending with "data: [DONE]". The model reasons first (delta.reasoning_content,
// not shown) and then answers (delta.content). A busy server (429/5xx), a
// dropped connection or a request that never starts is retried with a short
// back-off; a bad key or an empty balance is not.
const MM_AI_FIRST_BYTE_MS = 25000;  // no response at all
const MM_AI_STALL_MS = 45000;       // nothing new mid-answer
const MM_AI_ATTEMPTS = 3;

function mmAiSleep(ms, signal) {
  return new Promise((resolve, reject) => {
    const t = setTimeout(resolve, ms);
    if (signal) signal.addEventListener('abort', () => { clearTimeout(t); reject(new DOMException('Aborted', 'AbortError')); }, { once: true });
  });
}

function mmAiRetryable(err) {
  if (!err) return false;
  if (err.timeout || err.empty || err.network) return true;
  return [408, 429, 500, 502, 503, 504].includes(err.status);
}

async function mmAiStream(key, body, answer) {
  const signal = MM_AI_ABORT.signal;
  let lastErr = null;
  for (let attempt = 0; attempt < MM_AI_ATTEMPTS; attempt++) {
    if (attempt) {
      answer.status = 'Server sedang sibuk, mencoba lagi…';
      mmAiUpdateLast();
      await mmAiSleep(1500 * attempt, signal);
    }
    try {
      await mmAiStreamOnce(key, body, answer);
      answer.status = '';
      return;
    } catch (err) {
      lastErr = err;
      if (signal.aborted) throw new DOMException('Aborted', 'AbortError');
      if (!mmAiRetryable(err)) throw err;
      // Cut off mid-answer: start over rather than leave half a reply.
      if (answer.parts[0].text) { answer.parts[0].text = ''; mmAiUpdateLast(); }
    }
  }
  throw lastErr;
}

async function mmAiStreamOnce(key, body, answer) {
  // One controller per attempt, cancelled by the stop button or our timers.
  const ctl = new AbortController();
  const parent = MM_AI_ABORT.signal;
  const onStop = () => ctl.abort();
  parent.addEventListener('abort', onStop, { once: true });
  let timedOut = false, timer = null;
  const arm = (ms) => { clearTimeout(timer); timer = setTimeout(() => { timedOut = true; ctl.abort(); }, ms); };
  const fail = (err) => {
    if (parent.aborted) return err;
    if (timedOut) { const e = new Error('timeout'); e.timeout = true; return e; }
    if (err instanceof TypeError) err.network = true;
    return err;
  };

  try {
    arm(MM_AI_FIRST_BYTE_MS);
    let res;
    try {
      res = await fetch(MM_AI_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify(body),
        signal: ctl.signal
      });
    } catch (e) { throw fail(e); }
    if (!res.ok) {
      let msg = '';
      try { msg = ((await res.json()).error || {}).message || ''; } catch (e) {}
      const err = new Error(msg || ('HTTP ' + res.status));
      err.status = res.status;
      throw err;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', got = false, thinking = false;
    arm(MM_AI_STALL_MS);
    for (;;) {
      let chunk;
      try { chunk = await reader.read(); } catch (e) { throw fail(e); }
      if (chunk.done) break;
      buf += decoder.decode(chunk.value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) !== -1) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') continue;
        let data;
        try { data = JSON.parse(payload); } catch (e) { continue; }
        if (data.error) {
          const err = new Error(data.error.message || 'stream error');
          err.status = Number(data.error.code) || 500;
          throw err;
        }
        const delta = ((data.choices || [])[0] || {}).delta || {};
        if (delta.reasoning_content && !got && !thinking) {
          thinking = true;
          answer.status = 'Menganalisis datamu…';
          mmAiUpdateLast();
        }
        if (delta.content) {
          if (!got) { got = true; answer.status = ''; }
          answer.parts[0].text += delta.content;
          mmAiUpdateLast();
        }
        // Reasoning chunks count as life too: the answer comes after them.
        arm(MM_AI_STALL_MS);
      }
    }
    if (!got) { const e = new Error('empty'); e.empty = true; throw e; }
  } finally {
    clearTimeout(timer);
    parent.removeEventListener('abort', onStop);
  }
}

function mmAiErrorText(err) {
  const s = err && err.status;
  if (s === 401) return 'API key DeepSeek tidak valid. Periksa lagi di Profil → AI Assistant.';
  if (s === 402) return 'Saldo DeepSeek habis. Isi ulang di platform.deepseek.com lalu coba lagi.';
  if (s === 422 || s === 400) return 'Permintaan ditolak DeepSeek. Coba ulangi dengan pertanyaan yang lebih singkat.';
  if (s === 429) return 'Terlalu banyak permintaan dalam waktu singkat. Tunggu sebentar lalu coba lagi.';
  if (err && (err.timeout || err.empty || [500, 502, 503, 504].includes(s))) return 'Server DeepSeek sedang sibuk. Ketuk Coba lagi sebentar lagi.';
  if (err && err.network) return 'Tidak bisa terhubung ke DeepSeek. Periksa koneksi internet.';
  return (err && err.message) || 'Terjadi kesalahan. Coba lagi.';
}
