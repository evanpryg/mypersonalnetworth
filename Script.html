<script>
  // Script_Db.html bootstrapper calls initApp() after connecting to Supabase.
  // No DOMContentLoaded listener needed here.

  let APP_SETTINGS = {};
  let ASSET_OPTIONS = [];
  let ALLOCATION_TARGETS = [];
  let LATEST_DASHBOARD_DATA = null;
  let HISTORY_DATA = { transactions: [] };
  let AMOUNTS_HIDDEN = (typeof safeStorage !== 'undefined' ? safeStorage.getItem('amountsHidden') : null) === 'true';

  function initApp() {
    if (window.appInitialized) return;
    window.appInitialized = true;

    // Initialize Lucide icons
    if (typeof lucide !== 'undefined') lucide.createIcons();

    setTodayDefaults();
    setupAssetPickerListeners();
    setupMoneyInputs();
    if (window.supabaseConnected) {
      loadSettings();
      loadAssetOptions();
      if (typeof loadAllocationTargets === 'function') {
        loadAllocationTargets();
      }
      loadDashboard();
      // History loads lazily when user visits the page

      // Load Money Management on startup (default workspace)
      if (typeof mmLoadDashboard === 'function') mmLoadDashboard();
    }

    // Apply global eye visibility state
    applyGlobalVisibility();
  }

  /* === GLOBAL AMOUNT VISIBILITY TOGGLE === */
  function toggleAmountVisibility() {
    AMOUNTS_HIDDEN = !AMOUNTS_HIDDEN;
    safeStorage.setItem('amountsHidden', AMOUNTS_HIDDEN);
    applyGlobalVisibility();
    refreshAllAmounts();
  }

  function applyGlobalVisibility() {
    const btn = document.getElementById('globalEyeBtn');
    if (!btn) return;
    const openIcon = btn.querySelector('.eye-icon-open');
    const closedIcon = btn.querySelector('.eye-icon-closed');
    if (AMOUNTS_HIDDEN) {
      btn.classList.add('hidden-mode');
      openIcon.style.display = 'none';
      closedIcon.style.display = 'block';
    } else {
      btn.classList.remove('hidden-mode');
      openIcon.style.display = 'block';
      closedIcon.style.display = 'none';
    }
  }

  function maskAmount(formatted) {
    if (AMOUNTS_HIDDEN) return '••••••';
    return formatted;
  }

  function refreshAllAmounts() {
    // Re-render Investment Dashboard
    if (LATEST_DASHBOARD_DATA) renderDashboard(LATEST_DASHBOARD_DATA);
    // Re-render MM Dashboard
    if (typeof MM_DASHBOARD !== 'undefined' && MM_DASHBOARD) mmRenderDashboard(MM_DASHBOARD);
    // Re-render Insight page
    if (typeof INSIGHT_DATA !== 'undefined' && INSIGHT_DATA) renderFinancialInsight(INSIGHT_DATA);
  }

  /* === NAVIGATION === */
  function showPage(pageId) {
    document.querySelectorAll('#investWorkspace .page').forEach(p => p.classList.remove('active-page'));
    const page = document.getElementById(pageId);
    if (page) page.classList.add('active-page');
    document.querySelectorAll('#investBottomTabs .tab-item').forEach(b => b.classList.remove('active'));
    const active = document.querySelector(`#investBottomTabs .tab-item[data-page="${pageId}"]`);
    if (active) active.classList.add('active');
    if (pageId === 'historyPage') loadHistory();
  }

  /* === FAB === */
  function toggleFab() {
    const btn = document.getElementById('fabBtn');
    const menu = document.getElementById('fabMenu');
    const overlay = document.getElementById('fabOverlay');
    const isOpen = btn.classList.contains('open');
    btn.classList.toggle('open');
    menu.classList.toggle('open');
    overlay.classList.toggle('hidden', isOpen);
  }

  /* === ACTION SHEET (Redesigned) === */
  let IV_TYPE = 'buy';
  let IV_SELECTED_PLATFORM = '';
  let IV_SELECTED_PLATFORM_TO = '';
  let IV_SELECTED_SECTOR = '';
  let IV_SELECTED_ASSET = '';

  function showActionSheet(mode) {
    const btn = document.getElementById('fabBtn');
    const menu = document.getElementById('fabMenu');
    const overlay = document.getElementById('fabOverlay');
    if (btn) btn.classList.remove('open');
    if (menu) menu.classList.remove('open');
    if (overlay) overlay.classList.add('hidden');

    // Reset state
    IV_SELECTED_PLATFORM = '';
    IV_SELECTED_PLATFORM_TO = '';
    IV_SELECTED_SECTOR = '';
    IV_SELECTED_ASSET = '';

    const typeMap = { buy: 'buy', sell: 'sell', value: 'value', transfer: 'transfer' };
    ivSwitchType(typeMap[mode] || 'buy');

    // Set date
    const today = localISODate();
    document.getElementById('ivDateHidden').value = today;
    ivUpdateDateDisplay();

    // Clear fields
    document.getElementById('ivAmountInput').value = '';
    document.getElementById('ivNotesInput').value = '';
    const customAsset = document.getElementById('ivAssetCustom');
    if (customAsset) customAsset.value = '';

    // Show sheet
    document.getElementById('actionSheet').classList.remove('hidden');

    // Focus amount
    setTimeout(() => document.getElementById('ivAmountInput').focus(), 300);

    // Render chips
    ivRenderPlatforms();
    ivRenderSectors();
    ivRenderAssets();
  }

  function closeActionSheet() {
    document.getElementById('actionSheet').classList.add('hidden');
  }

  function closeActionSheetBackdrop(event) {
    if (event.target === event.currentTarget) closeActionSheet();
  }

  function ivSwitchType(type) {
    IV_TYPE = type;
    document.querySelectorAll('#ivTypeTabs .tx-type-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.type === type);
    });

    const sectorSection = document.getElementById('ivSectorSection');
    const assetSection = document.getElementById('ivAssetSection');
    const dateSection = document.getElementById('ivDateSection');
    const assetLabel = document.getElementById('ivAssetLabel');
    const platformToSection = document.getElementById('ivPlatformToSection');
    const platformLabel = document.getElementById('ivPlatformLabel');

    if (type === 'transfer') {
      sectorSection.style.display = 'none';
      assetSection.style.display = 'none';
      dateSection.style.display = 'block';
      if (platformToSection) platformToSection.style.display = 'block';
      if (platformLabel) platformLabel.textContent = 'From Platform';
      ivRenderPlatformsTo();
    } else if (type === 'value') {
      sectorSection.style.display = 'block';
      assetSection.style.display = 'block';
      dateSection.style.display = 'none';
      assetLabel.textContent = 'Asset';
      if (platformToSection) platformToSection.style.display = 'none';
      if (platformLabel) platformLabel.textContent = 'Platform';
    } else {
      sectorSection.style.display = 'block';
      assetSection.style.display = 'block';
      dateSection.style.display = 'block';
      assetLabel.textContent = 'Asset';
      if (platformToSection) platformToSection.style.display = 'none';
      if (platformLabel) platformLabel.textContent = 'Platform';
    }

    ivRenderPlatforms();
    ivRenderSectors();
    ivRenderAssets();
    ivUpdateCashInfo();
  }

  function ivUpdateDateDisplay() {
    const input = document.getElementById('ivDateHidden');
    const labelEl = document.getElementById('ivDateLabel');
    const valueEl = document.getElementById('ivDateValue');
    const val = input.value;
    const today = localISODate();
    const yesterday = localISODate(new Date(Date.now() - 86400000));
    if (val === today) labelEl.textContent = 'Today';
    else if (val === yesterday) labelEl.textContent = 'Yesterday';
    else labelEl.textContent = '';
    const d = new Date(val + 'T00:00:00');
    valueEl.textContent = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  // Amount formatting for investment input
  document.addEventListener('DOMContentLoaded', () => {
    const ivAmt = document.getElementById('ivAmountInput');
    if (ivAmt) {
      ivAmt.addEventListener('input', () => {
        let raw = ivAmt.value.replace(/[^\d]/g, '');
        ivAmt.value = raw ? Number(raw).toLocaleString('id-ID') : '';
      });
    }
  });

  function ivRenderPlatforms() {
    const container = document.getElementById('ivPlatformChips');
    if (!container) return;
    const platforms = (APP_SETTINGS.Platform || []);
    container.innerHTML = platforms.map(p => {
      const isActive = IV_SELECTED_PLATFORM === p;
      return `<button class="tx-chip ${isActive ? 'active' : ''}" style="--chip-color:var(--accent)" onclick="ivSelectPlatform('${jsStr(p)}')">${escapeHtml(p)}</button>`;
    }).join('');
  }

  function ivSelectPlatform(name) {
    IV_SELECTED_PLATFORM = IV_SELECTED_PLATFORM === name ? '' : name;
    ivRenderPlatforms();
    ivRenderAssets();
    ivUpdateCashInfo();
    if (IV_TYPE === 'transfer') ivRenderPlatformsTo();
  }

  function ivGetPlatformCash(platform) {
    if (!platform || !LATEST_DASHBOARD_DATA) return 0;
    var item = LATEST_DASHBOARD_DATA.cashByPlatform.find(function(c) { return c.platform === platform; });
    return item ? item.cashBalanceIDR : 0;
  }

  function ivUpdateCashInfo() {
    var el = document.getElementById('ivCashInfo');
    if (!el) return;
    if (!IV_SELECTED_PLATFORM || (IV_TYPE !== 'buy' && IV_TYPE !== 'sell' && IV_TYPE !== 'transfer')) {
      el.style.display = 'none';
      return;
    }
    var cash = ivGetPlatformCash(IV_SELECTED_PLATFORM);
    el.style.display = 'block';
    el.className = 'iv-cash-info';
    el.textContent = 'Cash ' + IV_SELECTED_PLATFORM + ': ' + maskAmount('Rp ' + cash.toLocaleString('id-ID'));
  }

  function ivRenderPlatformsTo() {
    const container = document.getElementById('ivPlatformToChips');
    if (!container) return;
    // Drop a stale target before rendering, or the chips are drawn from a
    // selection that is about to be cleared.
    const platforms = (APP_SETTINGS.Platform || []).filter(p => p !== IV_SELECTED_PLATFORM);
    if (IV_SELECTED_PLATFORM_TO && !platforms.includes(IV_SELECTED_PLATFORM_TO)) {
      IV_SELECTED_PLATFORM_TO = '';
    }
    container.innerHTML = platforms.map(p => {
      const isActive = IV_SELECTED_PLATFORM_TO === p;
      return `<button class="tx-chip ${isActive ? 'active' : ''}" style="--chip-color:#8b5cf6" onclick="ivSelectPlatformTo('${jsStr(p)}')">${escapeHtml(p)}</button>`;
    }).join('');
  }

  function ivSelectPlatformTo(name) {
    IV_SELECTED_PLATFORM_TO = IV_SELECTED_PLATFORM_TO === name ? '' : name;
    ivRenderPlatformsTo();
  }

  function ivRenderSectors() {
    const container = document.getElementById('ivSectorChips');
    if (!container) return;
    const sectors = (APP_SETTINGS.Sector || []);
    const colors = ['#22d3ee','#fbbf24','#818cf8','#f472b6','#a78bfa','#2dd4bf'];
    container.innerHTML = sectors.map((s, i) => {
      const isActive = IV_SELECTED_SECTOR === s;
      return `<button class="tx-chip ${isActive ? 'active' : ''}" style="--chip-color:${colors[i % colors.length]}" onclick="ivSelectSector('${jsStr(s)}')">${escapeHtml(s)}</button>`;
    }).join('');
  }

  function ivSelectSector(name) {
    IV_SELECTED_SECTOR = IV_SELECTED_SECTOR === name ? '' : name;
    ivRenderSectors();
    ivRenderAssets();
  }

  function ivRenderAssets() {
    const container = document.getElementById('ivAssetChips');
    const customInput = document.getElementById('ivAssetCustom');
    if (!container) return;

    // For sell/value, show existing assets from portfolio
    if ((IV_TYPE === 'sell' || IV_TYPE === 'value') && ASSET_OPTIONS.length) {
      let filtered = ASSET_OPTIONS;
      if (IV_SELECTED_PLATFORM) filtered = filtered.filter(a => a.platform === IV_SELECTED_PLATFORM);
      if (IV_SELECTED_SECTOR) filtered = filtered.filter(a => a.sector === IV_SELECTED_SECTOR);

      container.innerHTML = filtered.slice(0, 8).map(a => {
        const isActive = IV_SELECTED_ASSET === a.asset;
        return `<button class="tx-chip tx-chip-sm ${isActive ? 'active' : ''}" style="--chip-color:var(--accent2)" onclick="ivSelectAsset('${jsStr(a.asset)}')">${escapeHtml(a.asset)}</button>`;
      }).join('');
      if (customInput) customInput.style.display = 'none';
    } else if (IV_TYPE === 'buy') {
      // Buy: show recent assets + text input for new
      const recent = ASSET_OPTIONS.slice(0, 6);
      container.innerHTML = recent.map(a => {
        const isActive = IV_SELECTED_ASSET === a.asset;
        return `<button class="tx-chip tx-chip-sm ${isActive ? 'active' : ''}" style="--chip-color:var(--accent2)" onclick="ivSelectAsset('${jsStr(a.asset)}')">${escapeHtml(a.asset)}</button>`;
      }).join('');
      if (customInput) customInput.style.display = 'block';
    } else {
      container.innerHTML = '';
      if (customInput) customInput.style.display = 'none';
    }
  }

  function ivSelectAsset(name) {
    IV_SELECTED_ASSET = IV_SELECTED_ASSET === name ? '' : name;
    const customInput = document.getElementById('ivAssetCustom');
    if (customInput && IV_SELECTED_ASSET) customInput.value = IV_SELECTED_ASSET;
    ivRenderAssets();
  }

  function ivSubmit() {
    const amountRaw = document.getElementById('ivAmountInput').value.replace(/[^\d]/g, '');
    const amount = Number(amountRaw);
    const date = document.getElementById('ivDateHidden').value;
    const notes = document.getElementById('ivNotesInput').value;
    const customAsset = document.getElementById('ivAssetCustom');

    if (!amount || amount <= 0) {
      showToast('Masukkan nominal.', 'error');
      return;
    }
    if (!IV_SELECTED_PLATFORM) {
      showToast('Pilih platform.', 'error');
      return;
    }

    const btn = document.getElementById('ivSaveBtn');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    if (IV_TYPE === 'transfer') {
      // Transfer cash between platforms
      if (!IV_SELECTED_PLATFORM_TO) { showToast('Pilih platform tujuan.', 'error'); btn.disabled = false; btn.textContent = 'Save Transaction'; return; }
      if (IV_SELECTED_PLATFORM === IV_SELECTED_PLATFORM_TO) { showToast('Platform asal dan tujuan harus berbeda.', 'error'); btn.disabled = false; btn.textContent = 'Save Transaction'; return; }
      const transferCash = ivGetPlatformCash(IV_SELECTED_PLATFORM);
      if (amount > transferCash) {
        showToast('Cash ' + IV_SELECTED_PLATFORM + ' tidak cukup (Rp ' + transferCash.toLocaleString('id-ID') + ').', 'error');
        btn.disabled = false; btn.textContent = 'Save Transaction';
        return;
      }
      google.script.run
        .withSuccessHandler(r => ivHandleSuccess(r, btn))
        .withFailureHandler(e => ivHandleError(e, btn))
        .addCashTransfer({ date, fromPlatform: IV_SELECTED_PLATFORM, toPlatform: IV_SELECTED_PLATFORM_TO, amountIDR: amount, notes });
    } else if (IV_TYPE === 'buy') {
      const asset = IV_SELECTED_ASSET || (customAsset ? customAsset.value : '');
      if (!IV_SELECTED_SECTOR || !asset) { showToast('Pilih sector dan asset.', 'error'); btn.disabled = false; btn.textContent = 'Save Transaction'; return; }
      const availCash = ivGetPlatformCash(IV_SELECTED_PLATFORM);
      if (amount > availCash) {
        showToast('Cash ' + IV_SELECTED_PLATFORM + ' tidak cukup (Rp ' + availCash.toLocaleString('id-ID') + ').', 'error');
        btn.disabled = false; btn.textContent = 'Save Transaction';
        return;
      }
      google.script.run
        .withSuccessHandler(r => ivHandleSuccess(r, btn))
        .withFailureHandler(e => ivHandleError(e, btn))
        .addTransaction({ date, platform: IV_SELECTED_PLATFORM, sector: IV_SELECTED_SECTOR, asset, amountIDR: amount, transactionType: 'Buy', notes });
    } else if (IV_TYPE === 'sell') {
      if (!IV_SELECTED_SECTOR || !IV_SELECTED_ASSET) { showToast('Pilih sector dan asset.', 'error'); btn.disabled = false; btn.textContent = 'Save Transaction'; return; }
      google.script.run
        .withSuccessHandler(r => ivHandleSuccess(r, btn))
        .withFailureHandler(e => ivHandleError(e, btn))
        .addTransaction({ date, platform: IV_SELECTED_PLATFORM, sector: IV_SELECTED_SECTOR, asset: IV_SELECTED_ASSET, amountIDR: amount, transactionType: 'Sell', notes });
    } else if (IV_TYPE === 'value') {
      const asset = IV_SELECTED_ASSET || (customAsset ? customAsset.value : '');
      if (!IV_SELECTED_SECTOR || !asset) { showToast('Pilih sector dan asset.', 'error'); btn.disabled = false; btn.textContent = 'Save Transaction'; return; }
      google.script.run
        .withSuccessHandler(r => ivHandleSuccess(r, btn))
        .withFailureHandler(e => ivHandleError(e, btn))
        .updateAssetValue({ platform: IV_SELECTED_PLATFORM, sector: IV_SELECTED_SECTOR, asset, currentValueIDR: amount });
    }
  }

  function ivHandleSuccess(result, btn) {
    btn.disabled = false;
    if (result && result.success) {
      btn.textContent = '✓ Saved!';
      btn.style.background = 'var(--success)';
      setTimeout(() => {
        btn.textContent = 'Save Transaction';
        btn.style.background = '';
        closeActionSheet();
      }, 800);
      LATEST_DASHBOARD_DATA = null;
      loadDashboard();
      loadAssetOptions();
    } else {
      btn.textContent = 'Save Transaction';
      showToast('Failed.', 'error');
    }
  }

  function ivHandleError(err, btn) {
    btn.disabled = false;
    btn.textContent = 'Save Transaction';
    showToast(err.message || 'Failed.', 'error');
  }

  /* === SETTINGS SECTION NAV ===
     Chips at the top of each settings page jump to a section; the chip for
     whichever section is on screen stays highlighted while scrolling. */
  function settingsJump(event, sectionId) {
    if (event) event.preventDefault();
    const section = document.getElementById(sectionId);
    if (!section) return;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    section.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    setSettingsNavActive(section.closest('.settings-page'), sectionId);
  }

  function setSettingsNavActive(page, sectionId) {
    if (!page) return;
    page.querySelectorAll('.settings-nav-chip').forEach(chip => {
      const on = chip.getAttribute('href') === '#' + sectionId;
      chip.classList.toggle('active', on);
      if (on) chip.setAttribute('aria-current', 'true'); else chip.removeAttribute('aria-current');
    });
  }

  function initSettingsNav() {
    if (!('IntersectionObserver' in window)) return;
    document.querySelectorAll('.settings-page').forEach(page => {
      const observer = new IntersectionObserver(entries => {
        const visible = entries.filter(e => e.isIntersecting)
          .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
        if (visible) setSettingsNavActive(page, visible.target.id);
      }, { rootMargin: '-140px 0px -55% 0px' });
      page.querySelectorAll('.set-section').forEach(s => observer.observe(s));
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initSettingsNav);
  else initSettingsNav();

  /* === COLLAPSIBLE PANELS === */
  function togglePanel(panelId) {
    const panel = document.getElementById(panelId);
    const chevron = document.getElementById(panelId.replace('Panel','Chevron'));
    if (!panel) return;
    const isHidden = panel.classList.contains('hidden');
    panel.classList.toggle('hidden');
    if (chevron) {
      chevron.textContent = isHidden ? '↑' : '↓';
      chevron.classList.toggle('is-open', isHidden);
    }
    const toggle = chevron && chevron.closest('button');
    if (toggle) toggle.setAttribute('aria-expanded', String(isHidden));
  }

  /* === ALLOCATION TABS === */
  function switchAllocTab(tab) {
    const sectorList = document.getElementById('allocationFocusList');
    const platformList = document.getElementById('platformCashList');
    if (!sectorList || !platformList) return;
    const isSector = tab !== 'platform';
    sectorList.style.display = isSector ? '' : 'none';
    platformList.style.display = isSector ? 'none' : '';
    document.getElementById('ivAllocTabSector')?.classList.toggle('active', isSector);
    document.getElementById('ivAllocTabPlatform')?.classList.toggle('active', !isSector);
    IV_ALLOC_TAB = isSector ? 'balance' : 'platform';
    ivAllocSubtitle();
  }

  let IV_ALLOC_TAB = 'balance';
  function ivAllocSubtitle() {
    const data = LATEST_DASHBOARD_DATA;
    if (!data) return;
    const count = IV_ALLOC_TAB === 'platform'
      ? `${ivGroupPlatforms(data.portfolio).length} platform`
      : `${(data.allocationBySector || []).length} sektor`;
    setText('allocationTotalText', `${count} · ${ivFull(data.summary.totalPortfolioValueIDR || 0)}`);
  }

  /* === PLATFORM GROUPING ===
     Portfolio rows folded into one entry per account: total, idle cash,
     open holdings (biggest first) and the return on what is invested.
     Fully sold positions (value 0) are left out. */
  function ivGroupPlatforms(portfolio) {
    const map = {};
    (portfolio || []).forEach(item => {
      const name = item.Platform || 'Lainnya';
      const p = map[name] || (map[name] = { platform: name, value: 0, cash: 0, invested: 0, capital: 0, pl: 0, holdings: [] });
      const v = Number(item.CurrentValueIDR) || 0;
      if (item.Sector === 'Cash') {
        p.cash += v;
        p.value += v;
        return;
      }
      if (v === 0) return;
      p.value += v;
      p.invested += v;
      p.capital += Number(item.TotalCapitalIDR) || 0;
      p.pl += Number(item.ProfitLossIDR) || 0;
      p.holdings.push(item);
    });
    return Object.values(map)
      .filter(p => p.value !== 0 || p.holdings.length)
      .map(p => {
        p.holdings.sort((a, b) => (Number(b.CurrentValueIDR) || 0) - (Number(a.CurrentValueIDR) || 0));
        p.ret = p.capital > 0 ? p.pl / p.capital : null;
        return p;
      })
      .sort((a, b) => b.value - a.value);
  }

  /* === PLATFORM BREAKDOWN (dashboard tab) ===
     Value per platform with how much of it is uninvested cash. Each row
     opens that platform's full breakdown on the Platform page. */
  function renderPlatformCash(portfolio) {
    const container = document.getElementById('platformCashList');
    if (!container) return;
    const platforms = ivGroupPlatforms(portfolio);
    if (!platforms.length) {
      container.innerHTML = '<div class="empty-state">Belum ada data platform.</div>';
      return;
    }
    const total = platforms.reduce((s, i) => s + i.value, 0);
    const max = Math.max(...platforms.map(p => p.value), 1);

    container.innerHTML = platforms.map(p => {
      const cls = p.ret === null ? '' : p.ret > 0 ? 'positive' : p.ret < 0 ? 'negative' : '';
      return `
        <button type="button" class="iv-alloc-row iv-alloc-link" onclick="ivOpenPlatform('${jsStr(p.platform)}')" aria-label="Lihat rincian ${escapeHtml(p.platform)}">
          <div class="iv-alloc-top">
            <span class="iv-alloc-name">${escapeHtml(p.platform)}<i data-lucide="chevron-right" class="iv-alloc-chev" aria-hidden="true"></i></span>
            <span class="iv-alloc-pct"><strong>${total > 0 ? ivPct(p.value / total) : '0%'}</strong></span>
          </div>
          <div class="iv-alloc-bar">
            <span class="iv-alloc-fill" style="width:${Math.max(p.value, 0) / max * 100}%;background:var(--accent)"></span>
          </div>
          <div class="iv-alloc-meta">
            <span class="iv-alloc-amount">${ivFull(p.value)}${p.ret !== null ? ` · <span class="${cls}">${ivPct(p.ret, true)}</span>` : ''}</span>
            <span class="iv-status status-muted">Saldo ${ivFull(p.cash)}</span>
          </div>
        </button>`;
    }).join('');
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  /* === PLATFORM PAGE ===
     Every account as an open card: total and return up top, a stacked bar
     of where the money sits, then saldo + each holding in full rupiah. */
  const IV_PF_COLLAPSED = new Set();

  function ivPlatformInitials(name) {
    const words = String(name || '?').trim().split(/\s+/);
    const txt = words.length > 1 ? words[0][0] + words[1][0] : words[0].substring(0, 2);
    return txt.toUpperCase();
  }

  function renderPlatformAccounts(portfolio) {
    const list = document.getElementById('ivPfList');
    const sub = document.getElementById('ivPfSub');
    const overview = document.getElementById('ivPfOverview');
    if (!list) return;
    const platforms = ivGroupPlatforms(portfolio);
    if (!platforms.length) {
      if (sub) sub.innerHTML = '&nbsp;';
      if (overview) overview.innerHTML = '';
      list.innerHTML = '<div class="empty-state">Belum ada platform. Catat deposit atau pembelian pertama lewat tombol +.</div>';
      return;
    }

    const total = platforms.reduce((s, p) => s + p.value, 0);
    const totalCash = platforms.reduce((s, p) => s + p.cash, 0);
    const totalInvested = platforms.reduce((s, p) => s + p.invested, 0);
    if (sub) sub.textContent = `${platforms.length} platform · ${platforms.reduce((s, p) => s + p.holdings.length, 0)} aset`;
    if (overview) {
      overview.innerHTML = `
        <div class="iv-pf-ov-total">
          <span>Total semua platform</span>
          <strong>${ivFull(total)}</strong>
        </div>
        <div class="iv-pf-ov-split">
          <div><span>Diinvestasikan</span><strong>${ivFull(totalInvested)}</strong></div>
          <div><span>Saldo cash</span><strong>${ivFull(totalCash)}</strong></div>
        </div>`;
    }

    list.innerHTML = platforms.map(p => {
      const share = total > 0 ? p.value / total : 0;
      const retCls = p.ret === null ? '' : p.ret > 0 ? 'positive' : p.ret < 0 ? 'negative' : '';
      const plLine = p.ret === null
        ? '<span class="iv-muted-2">Belum ada aset</span>'
        : `<span class="${retCls}">${ivFull(p.pl, true)} (${ivPct(p.ret, true)})</span><span class="iv-muted-2">belum direalisasi</span>`;

      // Stacked bar: cash in slate, holdings in their sector colour.
      const barBase = Math.max(p.value, 1);
      const segs = (p.cash > 0 ? [{ v: p.cash, c: ivSectorColor('Cash'), t: 'Saldo' }] : [])
        .concat(p.holdings.map(h => ({ v: Number(h.CurrentValueIDR) || 0, c: ivSectorColor(h.Sector), t: h.Asset })))
        .filter(s => s.v > 0)
        .map(s => `<span style="width:${s.v / barBase * 100}%;background:${s.c}" title="${escapeHtml(s.t)}"></span>`)
        .join('');

      const cashShare = p.value > 0 ? p.cash / p.value : 0;
      const cashRow = `
        <div class="iv-pf-row">
          <span class="iv-pf-icon iv-pf-icon-cash" aria-hidden="true"><i data-lucide="wallet"></i></span>
          <span class="iv-pf-info">
            <span class="iv-pf-name">Saldo</span>
            <span class="iv-pf-meta">Cash · ${ivPct(cashShare)}</span>
          </span>
          <span class="iv-pf-nums">
            <strong class="${p.cash < 0 ? 'negative' : ''}">${ivFull(p.cash)}</strong>
          </span>
        </div>`;

      const holdingRows = p.holdings.map(h => {
        const value = Number(h.CurrentValueIDR) || 0;
        const capital = Number(h.TotalCapitalIDR) || 0;
        const pl = Number(h.ProfitLossIDR) || 0;
        const cls = pl > 0 ? 'positive' : pl < 0 ? 'negative' : '';
        const color = ivSectorColor(h.Sector);
        return `
          <div class="iv-pf-row">
            <span class="iv-pf-icon" style="background:${color}22;color:${color}" aria-hidden="true">${escapeHtml(String(h.Asset || '?').substring(0, 3).toUpperCase())}</span>
            <span class="iv-pf-info">
              <span class="iv-pf-name">${escapeHtml(h.Asset)}</span>
              <span class="iv-pf-meta">${escapeHtml(h.Sector)} · ${ivPct(p.value > 0 ? value / p.value : 0)}</span>
            </span>
            <span class="iv-pf-nums">
              <strong>${ivFull(value)}</strong>
              <span class="${cls}">${ivPct(h.GrowthPercent, true)} · ${ivFull(pl, true)}</span>
              <small>modal ${ivFull(capital)}</small>
            </span>
          </div>`;
      }).join('');

      const open = !IV_PF_COLLAPSED.has(p.platform);
      return `
        <details class="iv-pf-card" data-platform="${escapeHtml(p.platform)}" ${open ? 'open' : ''} ontoggle="ivPfToggle(this)">
          <summary class="iv-pf-summary">
            <span class="iv-pf-head-row">
              <span class="iv-pf-avatar" aria-hidden="true">${escapeHtml(ivPlatformInitials(p.platform))}</span>
              <span class="iv-pf-title">
                <strong>${escapeHtml(p.platform)}</strong>
                <small>${p.holdings.length} aset · ${ivPct(share)} portofolio</small>
              </span>
              <i data-lucide="chevron-down" class="iv-pf-chev" aria-hidden="true"></i>
            </span>
            <span class="iv-pf-total">${ivFull(p.value)}</span>
            <span class="iv-pf-pl">${plLine}</span>
            <span class="iv-pf-bar" aria-hidden="true">${segs}</span>
          </summary>
          <div class="iv-pf-rows">${cashRow}${holdingRows}</div>
        </details>`;
    }).join('');
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  /* === RENDER DASHBOARD === */
  const IV_SECTOR_COLORS = ['#60a5fa','#22d3ee','#fbbf24','#818cf8','#f472b6','#34d399','#fb923c','#94a3b8'];
  let IV_SECTOR_COLOR_MAP = {};
  let IV_HOLDINGS_SORT = 'value';
  let IV_HOLDINGS_EXPANDED = false;

  // Compact rupiah ("Rp 2,6 jt") for dense rows; honours the hide toggle.
  function ivShort(value) {
    if (AMOUNTS_HIDDEN) return '••••';
    const v = Number(value) || 0;
    const abs = Math.abs(v);
    const dec = (x) => x.toFixed(1).replace(/\.0$/, '').replace('.', ',');
    let out;
    if (abs >= 1e9) out = dec(abs / 1e9) + ' M';
    else if (abs >= 1e6) out = dec(abs / 1e6) + ' jt';
    else if (abs >= 1e3) out = Math.round(abs / 1e3) + ' rb';
    else out = String(Math.round(abs));
    return (v < 0 ? '-' : '') + 'Rp ' + out;
  }

  // Full rupiah ("Rp 5.986.173") wherever the exact figure matters;
  // signed adds +/- in front. Honours the hide toggle.
  function ivFull(value, signed) {
    if (AMOUNTS_HIDDEN) return '••••••';
    const v = Math.round(Number(value) || 0);
    const body = 'Rp ' + Math.abs(v).toLocaleString('id-ID');
    if (signed) return (v > 0 ? '+' : v < 0 ? '-' : '') + body;
    return (v < 0 ? '-' : '') + body;
  }

  function ivPct(fraction, signed) {
    const v = (Number(fraction) || 0) * 100;
    const txt = Math.abs(v).toFixed(1).replace('.', ',') + '%';
    if (!signed) return txt;
    return (v > 0 ? '+' : v < 0 ? '-' : '') + txt;
  }

  function ivSectorColor(sector) {
    if (!IV_SECTOR_COLOR_MAP[sector]) {
      const n = Object.keys(IV_SECTOR_COLOR_MAP).length;
      IV_SECTOR_COLOR_MAP[sector] = sector === 'Cash' ? '#94a3b8' : IV_SECTOR_COLORS[n % IV_SECTOR_COLORS.length];
    }
    return IV_SECTOR_COLOR_MAP[sector];
  }

  function renderDashboard(data) {
    LATEST_DASHBOARD_DATA = data;
    const summary = data.summary;
    const target = data.target;
    fillTargetForm(target);

    // Stable colours: biggest sector first gets the first colour.
    IV_SECTOR_COLOR_MAP = {};
    [...(data.allocationBySector || [])].sort((a, b) => b.valueIDR - a.valueIDR).forEach(i => ivSectorColor(i.sector));

    const total = summary.totalPortfolioValueIDR || 0;
    const capital = summary.totalCapitalIDR || 0;
    const pl = summary.totalProfitLossIDR || 0;
    const plPct = capital > 0 ? pl / capital : 0;

    setText('mainTargetTitle', target.name || 'First 100 Million');
    setText('progressMainValue', formatIDR(total));

    const badge = document.getElementById('ivPlBadge');
    if (badge) {
      badge.textContent = (pl >= 0 ? '↑ ' : '↓ ') + ivPct(Math.abs(plPct));
      badge.className = 'mm-change-badge ' + (pl >= 0 ? 'up' : 'down');
    }
    const plEl = document.getElementById('ivPlAmount');
    if (plEl) {
      plEl.textContent = ivFull(pl, true);
      plEl.className = 'iv-pl-amount ' + (pl > 0 ? 'positive' : pl < 0 ? 'negative' : '');
    }

    const progress = Math.min(summary.progressPercent || 0, 1);
    const progressDisplay = Math.round(progress * 1000) / 10;
    setText('mainProgressText', String(progressDisplay).replace('.', ',') + '%');
    setText('progressTargetText', `dari ${ivShort(target.amount)} · kurang ${ivShort(summary.remainingAmountIDR)}`);
    setStyle('mainProgressFill', 'width', `${progress * 100}%`);
    const bar = document.getElementById('ivGoalBar');
    if (bar) bar.setAttribute('aria-valuenow', String(Math.round(progress * 100)));
    setText('heroNote', buildHeroNote(progress * 100, summary));

    setText('ivStatCapital', ivShort(capital));
    setText('ivStatAssets', ivShort(summary.totalInvestedAssetsIDR));
    setText('ivStatCash', ivShort(summary.totalCashIDR));

    ivAllocSubtitle();

    renderAllocationFocus(data.allocationBySector || [], total, data.portfolio || []);
    renderNextMove(data.allocationBySector || [], data.cashByPlatform || [], summary);
    renderDcaSuggestions(data.rebalanceSuggestions || [], summary.totalCashIDR || 0);
    renderPortfolio(data.portfolio || []);
    renderDcaPlanSimulator();
    renderPlatformCash(data.portfolio || []);
    renderPlatformAccounts(data.portfolio || []);
  }

  function buildHeroNote(progress, summary) {
    const months = summary.estimatedMonthsLeft;
    const avg = summary.averageMonthlyInvestmentIDR || 0;
    if (progress >= 100) return 'Target tercapai. Saatnya pasang target berikutnya.';
    if (progress <= 0) return 'Mulai catat investasi pertamamu.';
    if (months && avg > 0) {
      const eta = new Date();
      eta.setMonth(eta.getMonth() + months);
      const when = new Intl.DateTimeFormat('id-ID', { month: 'short', year: 'numeric' }).format(eta);
      return `Dengan setoran rata-rata ${ivShort(avg)}/bulan, target tercapai ± ${when} (${months} bulan).`;
    }
    return 'Setor rutin tiap bulan supaya perkiraan waktu tercapai bisa dihitung.';
  }

  function fillTargetForm(target) {
    const nameInput = document.getElementById('targetNameInput');
    const amountInput = document.getElementById('targetAmountInput');
    if (nameInput) nameInput.value = target.name || '';
    if (amountInput) amountInput.value = target.amount || '';
  }

  /* Actual vs target per sector on one shared scale, with the target drawn
     as a tick on the bar, plus the sector's own return. */
  function renderAllocationFocus(items, total, portfolio) {
    const container = document.getElementById('allocationFocusList');
    if (!container) return;
    if (!items.length || total <= 0) {
      container.innerHTML = '<div class="empty-state">Belum ada data alokasi.</div>';
      return;
    }

    const perf = {};
    (portfolio || []).forEach(p => {
      if (p.Sector === 'Cash') return;
      if (!perf[p.Sector]) perf[p.Sector] = { capital: 0, pl: 0 };
      perf[p.Sector].capital += Number(p.TotalCapitalIDR) || 0;
      perf[p.Sector].pl += Number(p.ProfitLossIDR) || 0;
    });

    const scale = Math.max(...items.map(i => Math.max(i.actualPercent || 0, i.targetPercent || 0)), 1) * 1.08;
    const statusLabel = { Balanced: 'Seimbang', Overweight: 'Lebih', Underweight: 'Kurang', 'No Target': 'Tanpa target' };

    container.innerHTML = [...items]
      .sort((a, b) => b.valueIDR - a.valueIDR)
      .map(item => {
        const color = ivSectorColor(item.sector);
        const actual = item.actualPercent || 0;
        const targetPct = item.targetPercent || 0;
        const p = perf[item.sector];
        const ret = p && p.capital > 0 ? p.pl / p.capital : null;
        const retCls = ret === null ? '' : ret > 0 ? 'positive' : ret < 0 ? 'negative' : '';
        const status = item.status || 'No Target';
        const diffTxt = targetPct ? ` ${item.difference >= 0 ? '+' : ''}${item.difference.toFixed(1).replace('.', ',')}` : '';
        return `
          <div class="iv-alloc-row">
            <div class="iv-alloc-top">
              <span class="iv-alloc-name"><span class="sector-dot" style="background:${color}"></span>${escapeHtml(item.sector)}</span>
              <span class="iv-alloc-pct"><strong>${actual.toFixed(1).replace('.', ',')}%</strong>${targetPct ? `<small>/ ${targetPct.toFixed(0)}%</small>` : ''}</span>
            </div>
            <div class="iv-alloc-bar">
              <span class="iv-alloc-fill" style="width:${actual / scale * 100}%;background:${color}"></span>
              ${targetPct ? `<span class="iv-alloc-target" style="left:${targetPct / scale * 100}%" title="Target ${targetPct}%"></span>` : ''}
            </div>
            <div class="iv-alloc-meta">
              <span class="iv-alloc-amount">${ivFull(item.valueIDR)}${ret !== null ? ` · <span class="${retCls}">${ivPct(ret, true)}</span>` : ''}</span>
              <span class="iv-status ${getStatusClass(status)}">${statusLabel[status] || escapeHtml(status)}${diffTxt}</span>
            </div>
          </div>`;
      }).join('');
  }

  function getStatusClass(status) {
    if (status === 'Balanced') return 'status-balanced';
    if (status === 'Overweight') return 'status-overweight';
    if (status === 'Underweight') return 'status-underweight';
    return 'status-muted';
  }

  function renderNextMove(allocationItems, cashItems, summary) {
    const titleEl = document.getElementById('nextMoveTitle');
    const textEl = document.getElementById('nextMoveText');
    if (!titleEl || !textEl) return;
    const total = summary.totalPortfolioValueIDR || 0;
    if (!allocationItems.length || total <= 0) {
      titleEl.textContent = 'Mulai dari catatan pertama.';
      textEl.textContent = 'Tambahkan aset dulu, nanti tracker menyarankan sektor mana yang perlu ditambah.';
      return;
    }
    const pctTxt = (v) => v.toFixed(1).replace('.', ',') + '%';
    const underweight = allocationItems.filter(i => i.status === 'Underweight').sort((a, b) => a.difference - b.difference);
    const overweight = allocationItems.filter(i => i.status === 'Overweight').sort((a, b) => b.difference - a.difference);
    const cashItem = allocationItems.find(i => i.sector === 'Cash');
    const cashPercent = cashItem ? cashItem.actualPercent : 0;

    if (underweight.length) {
      const next = underweight[0];
      const gapIDR = total * (next.targetPercent - next.actualPercent) / 100;
      titleEl.textContent = `Tambah ${next.sector}`;
      textEl.textContent = `${pctTxt(next.actualPercent)} dari target ${pctTxt(next.targetPercent)} — kurang ± ${ivShort(gapIDR)} untuk seimbang.`;
    } else if (overweight.length) {
      const heavy = overweight[0];
      titleEl.textContent = `${heavy.sector} terlalu berat`;
      textEl.textContent = `${pctTxt(heavy.actualPercent)}, di atas target ${pctTxt(heavy.targetPercent)}. Arahkan setoran berikutnya ke sektor lain.`;
    } else if (cashPercent > 10) {
      titleEl.textContent = 'Cash siap diinvestasikan';
      textEl.textContent = `Cash ${pctTxt(cashPercent)} dari portofolio. Masukkan bertahap.`;
    } else {
      titleEl.textContent = 'Alokasi sesuai rencana';

  /* Holdings as a list rather than a six-column table that never fit a
     phone: name, sector · platform, value, and return. */
  function renderPortfolio(items) {
    const list = document.getElementById('ivHoldingsList');
    const sub = document.getElementById('ivHoldingsSub');
    if (!list) return;
    const assets = (items || []).filter(i => i.Sector !== 'Cash' && (Number(i.CurrentValueIDR) || 0) !== 0);
    if (!assets.length) {
      if (sub) sub.innerHTML = '&nbsp;';
      list.innerHTML = '<div class="empty-state">Belum ada aset.</div>';
      return;
    }

    const sorted = [...assets].sort((a, b) => IV_HOLDINGS_SORT === 'pl'
      ? (Number(b.GrowthPercent) || 0) - (Number(a.GrowthPercent) || 0)
      : (Number(b.CurrentValueIDR) || 0) - (Number(a.CurrentValueIDR) || 0));
    const byGrowth = [...assets].sort((a, b) => (Number(b.GrowthPercent) || 0) - (Number(a.GrowthPercent) || 0));
    const best = byGrowth[0], worst = byGrowth[byGrowth.length - 1];
    if (sub) {
      sub.innerHTML = `${assets.length} aset · terbaik <span class="positive">${escapeHtml(best.Asset)} ${ivPct(best.GrowthPercent, true)}</span>`
        + (worst !== best && (Number(worst.GrowthPercent) || 0) < 0 ? ` · terlemah <span class="negative">${escapeHtml(worst.Asset)} ${ivPct(worst.GrowthPercent, true)}</span>` : '');
    }

    const total = assets.reduce((s, a) => s + (Number(a.CurrentValueIDR) || 0), 0);
    const LIMIT = 6;
    const shown = IV_HOLDINGS_EXPANDED ? sorted : sorted.slice(0, LIMIT);
    list.innerHTML = shown.map(item => {
      const value = Number(item.CurrentValueIDR) || 0;
      const pl = Number(item.ProfitLossIDR) || 0;
      const g = Number(item.GrowthPercent) || 0;
      const cls = pl > 0 ? 'positive' : pl < 0 ? 'negative' : '';
      const color = ivSectorColor(item.Sector);
      const weight = total > 0 ? value / total : 0;
      return `
        <div class="iv-holding">
          <span class="iv-holding-badge" style="background:${color}22;color:${color}">${escapeHtml(String(item.Asset || '?').substring(0, 3).toUpperCase())}</span>
          <span class="iv-holding-info">
            <span class="iv-holding-name">${escapeHtml(item.Asset)}</span>
            <span class="iv-holding-meta">${escapeHtml(item.Sector)} · ${escapeHtml(item.Platform)} · porsi ${ivPct(weight)}</span>
          </span>
          <span class="iv-holding-nums">
            <strong>${ivFull(value)}</strong>
            <span class="${cls}">${ivPct(g, true)} · ${ivFull(pl, true)}</span>
          </span>
        </div>`;
    }).join('') + (sorted.length > LIMIT
      ? `<button type="button" class="iv-more" onclick="ivToggleHoldings()">${IV_HOLDINGS_EXPANDED ? 'Ringkas' : `Lihat semua (${sorted.length})`}</button>`
      : '');
  }

  /* === HISTORY === */
  function renderHistory() {
    renderTransactionHistory();

  function renderTransactionHistory() {
    const container = document.getElementById('transactionHistoryList');
    const filter = document.getElementById('historyTypeFilter')?.value || 'All';
    if (!container) return;
    let items = HISTORY_DATA.transactions || [];
    items = items.filter(i => i.status !== 'Deleted');
    if (filter !== 'All') items = items.filter(i => i.transactionType === filter);
    if (!items.length) {
      container.innerHTML = '<div class="empty-state">No transactions found.</div>';
      return;
    }

    const MAX_SHOW = 10;
    const showAll = container.dataset.showAll === 'true';
    const displayItems = showAll ? items : items.slice(0, MAX_SHOW);

    function investTxIcon(type) {
      const map = { 'Buy': '🛒', 'Sell': '📤', 'Deposit': '💵', 'Withdraw': '🏧', 'Initial Holding': '📦', 'Cash Adjustment': '⚡', 'Transfer Out': '↗️', 'Transfer In': '↙️' };
      return map[type] || '📌';
    }

    function investTxColor(type) {
      const map = { 'Buy': '#60a5fa', 'Sell': '#f59e0b', 'Deposit': '#34d399', 'Withdraw': '#f87171', 'Initial Holding': '#8b5cf6', 'Cash Adjustment': '#64748b', 'Transfer Out': '#f97316', 'Transfer In': '#06b6d4' };
      return map[type] || '#64748b';
    }

    let html = displayItems.map(item => {
      const color = investTxColor(item.transactionType);
      const icon = investTxIcon(item.transactionType);
      const amtColor = ['Buy', 'Withdraw', 'Transfer Out'].includes(item.transactionType) ? 'var(--error)' : 'var(--success)';
      const prefix = ['Buy', 'Withdraw', 'Transfer Out'].includes(item.transactionType) ? '-' : '+';
      const label = item.notes || item.asset || item.transactionType;
      const badge = item.sector !== 'Cash' ? item.sector : item.platform;

      return `
        <div class="mm-tx-card" onclick="confirmDeleteTransaction(${item.rowNumber}, '${jsStr(item.transactionType)}')">
          <div class="mm-tx-card-icon" style="background:${color}20;color:${color}">${icon}</div>
          <div class="mm-tx-card-body">
            <span class="mm-tx-card-title">${escapeHtml(label)}</span>
            <span class="mm-tx-card-badge">${escapeHtml(badge)} · ${formatDateShort(item.date)}</span>
          </div>
          <span class="mm-tx-card-amount" style="color:${amtColor}">${prefix}${formatIDR(item.amountIDR)}</span>
        </div>`;
    }).join('');

    if (!showAll && items.length > MAX_SHOW) {
      html += `<button class="btn-ghost btn-full" style="margin-top:10px;" onclick="document.getElementById('transactionHistoryList').dataset.showAll='true';renderTransactionHistory();">Show all (${items.length})</button>`;
    } else if (showAll && items.length > MAX_SHOW) {
      html += `<button class="btn-ghost btn-full" style="margin-top:10px;" onclick="document.getElementById('transactionHistoryList').dataset.showAll='false';renderTransactionHistory();">Show less</button>`;
    }

    container.innerHTML = html;
  }

  function getHistoryTypeClass(type) {
    const lower = String(type || '').toLowerCase();
    if (lower.includes('buy')) return 'buy';
    if (lower.includes('sell')) return 'sell';
    if (lower.includes('deposit')) return 'deposit';
    if (lower.includes('withdraw')) return 'withdraw';
    return '';
  }

  function formatDateShort(value) {
    if (!value) return '-';
    const date = new Date(value);
    if (isNaN(date.getTime())) return String(value);
    return new Intl.DateTimeFormat('en-GB', { day:'2-digit', month:'short', year:'numeric' }).format(date);
  }

  function confirmDeleteTransaction(rowNumber, type) {
    // Deleting one leg of a cash transfer removes the other too, so say so.
    const isTransfer = type === 'Transfer In' || type === 'Transfer Out';
    const ok = confirm(isTransfer
      ? 'Delete this transfer? Both the Transfer Out and Transfer In rows will be removed.'
      : 'Delete this transaction?');
    if (!ok) return;
    google.script.run
      .withSuccessHandler(result => {
        if (result && result.success) {
          showToast('Deleted.', 'success');
          loadDashboard(); loadHistory(); loadAssetOptions();
        } else { showToast('Failed.', 'error'); }
      })
      .withFailureHandler(error => {
        showToast(error.message || 'Failed.', 'error');
      })
      .deleteTransaction(rowNumber);
  }

  function setTodayDefaults() {

  function setupMoneyInputs() {
    document.querySelectorAll('.money-input').forEach(input => {
      if (input.dataset.moneyBound) return;
      input.dataset.moneyBound = '1';
      input.addEventListener('input', () => {
        const pos = input.selectionStart;
        const oldLen = input.value.length;
        input.value = formatMoneyInput(input.value);
        const diff = input.value.length - oldLen;
        input.setSelectionRange(pos + diff, pos + diff);
      });
    });
  }

  function formatMoneyInput(value) {
    if (!value) return '';
    let cleaned = String(value).replace(/,/g, '');
    // Preserve leading minus sign
    const isNegative = cleaned.startsWith('-');
    if (isNegative) cleaned = cleaned.substring(1);
    const parts = cleaned.split('.');
    let intPart = parts[0].replace(/\D/g, '');
    let decPart = parts.length > 1 ? parts.slice(1).join('').replace(/\D/g, '') : '';
    if (!intPart) intPart = '';
    const formatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    const result = parts.length > 1 ? `${formatted}.${decPart}` : formatted;
    return isNegative ? `-${result}` : result;
  }

  function parseMoneyInput(value) {
    if (value == null) return '';
    return String(value).replace(/,/g, '');
  }

  function formToPayload(form) {
    const data = new FormData(form);
    const payload = {};
    for (const [key, value] of data.entries()) payload[key] = value;
    return payload;
  }

  function setButtonLoading(button, isLoading, text) {

  function formatIDR(value) {
    if (AMOUNTS_HIDDEN) return '••••••';
    return new Intl.NumberFormat('id-ID', { style:'currency', currency:'IDR', maximumFractionDigits:0 }).format(Number(value) || 0);
  }

  function escapeHtml(value) {
    return String(value ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
  }

  // For values passed as JS string arguments inside an inline onclick="...".
  // The browser decodes HTML entities BEFORE the JS parser runs, so escapeHtml
  // alone is not enough: an apostrophe comes back as ' and terminates the
  // argument early. Escape for JS first, then for HTML, so the JS parser
  // receives a backslash-escaped quote.
  function jsStr(value) {
    return escapeHtml(String(value ?? '').replaceAll('\\','\\\\').replaceAll("'","\\'"));
  }

  function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    if (!toast) return;
    // The access banner already explains every failure; don't stack toasts.
    if (type === 'error' && document.getElementById('dbAccessBanner')) return;
    toast.textContent = message;
    toast.className = `toast ${type}`;
    setTimeout(() => toast.classList.add('hidden'), 2800);
  }

     INVESTMENT TRACKER — EXPORT / IMPORT / DELETE

  /* === EXPORT === */
  function investExportData(target) {
    showToast('Exporting...', 'success');
    google.script.run
      .withSuccessHandler(data => {
        if (target === 'transactions') {
          investDownloadCsv(buildInvestTxCsv(data.transactions), 'invest-transactions');
        } else if (target === 'portfolio') {
          investDownloadCsv(buildInvestPortfolioCsv(data.portfolio), 'invest-portfolio');
        } else {
          investDownloadCsv(buildInvestTxCsv(data.transactions), 'invest-transactions');
          setTimeout(() => investDownloadCsv(buildInvestPortfolioCsv(data.portfolio), 'invest-portfolio'), 300);
          setTimeout(() => investDownloadCsv(buildInvestSettingsCsv(data.settings), 'invest-settings'), 600);
          setTimeout(() => investDownloadCsv(buildInvestAllocCsv(data.allocationTargets), 'invest-allocation'), 900);
        }
        showToast('Export berhasil!', 'success');
      })
      .withFailureHandler(err => {
        showToast(err.message || 'Export gagal.', 'error');
      })
      .investExportAllData(target);
  }

  function investCsvEscape(value) {
    if (value == null) return '';
    const str = String(value);
    if (str.includes(',') || str.includes('"') || str.includes('\n')) {
      return '"' + str.replace(/"/g, '""') + '"';
    }
    return str;
  }

  function buildInvestTxCsv(rows) {
    const headers = ['date','platform','sector','asset','transactionType','amountIDR','notes'];
    let csv = headers.join(',') + '\n';
    (rows || []).forEach(r => {
      csv += [r.date, investCsvEscape(r.platform), investCsvEscape(r.sector), investCsvEscape(r.asset), r.transactionType, r.amountIDR, investCsvEscape(r.notes)].join(',') + '\n';
    });
    return csv;
  }

  function buildInvestPortfolioCsv(rows) {
    const headers = ['platform','sector','asset','currentValueIDR'];
    let csv = headers.join(',') + '\n';
    (rows || []).forEach(r => {
      csv += [investCsvEscape(r.platform), investCsvEscape(r.sector), investCsvEscape(r.asset), r.currentValueIDR].join(',') + '\n';
    });
    return csv;
  }

  function buildInvestSettingsCsv(rows) {
    const headers = ['key','value'];
    let csv = headers.join(',') + '\n';
    (rows || []).forEach(r => {
      csv += [investCsvEscape(r.key), investCsvEscape(r.value)].join(',') + '\n';
    });
    return csv;
  }

  function buildInvestAllocCsv(rows) {
    const headers = ['sector','targetPercent'];
    let csv = headers.join(',') + '\n';
    (rows || []).forEach(r => {
      csv += [investCsvEscape(r.sector), r.targetPercent].join(',') + '\n';
    });
    return csv;
  }

  function investDownloadCsv(csvContent, name) {
    const bom = '\uFEFF';
    const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${name}-${localISODate()}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function investImportData(event) {
    const file = event.target.files[0];
    if (!file) return;

    const statusEl = document.getElementById('investImportStatus');
    statusEl.style.display = 'block';
    statusEl.className = 'import-status';
    statusEl.textContent = 'Membaca file...';

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const csv = e.target.result;
        const rows = investParseCsv(csv);

        if (!rows.length) {
          statusEl.className = 'import-status error';
          statusEl.textContent = 'File CSV kosong atau format tidak valid.';
          event.target.value = '';
          return;
        }

        const firstRow = rows[0];
        if (!firstRow.date && !firstRow.platform && !firstRow.transactionType) {
          statusEl.className = 'import-status error';
          statusEl.textContent = 'Header CSV tidak valid. Harus ada: date, platform, transactionType, amountIDR.';
          event.target.value = '';
          return;
        }

        if (!confirm(`Import ${rows.length} transaksi investasi dari CSV?\n\nData akan ditambahkan ke data existing.`)) {
          statusEl.style.display = 'none';
          event.target.value = '';
          return;
        }

        statusEl.textContent = 'Importing...';

        google.script.run
          .withSuccessHandler(result => {
            if (result.success) {
              statusEl.className = 'import-status success';
              statusEl.textContent = result.message;
              loadDashboard();
            } else {
              statusEl.className = 'import-status error';
              statusEl.textContent = result.message || 'Import gagal.';
            }
            event.target.value = '';
          })
          .withFailureHandler(err => {
            statusEl.className = 'import-status error';
            statusEl.textContent = err.message || 'Import gagal.';
            event.target.value = '';
          })
          .investImportData({ rows: rows });

      } catch (err) {
        statusEl.className = 'import-status error';
        statusEl.textContent = 'Gagal membaca file: ' + err.message;
        event.target.value = '';
      }
    };
    reader.readAsText(file);
  }

  function investParseCsv(csv) {
    const lines = csv.split('\n').filter(l => l.trim());
    if (lines.length < 2) return [];
    const headers = investParseCsvLine(lines[0]);
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const values = investParseCsvLine(lines[i]);
      if (values.length === 0) continue;
      const obj = {};
      headers.forEach((h, idx) => { obj[h.trim()] = (values[idx] || '').trim(); });
      rows.push(obj);
    }
    return rows;
  }

  function investParseCsvLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQuotes && line[i + 1] === '"') { current += '"'; i++; }
        else { inQuotes = !inQuotes; }
      } else if (ch === ',' && !inQuotes) {
        result.push(current);
        current = '';
      } else {
        current += ch;
      }
    }
    result.push(current);
    return result;
  }

  /* === DELETE === */
  function investDeletePrompt(target) {
    const labels = {
      transactions: 'SEMUA TRANSAKSI INVESTASI',
      portfolio: 'PORTFOLIO VALUES',
      settings: 'SETTINGS & MASTER DATA',
      all: 'SEMUA DATA INVESTMENT TRACKER (RESET TOTAL)'
    };

    const label = labels[target] || target;

    if (!confirm(`Anda yakin ingin menghapus ${label}?\n\nTindakan ini TIDAK DAPAT dibatalkan!`)) return;

    const confirmText = target === 'all' ? 'HAPUS SEMUA' : 'HAPUS';
    const userInput = prompt(`Ketik "${confirmText}" untuk konfirmasi:`);

    if (userInput !== confirmText) {
      showToast('Penghapusan dibatalkan.', 'error');
      return;
    }

    showToast('Menghapus data...', 'error');

    google.script.run
      .withSuccessHandler(result => {
        if (result.success) {
          showToast(result.message, 'success');
          LATEST_DASHBOARD_DATA = null;
          loadDashboard();
          loadSettings();
        } else {
          showToast(result.message || 'Gagal menghapus.', 'error');
        }
      })
      .withFailureHandler(err => {
        showToast(err.message || 'Gagal menghapus.', 'error');
      })
      .investDeleteData(target);
  }
</script>
