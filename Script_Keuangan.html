<script>
/* ============================================================
   MONEY MANAGEMENT — Frontend JavaScript
   ============================================================ */

let MM_DASHBOARD = null;
let MM_ALLOC_CARDS = [];
let MM_BUDGET_BASIS = { income: 0, carryover: 0 };
let MM_ACCOUNTS = [];
let MM_CATEGORIES = [];
let MM_ALLOCATION = [];
let MM_HIST_YEAR = new Date().getFullYear();
let MM_HIST_MONTH = new Date().getMonth() + 1;
let mmHistoryChart = null;

/* === PAGE NAVIGATION === */
function mmShowPage(pageId) {
  document.querySelectorAll('#moneyWorkspace .page').forEach(p => p.classList.remove('active-page'));
  const page = document.getElementById(pageId);
  if (page) page.classList.add('active-page');
  document.querySelectorAll('#mmBottomTabs .tab-item').forEach(b => { b.classList.remove('active'); b.removeAttribute('aria-current'); });
  const active = document.querySelector(`#mmBottomTabs .tab-item[data-page="${pageId}"]`);
  if (active) { active.classList.add('active'); active.setAttribute('aria-current', 'page'); }
  if (typeof updateNavActive === 'function') updateNavActive(pageId);
  // A new tab starts at its top, not wherever the previous one was scrolled.
  window.scrollTo(0, 0);

  // Only load data if not cached
  if (pageId === 'mmDashboardPage') mmLoadDashboard(true);
  if (pageId === 'mmAccountsPage') {
    if (MM_DASHBOARD) mmRenderAccountsPage();
    else mmLoadDashboard(true);
  }
  if (pageId === 'mmBudgetPage') {
    if (MM_DASHBOARD) mmRenderBudgetPage();
    else mmLoadDashboard(true);
  }
  if (pageId === 'mmHistoryPage') {
    mmLoadHistory();
  }
  if (pageId === 'mmSettingsPage' && !document.getElementById('mmSettingsAccountsList').innerHTML.includes('mm-settings-acc-row')) mmLoadSettings();
  if (pageId === 'mmSettingsPage' && typeof mmAiRenderKeyStatus === 'function') mmAiRenderKeyStatus();
  if (pageId === 'mmInsightPage') {
    // Only auto-load for current month on first open; never override a
    // month the user already navigated to from History.
    if (!INSIGHT_YEAR || !INSIGHT_MONTH) loadFinancialInsight();
    else loadFinancialInsight(INSIGHT_YEAR, INSIGHT_MONTH);
  }
  if (window.lucide) lucide.createIcons();
}

/* === TRANSACTION SEARCH ===
   Searches every transaction, not the list currently on screen. The whole set
   is fetched once per session and reused — invalidated wherever MM_DASHBOARD
   is, since the two go stale together. */
let MM_SEARCH_CACHE = null;
let MM_SEARCH_TIMER = null;
const MM_SEARCH_LIMIT = 80;

function mmOpenSearch() {
  const sheet = document.getElementById('mmSearchSheet');
  const input = document.getElementById('mmSearchInput');
  if (!sheet || !input) return;
  sheet.classList.remove('hidden');
  input.value = '';
  document.getElementById('mmSearchClear').classList.add('hidden');
  document.getElementById('mmSearchMeta').classList.add('hidden');
  mmRenderSearchIntro();
  setTimeout(() => input.focus(), 60);
  mmLoadSearchData();
}

function mmCloseSearch() {
  const sheet = document.getElementById('mmSearchSheet');
  if (sheet) sheet.classList.add('hidden');
  const input = document.getElementById('mmSearchInput');
  if (input) input.blur();
}

function mmClearSearch() {
  const input = document.getElementById('mmSearchInput');
  input.value = '';
  document.getElementById('mmSearchClear').classList.add('hidden');
  document.getElementById('mmSearchMeta').classList.add('hidden');
  mmRenderSearchIntro();
  input.focus();
}

function mmRenderSearchIntro() {
  const box = document.getElementById('mmSearchResults');
  if (!box) return;
  const recent = (MM_SEARCH_CACHE || []).slice(0, 6);
  if (!recent.length) {
    box.innerHTML = mmEmpty('clock', 'Cari transaksi', 'Ketik catatan, kategori, akun, atau nominal. Pencarian mencakup seluruh riwayat.');
    return;
  }
  box.innerHTML = '<p class="mm-search-section">Terakhir dicatat</p>' + mmRenderSearchRows(recent, []);
}

async function mmLoadSearchData() {
  if (MM_SEARCH_CACHE) return MM_SEARCH_CACHE;
  const box = document.getElementById('mmSearchResults');
  if (box && !box.querySelector('.mm-tx-item')) box.innerHTML = skRows(4);
  try {
    MM_SEARCH_CACHE = await new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).mmGetTransactions({});
    });
  } catch (e) {
    if (box) box.innerHTML = mmEmpty('circle-dollar', 'Gagal memuat', 'Coba tutup dan buka lagi pencarian.');
    return null;
  }
  // Whatever the user typed while this was loading wins.
  const q = (document.getElementById('mmSearchInput') || {}).value || '';
  if (q.trim()) mmRunSearch(q); else mmRenderSearchIntro();
  return MM_SEARCH_CACHE;
}

function mmSearchInputChanged() {
  const input = document.getElementById('mmSearchInput');
  document.getElementById('mmSearchClear').classList.toggle('hidden', !input.value);
  clearTimeout(MM_SEARCH_TIMER);
  MM_SEARCH_TIMER = setTimeout(() => mmRunSearch(input.value), 160);
}

// Every term has to match somewhere in the row, so "bni earphone" narrows
// rather than widens. Digits also match the amount with separators stripped,
// which is how people actually remember a figure.
function mmMatchesTx(tx, terms, haystack) {
  return terms.every(t => haystack.indexOf(t) !== -1);
}

function mmTxHaystack(tx) {
  return [
    tx.notes, tx.category, tx.subcategory, tx.account, tx.accountTo, tx.type,
    tx.date, String(tx.amount), mmFormatDate(tx.date)
  ].join(' ').toLowerCase();
}

function mmRunSearch(rawQuery) {
  const box = document.getElementById('mmSearchResults');
  const meta = document.getElementById('mmSearchMeta');
  const query = (rawQuery || '').trim().toLowerCase();

  if (!query) {
    meta.classList.add('hidden');
    mmRenderSearchIntro();
    return;
  }
  if (!MM_SEARCH_CACHE) { mmLoadSearchData(); return; }

  const terms = query.split(/\s+/).filter(Boolean);
  const hits = MM_SEARCH_CACHE.filter(tx => mmMatchesTx(tx, terms, mmTxHaystack(tx)));

  meta.classList.remove('hidden');
  if (!hits.length) {
    meta.textContent = 'Tidak ada yang cocok';
    box.innerHTML = mmEmpty('circle-dollar', 'Tidak ditemukan', 'Coba kata lain, atau sebagian nominalnya saja.');
    return;
  }

  const total = hits.reduce((s, t) => s + (t.type === 'Expense' ? -t.amount : t.type === 'Income' ? t.amount : 0), 0);
  const shown = hits.slice(0, MM_SEARCH_LIMIT);
  meta.textContent = hits.length + ' transaksi'
    + (hits.length > MM_SEARCH_LIMIT ? ' (menampilkan ' + MM_SEARCH_LIMIT + ')' : '')
    + ' · net ' + (total >= 0 ? '+' : '−') + mmFormatIDR(Math.abs(total));
  box.innerHTML = mmRenderSearchRows(shown, terms);
}

function mmHighlight(text, terms) {
  let out = escapeHtml(text == null ? '' : String(text));
  if (!terms || !terms.length) return out;
  // Escape first, then wrap — so a term containing < or & cannot inject markup.
  terms.forEach(t => {
    if (!t) return;
    const safe = escapeHtml(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if (!safe) return;
    out = out.replace(new RegExp('(' + safe + ')', 'ig'), '<mark>$1</mark>');
  });
  return out;
}

function mmRenderSearchRows(rows, terms) {
  return rows.map(tx => {
    let amtClass = 'income-amt', prefix = '+', subtitle = tx.account;
    if (tx.type === 'Expense') {
      amtClass = 'expense-amt'; prefix = '-';
      subtitle = `${tx.account} · ${tx.category}${tx.subcategory ? ' / ' + tx.subcategory : ''}`;
    } else if (tx.type === 'Transfer') {
      amtClass = 'transfer-amt'; prefix = '';
      subtitle = `${tx.account} → ${tx.accountTo}`;
    } else {
      subtitle = `${tx.account}${tx.category ? ' · ' + tx.category : ''}`;
    }
    return `
      <div class="mm-tx-item" onclick="mmCloseSearch();mmShowTxDetail(${tx.rowNumber}, '${jsStr(tx.type)}', '${jsStr(tx.account)}', '${jsStr(tx.accountTo || '')}', '${jsStr(tx.category || '')}', '${jsStr(tx.subcategory || '')}', ${tx.amount}, '${jsStr(tx.notes || '')}', '${jsStr(tx.date || '')}')">
        <div class="mm-tx-icon" style="color:${mmCategoryColor(tx.category, tx.type)}">${mmCategoryEmoji(tx.category, tx.type)}</div>
        <div class="mm-tx-info">
          <div class="tx-title">${mmHighlight(tx.notes || tx.type, terms)}</div>
          <div class="tx-sub">${mmFormatDate(tx.date)} · ${mmHighlight(subtitle, terms)}</div>
        </div>
        <div class="mm-tx-amount ${amtClass}">${prefix}${mmFormatIDR(tx.amount)}</div>
      </div>`;
  }).join('');
}

/* === COUNT UP ===
   The headline figure counts up on arrival instead of snapping into place.
   Only when the value actually changed — re-rendering from cache should not
   replay it — and never while amounts are hidden or motion is reduced. */
const MM_COUNTED = {};

function mmCountUp(elId, value) {
  const el = document.getElementById(elId);
  if (!el) return;

  const hidden = typeof AMOUNTS_HIDDEN !== 'undefined' && AMOUNTS_HIDDEN;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const from = MM_COUNTED[elId];
  MM_COUNTED[elId] = value;

  if (hidden || reduced || from === value) {
    el.textContent = mmFormatIDR(value);
    return;
  }

  // First paint counts from zero; later updates ease from the old figure so
  // the change itself is what you see.
  const start = (from === undefined) ? 0 : from;
  const t0 = performance.now();
  const duration = 550;

  function frame(now) {
    // Another render may have superseded this one.
    if (MM_COUNTED[elId] !== value) return;
    const p = Math.min((now - t0) / duration, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = mmFormatIDR(Math.round(start + (value - start) * eased));
    if (p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* === EMPTY STATES ===
   The start of a month legitimately has no data. A bare "No data" line reads
   like something broke; give it a shape and point at the next action. */
function mmEmpty(icon, title, hint, action) {
  return '<div class="mm-empty">'
    + '<span class="mm-empty-icon">' + lucideIconSvg(icon, 22) + '</span>'
    + '<span class="mm-empty-title">' + escapeHtml(title) + '</span>'
    + (hint ? '<span class="mm-empty-hint">' + escapeHtml(hint) + '</span>' : '')
    + (action || '')
    + '</div>';
}

/* === FAB AUTO-HIDE ===
   Bottom padding keeps the FAB clear of the last card, but mid-scroll it still
   floats over whatever is beneath it — often a transaction amount. Tuck it
   away while scrolling down and bring it back on the way up, which is also
   when the user is more likely to want it. */
(function () {
  let lastY = 0;
  let ticking = false;

  function update() {
    ticking = false;
    const y = window.scrollY;
    const containers = document.querySelectorAll('.fab-container');
    // Ignore small jitters, and never hide near the top of the page.
    if (Math.abs(y - lastY) < 8) return;
    const hide = y > lastY && y > 120;
    containers.forEach(c => {
      // Leave it alone while its menu is open.
      const menu = c.querySelector('.fab-menu');
      if (menu && menu.classList.contains('open')) return;
      c.classList.toggle('fab-tucked', hide);
    });
    lastY = y;
  }

  window.addEventListener('scroll', () => {
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }, { passive: true });
})();

/* === SKELETONS ===
   Placeholders shaped like the content they stand in for, so the layout does
   not shift when data arrives. Replaces the spinner that used to sit here. */
function skAccounts(n) {
  let out = '<div class="sk-card-row">';
  for (let i = 0; i < (n || 3); i++) out += '<div class="sk sk-account"></div>';
  return out + '</div>';
}

function skRows(n) {
  let out = '<div class="sk-list">';
  for (let i = 0; i < (n || 5); i++) {
    out += '<div class="sk-row"><div class="sk sk-avatar"></div>'
         + '<div class="sk-row-body"><div class="sk sk-line" style="width:' + (48 + (i * 13) % 34) + '%"></div>'
         + '<div class="sk sk-line sm" style="width:' + (26 + (i * 9) % 22) + '%"></div></div>'
         + '<div class="sk sk-row-amount"></div></div>';
  }
  return out + '</div>';
}

/* === FAB === */
function mmToggleFab() {
  const btn = document.getElementById('mmFabBtn');
  const menu = document.getElementById('mmFabMenu');
  const overlay = document.getElementById('mmFabOverlay');
  const isOpen = btn.classList.contains('open');
  btn.classList.toggle('open');
  menu.classList.toggle('open');
  overlay.classList.toggle('hidden', isOpen);
}

/* Old mmShowActionSheet, mmCloseActionSheet, mmCloseActionSheetBackdrop
   are now in Script_TxInput.html */


/* === DASHBOARD === */
function mmLoadDashboard(skipIfCached) {
  // Greeting and date don't depend on the database — show them right away
  // instead of leaving the header blank until (or unless) the data arrives.
  mmRenderHeader();

  if (!window.supabaseConnected) {
    const container = document.getElementById('mmAccountsScroll');
    if (container) container.innerHTML = '<div class="empty-state">Database is not connected. Configure connection in Settings.</div>';
    return;
  }
  // If skipIfCached is true and we have data, just re-render from cache
  if (skipIfCached && MM_DASHBOARD) {
    mmRenderDashboard(MM_DASHBOARD);
    return;
  }

  // Mark insight and history as stale since data is being refreshed
  if (typeof INSIGHT_LOADED !== 'undefined') INSIGHT_LOADED = false;
  MM_ALLTIME_CACHE = null;
  MM_MONTH_CACHE = {};

  const container = document.getElementById('mmAccountsScroll');
  if (container) container.innerHTML = skAccounts(3);

  google.script.run
    .withSuccessHandler(data => {
      MM_DASHBOARD = data;
      MM_ACCOUNTS = data.accounts || [];
      MM_ALLOCATION = data.allocation || [];
      mmRenderDashboard(data);
    })
    .withFailureHandler(err => {
      // Without this the account skeletons shimmered forever on failure.
      if (container) container.innerHTML = mmEmpty('wallet', 'Gagal memuat data', 'Periksa koneksi lalu muat ulang halaman.', `<button class="mm-empty-action" onclick="mmLoadDashboard()">Coba lagi</button>`);
      mmRenderBudgetCard([], 0);
      mmRenderChart('expense');
      mmRenderDashboardTransactions();
      showToast(err.message || 'Failed to load dashboard.', 'error');
    })
    .mmGetDashboard();

  // Load categories (lightweight, needed for dropdowns)
  if (!MM_CATEGORIES.length) {
    google.script.run
      .withSuccessHandler(cats => { MM_CATEGORIES = cats || []; })
      .withFailureHandler(() => {})
      .mmGetCategories();
  }
}

function mmRenderHeader() {
  const hour = new Date().getHours();
  let greeting = 'Selamat malam';
  if (hour >= 4 && hour < 11) greeting = 'Selamat pagi';
  else if (hour >= 11 && hour < 15) greeting = 'Selamat siang';
  else if (hour >= 15 && hour < 18) greeting = 'Selamat sore';
  setText('mmGreeting', greeting);

  // User name — safeStorage so a browser that blocks storage still renders.
  let savedName = safeStorage.getItem('mm_user_name') || 'Mr Evan';
  savedName = savedName.replace(/[🌿🌱🍃]/gu, '').trim() || 'Mr Evan';
  setText('mmUserName', savedName);
  // Home and the Profile tab show the same name, with initials as the avatar.
  const plainName = savedName.replace(/[^\p{L}\p{N}\s.'-]/gu, '').trim() || 'Profil';
  setText('mmProfileName', plainName);
  const initials = plainName.split(/\s+/).filter(w => w && !/^(mr|mrs|ms)\.?$/i.test(w))
    .map(w => w[0]).join('').slice(0, 2).toUpperCase() || plainName.slice(0, 2).toUpperCase();
  setText('mmProfileAvatar', initials);
  setText('mmHomeAvatar', initials);

  setText('mmDateText', new Intl.DateTimeFormat('id-ID', { weekday: 'long', day: 'numeric', month: 'short' }).format(new Date()));
}

function mmRenderDashboard(data) {
  mmRenderHeader();

  // Net worth
  mmCountUp('mmNetWorthValue', data.netWorth);

  // Change vs the close of last month — percentage in the badge, the rupiah
  // amount next to it, since "+2%" alone does not say how much.
  const badge = document.getElementById('mmChangeBadge');
  const changeText = document.getElementById('mmChangeText');
  const diff = (data.netWorth || 0) - (data.prevNetWorth || 0);
  if (badge) {
    const isUp = diff >= 0;
    const arrow = lucideIconSvg(isUp ? 'trending-up' : 'trending-down', 13);
    if (data.prevNetWorth && data.prevNetWorth > 0) {
      const changePct = Math.abs(diff / data.prevNetWorth * 100).toFixed(1).replace('.', ',');
      badge.innerHTML = arrow + changePct + '%';
    } else {
      badge.innerHTML = arrow;
    }
    badge.className = 'mm-change-badge ' + (isUp ? 'up' : 'down');
  }
  if (changeText) {
    changeText.textContent = (diff >= 0 ? '+' : '−') + mmFormatIDRShort(Math.abs(diff)) + ' vs akhir bulan lalu';
  }

  // The eye shows the current state, not a fixed glyph.
  const eye = document.getElementById('mmBalanceEye');
  if (eye) {
    const hidden = typeof AMOUNTS_HIDDEN !== 'undefined' && AMOUNTS_HIDDEN;
    eye.innerHTML = lucideIconSvg(hidden ? 'eye-off' : 'eye', 16);
    eye.setAttribute('aria-pressed', hidden ? 'true' : 'false');
  }

  mmRenderSparkline(data);
  mmRenderAccountCards(data.accounts || [], data.netWorth || 0);
  mmRenderToday(data);
  mmRenderAlerts(data);
  mmRenderBudgetCard(data.allocationCards || [], data.totalIncome || 0, data.carryover || 0);
  mmRenderCashflow(data);
  mmRenderDaily(data);
  mmRenderChart();
  mmRenderDashboardTransactions();
  mmRenderBudgetPage();
  if (document.getElementById('mmAccountsPage') && document.getElementById('mmAccountsPage').classList.contains('active-page')) {
    mmRenderAccountsPage();
  }
  if (window.lucide) lucide.createIcons();
}

/* === DEDICATED ACCOUNTS PAGE RENDERING === */
function mmRenderAccountsPage() {
  const container = document.getElementById('mmAccountsFullList');
  const totalEl = document.getElementById('mmAccountsTotalBalance');
  const metaEl = document.getElementById('mmAccountsCountMeta');
  if (!container) return;

  const accounts = (MM_DASHBOARD && MM_DASHBOARD.accounts) || MM_ACCOUNTS || [];
  if (!accounts.length) {
    if (totalEl) totalEl.textContent = 'Rp 0';
    if (metaEl) metaEl.textContent = 'Belum ada rekening';
    container.innerHTML = mmEmpty('wallet', 'Belum Ada Rekening', 'Tambahkan rekening bank, dompet digital, atau uang tunai untuk mulai mencatat keuangan.', `<button class="btn-primary" onclick="mmShowAddAccount()">+ Tambah Rekening</button>`);
    return;
  }

  const total = accounts.reduce((sum, a) => sum + (Number(a.balance ?? a.initialBalance) || 0), 0);
  if (totalEl) totalEl.textContent = mmFormatIDR(total);
  if (metaEl) metaEl.textContent = `${accounts.length} rekening terdaftar · Total likuiditas aktif`;

  // Group accounts into Bank, E-Wallet, Cash, Other
  const groups = {
    'Bank Accounts': { title: 'Rekening Bank', icon: 'landmark', accounts: [] },
    'E-Wallets': { title: 'Dompet Digital (E-Wallet)', icon: 'smartphone', accounts: [] },
    'Cash': { title: 'Uang Tunai (Cash)', icon: 'banknote', accounts: [] },
    'Other Accounts': { title: 'Lainnya & Investasi', icon: 'wallet-cards', accounts: [] }
  };

  accounts.forEach(a => {
    const type = (a.type || '').toLowerCase();
    const name = (a.name || '').toLowerCase();
    if (type.includes('bank') || name.includes('bca') || name.includes('mandiri') || name.includes('bri') || name.includes('bni') || name.includes('jago') || name.includes('seabank')) {
      groups['Bank Accounts'].accounts.push(a);
    } else if (type.includes('wallet') || name.includes('gopay') || name.includes('ovo') || name.includes('shopee') || name.includes('dana') || name.includes('linkaja')) {
      groups['E-Wallets'].accounts.push(a);
    } else if (type.includes('cash') || type.includes('tunai') || name.includes('dompet') || name.includes('cash') || name.includes('kas')) {
      groups['Cash'].accounts.push(a);
    } else {
      groups['Other Accounts'].accounts.push(a);
    }
  });

  let html = '';
  Object.values(groups).forEach(g => {
    if (!g.accounts.length) return;
    const subtotal = g.accounts.reduce((s, a) => s + (Number(a.balance ?? a.initialBalance) || 0), 0);
    const groupShare = total > 0 ? Math.round((Math.max(subtotal, 0) / total) * 100) : 0;

    html += `
      <div class="ed-acc-section-group">
        <div class="ed-acc-group-header">
          <div class="ed-acc-group-title">
            <span class="ed-acc-group-icon">${lucideIconSvg(g.icon, 16)}</span>
            <h4>${g.title}</h4>
            <span class="ed-acc-group-badge">${g.accounts.length} akun</span>
          </div>
          <div class="ed-acc-group-totals">
            <strong class="ed-acc-group-amount">${mmFormatIDR(subtotal)}</strong>
            <span class="ed-acc-group-share">${groupShare}% total</span>
          </div>
        </div>
        <div class="ed-acc-group-cards">
          ${g.accounts.map(a => {
            const bal = Number(a.balance ?? a.initialBalance) || 0;
            const accShare = total > 0 ? Math.round((Math.max(bal, 0) / total) * 100) : 0;
            const isNegative = bal < 0;
            return `
              <div class="ed-acc-card">
                <div class="ed-acc-card-main" onclick="mmShowAccountTransactions('${jsStr(a.name)}')">
                  <div class="ed-acc-card-icon">${a.icon ? mmAccountIconSvg(a.icon, 20) : lucideIconSvg('wallet', 20)}</div>
                  <div class="ed-acc-card-info">
                    <div class="ed-acc-card-name">
                      <strong>${escapeHtml(a.name)}</strong>
                      ${!a.showOnDashboard ? '<span class="ed-chip-muted">Hidden</span>' : ''}
                    </div>
                    <div class="ed-acc-card-meta">${escapeHtml(a.type || 'Akun')} · ${accShare}% alokasi</div>
                  </div>
                </div>
                <div class="ed-acc-card-side">
                  <div class="ed-acc-card-balance ${isNegative ? 'expense-color' : ''}" onclick="mmShowAccountTransactions('${jsStr(a.name)}')">
                    ${mmFormatIDR(bal)}
                  </div>
                  <div class="ed-acc-card-actions">
                    <button type="button" class="ed-btn-sm" title="Lihat mutasi transaksi" onclick="mmShowAccountTransactions('${jsStr(a.name)}')">
                      ${lucideIconSvg('receipt', 13)} Riwayat
                    </button>
                    <button type="button" class="ed-btn-sm" title="Edit rekening" onclick="mmShowEditAccount('${jsStr(a.id)}', '${jsStr(a.name)}', '${jsStr(a.icon)}', ${a.initialBalance}, ${a.showOnDashboard})">
                      ${lucideIconSvg('pencil', 13)} Edit
                    </button>
                  </div>
                </div>
              </div>`;
          }).join('')}
        </div>
      </div>`;
  });

  container.innerHTML = html;
  if (window.lucide) lucide.createIcons();
}

/* "↑ 12% vs Okt" — direction, size and what it is compared with. goodWhenUp
   decides the colour: more income is good, more spending is not. */
function mmDeltaHtml(now, before, label, goodWhenUp) {
  if (!(before > 0)) return `<span class="lx-delta-muted">—</span>`;
  const change = (now - before) / before;
  const pct = Math.abs(Math.round(change * 100));
  if (pct === 0) return `<span class="lx-delta-muted">= ${escapeHtml(label)}</span>`;
  const up = change > 0;
  const good = up === goodWhenUp;
  return `<span class="lx-delta-chip ${good ? 'is-good' : 'is-bad'}" title="${up ? 'Naik' : 'Turun'} ${pct}% dibanding ${escapeHtml(label)}">${lucideIconSvg(up ? 'arrow-up-right' : 'arrow-down-right', 12)}${pct}%</span>`;
}

/* === MONTH CONTEXT ===
   Where today sits in the month; every pace figure is derived from it. */
function mmMonthContext() {
  const now = new Date();
  const day = now.getDate();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const monthName = new Intl.DateTimeFormat('id-ID', { month: 'long' }).format(now);
  // Today still counts as a day that can be spent in.
  return { now, day, daysInMonth, daysLeft: daysInMonth - day + 1, monthName };
}

// Allocation posts that are money set aside rather than money to spend.
const MM_NON_SPEND_RE = /invest|saving|tabung|darurat|emergency/i;

function mmInvestThisMonth(txs) {
  // Net flow: transfers into Invest add, withdrawals back to an account
  // (account prefixed "Invest:") subtract.
  return (txs || []).reduce((s, tx) => {
    if (tx.type !== 'Transfer') return s;
    if (String(tx.account || '').startsWith('Invest:')) return s - tx.amount;
    if (String(tx.accountTo || '').startsWith('Invest:') || tx.category === 'Invest' || /invest/i.test(tx.accountTo || '')) return s + tx.amount;
    return s;
  }, 0);
}

/* === THE MONTH: in, out, left === */
function mmRenderCashflow(data) {
  const ctx = mmMonthContext();
  const income = data.totalIncome || 0;
  const expense = data.totalExpense || 0;
  const saving = data.saving || 0;

  const prev = data.prevMonth || { income: 0, expense: 0, expenseToDate: 0 };
  const prevDate = new Date(ctx.now.getFullYear(), ctx.now.getMonth() - 1, 1);
  const prevName = new Intl.DateTimeFormat('id-ID', { month: 'short' }).format(prevDate);

  setText('mmCashflowTitle', ctx.monthName.charAt(0).toUpperCase() + ctx.monthName.slice(1));
  setText('mmCashflowSub', `Hari ke-${ctx.day} dari ${ctx.daysInMonth} · dibanding ${prevName}`);
  setText('mmTotalIncome', mmFormatIDRShort(income));
  setText('mmTotalExpense', mmFormatIDRShort(expense));
  setText('mmTotalSaving', (saving < 0 ? '−' : '') + mmFormatIDRShort(Math.abs(saving)).replace('-', ''));
  const savingEl = document.getElementById('mmTotalSaving');
  if (savingEl) savingEl.style.color = saving >= 0 ? 'var(--success)' : 'var(--error)';

  // Income against all of last month (it usually lands once); spending
  // against the same stretch of days last month, so mid-month is fair.
  const inDelta = document.getElementById('mmIncomeDelta');
  if (inDelta) inDelta.innerHTML = mmDeltaHtml(income, prev.income, prevName, true);
  const outDelta = document.getElementById('mmExpenseDelta');
  if (outDelta) outDelta.innerHTML = mmDeltaHtml(expense, prev.expenseToDate, prevName + ' (tanggal sama)', false);

  const chip = document.getElementById('mmSavingRate');
  const used = income > 0 ? expense / income : (expense > 0 ? 1 : 0);

  // One bar for the whole month: how much of what came in has gone out.
  const flowBar = document.getElementById('mmFlowBar');
  const flowFill = document.getElementById('mmFlowFill');
  if (flowBar && flowFill) {
    flowFill.style.setProperty('--w', (Math.min(used, 1) * 100).toFixed(1) + '%');
    const tone = (income <= 0 && expense <= 0) ? '' : saving < 0 ? ' is-bad' : used > 0.85 ? ' is-warn' : ' is-good';
    flowBar.className = 'hx-flowbar' + tone;
    flowBar.setAttribute('aria-label', income > 0
      ? `${Math.round(used * 100)}% pemasukan bulan ini sudah dipakai`
      : 'Belum ada pemasukan bulan ini');
  }
  if (chip) {
    if (income <= 0) {
      chip.textContent = 'Belum ada pemasukan';
      chip.className = 'mm-rate-chip';
    } else if (saving < 0) {
      chip.textContent = 'Defisit';
      chip.className = 'mm-rate-chip bad';
    } else {
      chip.textContent = Math.round((1 - used) * 100) + '% tersisa';
      chip.className = 'mm-rate-chip ' + (used > 0.85 ? 'warn' : 'good');
    }
  }
}

/* === TODAY ===
   Safe to spend. The budget pool already includes last month's leftovers,
   so what is still free in the spending posts is capped by the money
   actually held in the accounts — the figure can never promise more than
   the balance shows. Today's share is fixed before today's own spending,
   so buying lunch does not shrink the allowance it was paid from. */
function mmAllowance(data) {
  const ctx = mmMonthContext();
  const balance = Math.max(data.netWorth || 0, 0);
  const spendCards = (data.allocationCards || []).filter(c => (c.target || 0) > 0 && !MM_NON_SPEND_RE.test(c.category || ''));
  const spendRoom = spendCards.length
    ? spendCards.reduce((s, c) => s + Math.max((c.target || 0) - (c.spent || 0), 0), 0)
    : balance;
  const safe = Math.min(spendRoom, balance);
  const capped = spendRoom > balance;
  const today = localISODate();
  const spentToday = (data.monthTransactions || [])
    .filter(tx => tx.type === 'Expense' && tx.date === today)
    .reduce((s, tx) => s + (tx.amount || 0), 0);
  const days = Math.max(ctx.daysLeft, 1);
  const todayBudget = (safe + spentToday) / days;
  const spendTarget = spendCards.reduce((s, c) => s + (c.target || 0), 0);
  const spendSpent = spendCards.reduce((s, c) => s + (c.spent || 0), 0);
  return { ctx, balance, safe, capped, spentToday, todayBudget, spendTarget, spendSpent };
}

function mmRenderToday(data) {
  const box = document.getElementById('mmTodayCard');
  if (!box) return;
  const a = mmAllowance(data);
  const ctx = a.ctx;
  const left = a.todayBudget - a.spentToday;
  const used = a.todayBudget > 0 ? a.spentToday / a.todayBudget : (a.spentToday > 0 ? 2 : 0);
  const tone = (a.balance <= 0 || a.todayBudget <= 0 || used > 1) ? 'bad' : used >= 0.85 ? 'warn' : 'good';

  let label, value, sub;
  if (a.balance <= 0) {
    label = 'Jatah hari ini'; value = 'Saldo habis';
    sub = 'Catat pemasukan supaya ada yang bisa dibagi.';
  } else if (a.todayBudget <= 0) {
    label = 'Jatah hari ini'; value = 'Budget habis';
    sub = `Budget belanja bulan ini sudah terpakai semua · ${ctx.daysLeft} hari lagi`;
  } else if (left >= 0) {
    label = 'Masih bisa dipakai hari ini'; value = mmFormatIDR(left);
    sub = `Jatah ${mmFormatIDRShort(a.todayBudget)} · terpakai ${mmFormatIDRShort(a.spentToday)}${a.capped ? ' · dibatasi saldo' : ''}`;
  } else {
    label = 'Lewat jatah hari ini'; value = '−' + mmFormatIDR(-left);
    sub = `Jatah ${mmFormatIDRShort(a.todayBudget)} · terpakai ${mmFormatIDRShort(a.spentToday)}`;
  }

  // Ring: share of today's allowance already spent.
  const r = 24, circ = 2 * Math.PI * r;
  const frac = Math.min(Math.max(used, 0), 1);
  const ringPct = a.todayBudget > 0 ? Math.min(Math.round(used * 100), 999) + '%' : '–';

  // Pace: spending posts used vs how much of the month has gone.
  let pace = '';
  if (a.spendTarget > 0) {
    const bp = a.spendSpent / a.spendTarget;
    const tp = ctx.day / ctx.daysInMonth;
    let status, ptone;
    if (bp > tp + 0.08) { status = 'Lebih cepat dari waktunya'; ptone = 'warn'; }
    else if (bp < tp - 0.08) { status = 'Lebih hemat dari jadwal'; ptone = 'good'; }
    else { status = 'Sesuai jalur'; ptone = 'good'; }
    if (bp > 1) { status = 'Budget belanja terlampaui'; ptone = 'bad'; }
    pace = `
      <div class="hx-pace is-${ptone}">
        <div class="hx-pace-top">
          <span>Belanja <strong>${Math.round(bp * 100)}%</strong> terpakai</span>
          <span class="hx-pace-status">${escapeHtml(status)}</span>
        </div>
        <div class="hx-pace-track" role="img" aria-label="${Math.round(bp * 100)}% budget belanja terpakai, ${Math.round(tp * 100)}% bulan berjalan">
          <span class="hx-pace-fill" style="--w:${Math.min(bp, 1) * 100}%"></span>
          <span class="hx-pace-mark" style="left:${tp * 100}%"></span>
        </div>
        <div class="hx-pace-foot"><span>1 ${escapeHtml(ctx.monthName.slice(0, 3))}</span><span>hari ini · ${Math.round(tp * 100)}% bulan</span><span>${ctx.daysInMonth}</span></div>
      </div>`;
  }

  box.innerHTML = `
    <button type="button" class="hx-today-main is-${tone}" onclick="mmShowPage('mmInsightPage')">
      <span class="hx-ring" aria-hidden="true">
        <svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="${r}" class="hx-ring-track"/>
          <circle cx="28" cy="28" r="${r}" class="hx-ring-val" ${frac > 0 ? '' : 'stroke-opacity="0"'} stroke-dasharray="${(frac * circ).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 28 28)"/></svg>
        <span>${ringPct}</span>
      </span>
      <span class="hx-today-text">
        <span class="hx-k">${escapeHtml(label)}</span>
        <strong class="hx-today-value">${escapeHtml(value)}</strong>
        <span class="hx-today-sub">${escapeHtml(sub)}</span>
      </span>
      <span class="hx-chev" aria-hidden="true">${lucideIconSvg('chevron-right', 18)}</span>
    </button>
    ${pace}`;
}

/* === ALERTS ===
   Things worth acting on, worst first, at most two. */
function mmRenderAlerts(data) {
  const alertsEl = document.getElementById('mmAlerts');
  if (!alertsEl) return;
  const ctx = mmMonthContext();
  const income = data.totalIncome || 0;
  const expense = data.totalExpense || 0;
  const prev = data.prevMonth || { income: 0, expense: 0, expenseToDate: 0, days: 30 };

  // Average per day, against last month over the same number of days.
  const avg = expense / Math.max(ctx.day, 1);
  const prevDaysSoFar = Math.min(ctx.day, prev.days || ctx.day);
  const prevAvg = prev.expenseToDate / Math.max(prevDaysSoFar, 1);
  const pace = prevAvg > 0 ? (avg - prevAvg) / prevAvg : null;
  const pct = (v) => Math.abs(Math.round(v * 100)) + '%';

  const alerts = [];
  (data.allocationCards || []).forEach(c => {
    const target = c.target || 0, spent = c.spent || 0;
    if (target <= 0 || MM_NON_SPEND_RE.test(c.category || '')) return;
    if (spent > target) {
      alerts.push({ rank: 0, tone: 'bad', icon: 'alert-triangle', cat: c.category,
        text: `<strong>${escapeHtml(c.category)}</strong> lewat budget ${mmFormatIDRShort(spent - target)}` });
    } else if (spent / target >= 0.85) {
      alerts.push({ rank: 1, tone: 'warn', icon: 'alert-circle', cat: c.category,
        text: `<strong>${escapeHtml(c.category)}</strong> sudah ${Math.round(spent / target * 100)}%, sisa ${mmFormatIDRShort(target - spent)}` });
    }
  });
  if (pace !== null && pace > 0.2) {
    alerts.push({ rank: 2, tone: 'warn', icon: 'gauge',
      text: `Belanja ${pct(pace)} lebih cepat dari bulan lalu di tanggal yang sama` });
  }
  const expenses = (data.monthTransactions || []).filter(tx => tx.type === 'Expense');
  if (expenses.length >= 3 && expense > 0) {
    const top = expenses.reduce((a, b) => (b.amount > a.amount ? b : a));
    const share = top.amount / expense;
    if (share >= 0.25) {
      alerts.push({ rank: 3, tone: 'info', icon: 'receipt', cat: top.category,
        text: `<strong>${escapeHtml(top.notes || top.category || 'Satu transaksi')}</strong> = ${pct(share)} pengeluaran bulan ini` });
    }
  }
  if (income <= 0) {
    alerts.push({ rank: 4, tone: 'info', icon: 'info', text: 'Belum ada pemasukan tercatat bulan ini — budget belum terbentuk' });
  }

  alertsEl.innerHTML = alerts.sort((a, b) => a.rank - b.rank).slice(0, 2).map(a => {
    const attrs = a.cat
      ? `role="button" tabindex="0" onclick="mmShowCategoryDetail('${jsStr(a.cat)}')" onkeydown="if(event.key==='Enter'){this.click();}"`
      : '';
    return `<div class="mm-alert is-${a.tone}" ${attrs}>${lucideIconSvg(a.icon, 16)}<span>${a.text}</span>${a.cat ? lucideIconSvg('chevron-right', 14) : ''}</div>`;
  }).join('');
}

/* === DAILY SPENDING CHART ===
   One bar per day of the month; days still to come stay as empty slots so
   the month's shape is visible. A dashed line marks the average. Tap a bar,
   or drag across the plot, to read a day in the tooltip. */
let MM_DAILY = [];

function mmRenderDaily(data) {
  const chart = document.getElementById('mmDailyChart');
  if (!chart) return;
  const ctx = mmMonthContext();
  const stats = document.getElementById('mmDailyStats');

  const days = Array.from({ length: ctx.daysInMonth }, () => ({ amount: 0, count: 0 }));
  (data.monthTransactions || []).forEach(tx => {
    if (tx.type !== 'Expense') return;
    const d = Number(String(tx.date || '').slice(8, 10));
    if (d >= 1 && d <= ctx.daysInMonth) { days[d - 1].amount += tx.amount; days[d - 1].count++; }
  });
  MM_DAILY = days;

  const spent = days.reduce((s, d) => s + d.amount, 0);
  const avg = spent / Math.max(ctx.day, 1);
  const max = Math.max(...days.map(d => d.amount), 1);

  setText('mmDailySub', `rata-rata ${mmFormatIDRShort(avg)}/hari`);

  if (spent <= 0) {
    if (stats) stats.innerHTML = '';
    chart.innerHTML = mmEmpty('bar-chart-3', 'Belum ada pengeluaran bulan ini', '');
    setText('mmDailyFoot', '');
    return;
  }

  let peak = 0;
  days.forEach((d, i) => { if (d.amount > days[peak].amount) peak = i; });
  const peakDate = localISODate(new Date(ctx.now.getFullYear(), ctx.now.getMonth(), peak + 1));

  // Three numbers that summarise the month: typical day, worst day, when.
  if (stats) {
    stats.innerHTML = `
      <div class="lx-stat"><span>Rata-rata/hari</span><strong>${mmFormatIDRShort(avg)}</strong></div>
      <div class="lx-stat"><span>Tertinggi</span><strong class="expense-color">${mmFormatIDRShort(days[peak].amount)}</strong></div>
      <div class="lx-stat"><span>Tanggal</span><strong>${escapeHtml(mmDayLabel(peakDate))}</strong></div>`;
  }

  // The tallest bar stops at 80% so a tooltip above it stays in the card.
  const SCALE = 80;
  const avgPct = Math.min(avg / max * SCALE, SCALE);
  const bars = days.map((d, i) => {
    const day = i + 1;
    const cls = day > ctx.day ? 'is-future' : (day === ctx.day ? 'is-today' : '') + (d.amount > avg * 1.5 ? ' is-high' : '');
    const h = d.amount > 0 ? Math.max(d.amount / max * SCALE, 3) : 0;
    d.h = h;
    const label = `${day} ${ctx.monthName}: ${d.amount > 0 ? mmFormatIDR(d.amount) : 'tidak ada pengeluaran'}`;
    return `<button type="button" class="mm-daily-bar ${cls}" style="--h:${h}%;--i:${i}" aria-label="${escapeHtml(label)}" ${day > ctx.day ? 'disabled' : ''} onclick="mmSelectDailyBar(${i})"><span></span></button>`;
  }).join('');
  const ticks = [1, 8, 15, 22, ctx.daysInMonth].map(d =>
    `<span style="left:${(d - 0.5) / ctx.daysInMonth * 100}%">${d}</span>`).join('');

  chart.innerHTML = `
    <div class="mm-daily-plot" id="mmDailyPlot">
      <div class="mm-daily-avg" style="bottom:${avgPct}%"><span>rata-rata</span></div>
      ${bars}
      <div class="lx-tip hidden" id="mmDailyTip" role="presentation"></div>
    </div>
    <div class="mm-daily-ticks">${ticks}</div>`;

  mmBindDailyScrub();
  mmDailyCaption(peak, 'Tertinggi');
}

function mmDailyCaption(i, prefix) {
  const d = MM_DAILY[i];
  const foot = document.getElementById('mmDailyFoot');
  if (!d || !foot) return;
  const ctx = mmMonthContext();
  const date = localISODate(new Date(ctx.now.getFullYear(), ctx.now.getMonth(), i + 1));
  foot.innerHTML = `<span>${prefix ? prefix + ' · ' : ''}${escapeHtml(mmDayLabel(date))}</span>`
    + `<strong>${d.amount > 0 ? mmFormatIDR(d.amount) : '–'}</strong>`
    + `<span class="mm-daily-count">${d.count} transaksi</span>`;
}

function mmSelectDailyBar(i) {
  const ctx = mmMonthContext();
  if (i < 0 || i >= MM_DAILY.length || i + 1 > ctx.day) return;
  document.querySelectorAll('.mm-daily-bar').forEach((b, j) => b.classList.toggle('is-selected', j === i));
  mmDailyCaption(i, '');

  // Tooltip above the bar, clamped so it never leaves the card.
  const tip = document.getElementById('mmDailyTip');
  const plot = document.getElementById('mmDailyPlot');
  if (!tip || !plot) return;
  const d = MM_DAILY[i];
  const date = localISODate(new Date(ctx.now.getFullYear(), ctx.now.getMonth(), i + 1));
  tip.innerHTML = `<span>${escapeHtml(mmDayLabel(date))}</span><strong>${d.amount > 0 ? mmFormatIDR(d.amount) : 'Rp 0'}</strong>`;
  tip.style.top = (100 - (d.h || 0)) + '%';
  tip.classList.remove('hidden');
  const w = plot.clientWidth;
  const center = (i + 0.5) / MM_DAILY.length * w;
  const half = tip.offsetWidth / 2;
  tip.style.left = Math.min(Math.max(center, half), w - half) + 'px';
}

// Drag across the plot to scrub day by day — bars are only ~10px wide on a
// phone, too narrow to hit one by one.
function mmBindDailyScrub() {
  const plot = document.getElementById('mmDailyPlot');
  if (!plot) return;
  let active = false;
  const pick = (e) => {
    const r = plot.getBoundingClientRect();
    const i = Math.floor((e.clientX - r.left) / r.width * MM_DAILY.length);
    mmSelectDailyBar(Math.min(Math.max(i, 0), MM_DAILY.length - 1));
  };
  plot.addEventListener('pointerdown', e => { active = true; pick(e); });
  plot.addEventListener('pointermove', e => { if (active || e.pointerType === 'mouse') pick(e); });
  ['pointerup', 'pointercancel'].forEach(t => plot.addEventListener(t, () => { active = false; }));
  plot.addEventListener('pointerleave', () => {
    active = false;
    const tip = document.getElementById('mmDailyTip');
    if (tip) tip.classList.add('hidden');
  });
}

/* === BALANCE TREND ===
   Inline SVG, not <canvas>: an accelerated canvas is its own GPU layer and
   drags the text above it into layers too, and Android dropped those tiles
   (white rectangles) at the end of a fast scroll. SVG is ordinary paint.
   The line is a smooth curve through the real month-end balances; it never
   invents a shape when there is not enough history. */
function mmSmoothPath(pts) {
  if (pts.length < 2) return '';
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    // Catmull-Rom → cubic Bézier, tension 1/6.
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}

let MM_TREND_DRAWN = '';

function mmRenderSparkline(data) {
  const svg = document.getElementById('mmNetworthSparkline');
  const wrap = document.getElementById('mmTrendWrap');
  const labels = document.getElementById('mmTrendLabels');
  if (!svg) return;

  // Month-end net worth for the last 6 months, computed in mmGetDashboard.
  const trend = (data && data.netWorthTrend) || [];
  const points = trend.map(p => p.netWorth);
  if (points.length < 2) {
    svg.innerHTML = '';
    if (wrap) wrap.style.display = 'none';
    return;
  }
  if (wrap) wrap.style.display = '';

  const w = 320, h = 72;
  const min = Math.min(...points);
  const max = Math.max(...points);
  const range = max - min || 1;
  // Inset so the end dot and the month labels sit inside the screen edge.
  const padTop = 10, padBot = 6, padX = 26;
  const usableH = h - padTop - padBot;
  const xy = points.map((val, i) => [
    padX + (i / (points.length - 1)) * (w - padX * 2),
    padTop + usableH - ((val - min) / range) * usableH
  ]);
  const line = mmSmoothPath(xy);
  const last = xy[xy.length - 1];

  svg.innerHTML =
    '<defs><linearGradient id="mmSparkFill" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="rgba(0,184,138,0.22)"/>' +
      '<stop offset="1" stop-color="rgba(0,184,138,0)"/>' +
    '</linearGradient></defs>' +
    '<path class="lx-trend-area" d="' + line + ` L${last[0].toFixed(1)} ${h} L${xy[0][0].toFixed(1)} ${h} Z" fill="url(#mmSparkFill)"/>` +
    '<path class="lx-trend-line" pathLength="1" d="' + line + '" fill="none" stroke="#00B88A" stroke-width="2.2" ' +
      'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
    // End marker: a zero-length round-capped stroke stays a true circle even
    // though the SVG stretches (preserveAspectRatio="none"); a <circle> would
    // squash into an ellipse on wide screens.
    `<path class="lx-trend-dot-ring" d="M${last[0].toFixed(1)} ${last[1].toFixed(1)}h0.01" stroke="#0F1D21" stroke-width="14" stroke-linecap="round" vector-effect="non-scaling-stroke"/>` +
    `<path class="lx-trend-dot-core" d="M${last[0].toFixed(1)} ${last[1].toFixed(1)}h0.01" stroke="#00B88A" stroke-width="8" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;

  // Remove any obsolete absolute dot that might have floated outside the chart
  if (wrap) {
    const oldDot = wrap.querySelector('.lx-trend-dot');
    if (oldDot) oldDot.remove();
  }

  if (labels) {
    labels.innerHTML = trend.map((p, i) => {
      const parts = String(p.month || '').split('-').map(Number);
      const name = parts.length === 2
        ? new Intl.DateTimeFormat('id-ID', { month: 'short' }).format(new Date(parts[0], parts[1] - 1, 1))
        : '';
      return `<span style="left:${(xy[i][0] / w * 100).toFixed(2)}%">${escapeHtml(name)}</span>`;
    }).join('');
  }

  // Draw the line in once per distinct data set, not on every re-render.
  const key = points.join(',');
  if (MM_TREND_DRAWN !== key) {
    MM_TREND_DRAWN = key;
    svg.classList.remove('is-drawn');
    void svg.getBoundingClientRect();
    svg.classList.add('is-drawn');
  }
}

/* === ACCOUNTS ===
   Chips under the balance: what the total is made of, largest first. Tap
   one for its transactions; the last chip goes to account settings. */
const MM_ACC_TYPE_COLORS = {
  'Bank': '#60A5FA', 'E-Wallet': '#22D3EE', 'Cash': '#F5B942',
  'Credit Card': '#F06478', 'Investment': '#20C997', 'Other': '#8997AA'
};

function mmRenderAccountCards(accounts) {
  const box = document.getElementById('mmAccountsScroll');
  if (!box) return;
  const manage = `<button type="button" class="hx-acct is-ghost" onclick="mmShowPage('mmSettingsPage')"><span class="hx-acct-ic">${lucideIconSvg('sliders-horizontal', 18)}</span><span class="hx-acct-name">Kelola rekening</span></button>`;

  const visible = (accounts || []).filter(a => a.showOnDashboard).sort((a, b) => (b.balance || 0) - (a.balance || 0));
  if (!visible.length) {
    box.innerHTML = `<button type="button" class="hx-acct is-ghost" onclick="mmShowPage('mmSettingsPage')"><span class="hx-acct-ic">${lucideIconSvg('plus', 18)}</span><span class="hx-acct-name">Tambah rekening</span></button>`;
    return;
  }
  // Empty accounts stay off the strip; Settings still lists them.
  const shown = visible.filter(a => a.balance || 0);
  const total = visible.reduce((s, a) => s + Math.max(a.balance || 0, 0), 0);
  box.innerHTML = shown.map(a => {
    const color = MM_ACC_TYPE_COLORS[a.type] || MM_ACC_TYPE_COLORS['Other'];
    const bal = a.balance || 0;
    const share = total > 0 ? Math.round(Math.max(bal, 0) / total * 100) : 0;
    return `
      <button type="button" class="hx-acct" style="--c:${color}" aria-label="${escapeHtml(a.name)}, saldo ${escapeHtml(mmFormatIDR(bal))}, ${share}% dari total" onclick="mmShowAccountTransactions('${jsStr(a.name)}')">
        <span class="hx-acct-top">
          <span class="hx-acct-ic">${a.icon ? mmAccountIconSvg(a.icon, 18) : lucideIconSvg('wallet', 18)}</span>
          <span class="hx-acct-share">${share}%</span>
        </span>
        <span class="hx-acct-name">${escapeHtml(a.name)}</span>
        <strong class="hx-acct-bal ${bal < 0 ? 'expense-color' : ''}">${mmFormatIDRShort(bal)}</strong>
      </button>`;
  }).join('') + manage;
}

/* === BUDGET ===
   One state per pos, decided once and used by the overview card and the
   Budget page alike. Spending posts are judged against their limit; posts
   that are money set aside (invest, savings) are targets, so going past
   them is good news, not an overrun. */
function mmBudgetState(c) {
  const target = c.target || 0;
  const spent = c.spent || 0;
  const pct = target > 0 ? Math.round(spent / target * 100) : (spent > 0 ? 100 : 0);
  const saving = MM_NON_SPEND_RE.test(c.category || '');
  let state, label;
  if (saving) {
    state = pct >= 100 ? 'goal' : 'ok';
    label = pct >= 100 ? 'Target tercapai' : 'Berjalan';
  } else if (pct > 100) { state = 'over'; label = 'Lewat budget'; }
  else if (pct >= 85) { state = 'warn'; label = 'Hampir habis'; }
  else { state = 'ok'; label = 'Aman'; }
  const remaining = target - spent;
  let note;
  if (saving) note = remaining > 0 ? `kurang ${mmFormatIDRShort(remaining)}` : `+${mmFormatIDRShort(-remaining)} dari target`;
  else note = remaining >= 0 ? `sisa ${mmFormatIDRShort(remaining)}` : `lebih ${mmFormatIDRShort(-remaining)}`;
  return { target, spent, remaining, pct, saving, state, label, note };
}

function mmBudgetBasisHtml() {
  const b = MM_BUDGET_BASIS;
  return `
    <p class="lx-budget-basis">
      Dana bulan ini = sisa bulan lalu <strong>${mmFormatIDRShort(b.carryover)}</strong>
      + pemasukan <strong>${mmFormatIDRShort(b.income)}</strong>
    </p>`;
}

// Totals across the posts: budget, used, left, % used.
function mmBudgetTotals(cards) {
  const totalTarget = cards.reduce((s, c) => s + (c.target || 0), 0);
  const totalSpent = cards.reduce((s, c) => s + (c.spent || 0), 0);
  const left = totalTarget - totalSpent;
  const pct = totalTarget > 0 ? Math.round(totalSpent / totalTarget * 100) : 0;
  const state = pct > 100 ? 'over' : pct >= 85 ? 'warn' : 'ok';
  return { totalTarget, totalSpent, left, pct, state };
}

function mmRenderBudgetCard(allocationCards, totalIncome, carryover) {

  const list = document.getElementById('mmBudgetList');
  const summary = document.getElementById('mmBudgetSummary');

function mmBreakdownEntries(type, txs) {
  const want = type === 'income' ? 'Income' : 'Expense';
  const map = {};
  const source = txs || ((MM_DASHBOARD && MM_DASHBOARD.monthTransactions) || []);
  source.forEach(tx => {
    if (tx.type !== want) return;
    const name = tx.category || 'Tanpa kategori';
    const c = map[name] || (map[name] = { name, amount: 0, count: 0, subs: {} });
    c.amount += tx.amount;
    c.count++;
    // Income rarely has sub-categories; its note ("Gaji", "Freelance") is what
    // says where the money came from.
    const sub = tx.subcategory || (type === 'income' ? (tx.notes || 'Lainnya') : 'Tanpa sub-kategori');
    c.subs[sub] = (c.subs[sub] || 0) + tx.amount;
  });
  const list = Object.values(map).sort((a, b) => b.amount - a.amount);
  list.forEach((c, i) => {
    const cfg = MM_CATEGORY_CONFIG[c.name];
    c.color = cfg ? cfg.color : MM_BD_COLORS[i % MM_BD_COLORS.length];
  });
  return list;
}


/* === WHERE IT WENT ===
   This month's spending by category: one proportional bar, then the top
   four with the rest folded into "Lainnya". Tap a category for its
   transactions; the full breakdown lives in Analytics. */
const MM_BD_COLORS = ['#20C997', '#60A5FA', '#F5B942', '#F06478', '#A78BFA', '#22D3EE', '#FB923C', '#8997AA'];

function mmRenderChart() {
  const box = document.getElementById('mmBreakdown');
  if (!box) return;
  const entries = MM_DASHBOARD ? mmBreakdownEntries('expense') : [];
  const total = entries.reduce((s, e) => s + e.amount, 0);
  if (total <= 0) { box.innerHTML = ''; box.hidden = true; return; }
  box.hidden = false;

  const TOP = 4;
  const rows = entries.slice(0, TOP);
  const rest = entries.slice(TOP);
  if (rest.length) {
    rows.push({ name: 'Lainnya', other: rest.length, color: '#8997AA',
      amount: rest.reduce((s, e) => s + e.amount, 0), count: rest.reduce((s, e) => s + e.count, 0) });
  }

  const stack = rows.map(e =>
    `<span style="flex:${e.amount};background:${e.color}"></span>`).join('');
  const list = rows.map(e => {
    const pct = Math.round(e.amount / total * 100);
    const inner = `
        <span class="hm-cat-dot" style="background:${e.color}" aria-hidden="true"></span>
        <span class="hm-cat-name">${escapeHtml(e.name)}<small>${e.other ? e.other + ' kategori · ' : ''}${e.count} transaksi</small></span>
        <span class="hm-cat-pct">${pct}%</span>
        <strong class="hm-cat-amt">${mmFormatIDR(e.amount)}</strong>`;
    return e.other
      ? `<div class="hm-cat">${inner}<span class="hm-chev"></span></div>`
      : `<button type="button" class="hm-cat" onclick="mmShowCategoryDetail('${jsStr(e.name)}','expense')">${inner}<span class="hm-chev" aria-hidden="true">${lucideIconSvg('chevron-right', 16)}</span></button>`;
  }).join('');

  box.innerHTML = `
    <div class="hm-block-head"><span>Ke mana uangnya</span><span>${entries.length} kategori</span></div>
    <div class="hm-stack" role="img" aria-label="${escapeHtml(rows.map(e => `${e.name} ${Math.round(e.amount / total * 100)}%`).join(', '))}">${stack}</div>
    <div class="hm-cats">${list}</div>`;
}

/* === LATEST TRANSACTIONS ===
   The newest handful, grouped by day with that day's net. Everything else
   is one tap away in Transactions. */
const MM_TX_PREVIEW = 6;

function mmRenderDashboardTransactions() {
  const container = document.getElementById('mmDashboardTransactions');
  if (!container) return;
  const count = document.getElementById('mmTxMonthCount');

  const txs = (MM_DASHBOARD && MM_DASHBOARD.monthTransactions) || [];
  if (!txs.length) {
    if (count) count.textContent = '';
    container.innerHTML = mmEmpty('arrow-right-left', 'Belum ada transaksi bulan ini', 'Mulai dari yang barusan kamu belanjakan.', `<button class="mm-empty-action" onclick="mmShowActionSheet('expense')">Catat pengeluaran</button>`);
    return;
  }

  const sorted = [...txs].sort((a, b) =>
    (b.date || '').localeCompare(a.date || '') || ((b.rowNumber || 0) - (a.rowNumber || 0)));
  const shown = sorted.slice(0, MM_TX_PREVIEW);

  const groups = [];
  shown.forEach(tx => {
    const last = groups[groups.length - 1];
    if (last && last.date === tx.date) last.items.push(tx);
    else groups.push({ date: tx.date, items: [tx] });
  });

  // Day net counts every transaction of that day, not only the ones shown.
  const dayNet = {};
  sorted.forEach(tx => {
    dayNet[tx.date] = (dayNet[tx.date] || 0) + (tx.type === 'Income' ? tx.amount : tx.type === 'Expense' ? -tx.amount : 0);
  });

  if (count) count.textContent = `${sorted.length} transaksi bulan ini`;

  container.innerHTML = groups.map(g => {
    const net = dayNet[g.date] || 0;
    const netClass = net > 0 ? 'income-color' : net < 0 ? 'expense-color' : '';
    const netText = net === 0 ? '' : (net > 0 ? '+' : '−') + mmFormatIDR(Math.abs(net));
    const rows = g.items.map(tx => {
      const isIn = tx.type === 'Income', isOut = tx.type === 'Expense';
      const prefix = isIn ? '+' : isOut ? '−' : '';
      const colorClass = isIn ? 'income-color' : isOut ? 'expense-color' : 'transfer-color';
      const catColor = mmCategoryColor(tx.category, tx.type);
      const catIcon = mmCategoryEmoji(tx.category, tx.type);
      const label = tx.notes || tx.subcategory || tx.category || tx.type;
      const meta = tx.type === 'Transfer'
        ? (tx.account || '') + (tx.accountTo ? ' → ' + tx.accountTo : '')
        : [tx.subcategory || tx.category || tx.type, tx.account].filter(Boolean).join(' · ');
      return `
      <div class="hx-tx" role="button" tabindex="0" onkeydown="if(event.key==='Enter'){this.click();}" onclick="mmShowTxDetail(${tx.rowNumber}, '${jsStr(tx.type)}', '${jsStr(tx.account)}', '${jsStr(tx.accountTo || '')}', '${jsStr(tx.category || '')}', '${jsStr(tx.subcategory || '')}', ${tx.amount}, '${jsStr(tx.notes || '')}', '${jsStr(tx.date || '')}')">
        <div class="hx-tx-ic" style="--c:${catColor}">${catIcon}</div>
        <div class="hx-tx-info">
          <div class="hx-tx-name">${escapeHtml(label)}</div>
          <div class="hx-tx-meta">${escapeHtml(meta)}</div>
        </div>
        <div class="hx-tx-amt ${colorClass}">${prefix}${mmFormatIDR(tx.amount)}</div>
      </div>`;
    }).join('');
    return `
      <div class="hx-day">
        <div class="hx-day-head">
          <span>${mmDayLabel(g.date)}</span>
          <strong class="${netClass}">${netText}</strong>
        </div>
        ${rows}
      </div>`;
  }).join('') + (sorted.length > MM_TX_PREVIEW
    ? `<button type="button" class="hx-more" onclick="mmShowPage('mmHistoryPage')">Lihat semua ${sorted.length} transaksi ${lucideIconSvg('chevron-right', 16)}</button>`
    : '');
}

// "Hari ini", "Kemarin", else "Sab, 26 Sep". Parsed as a local date: new
// Date("2026-09-26") is UTC midnight and could land on the previous day.
function mmDayLabel(dateStr) {
  const parts = String(dateStr || '').split('-').map(Number);
  if (parts.length !== 3 || parts.some(isNaN)) return mmFormatDate(dateStr);
  const d = new Date(parts[0], parts[1] - 1, parts[2]);
  const today = localISODate();
  const yesterday = localISODate(new Date(Date.now() - 86400000));
  if (dateStr === today) return 'Hari ini';
  if (dateStr === yesterday) return 'Kemarin';
  return new Intl.DateTimeFormat('id-ID', { weekday: 'short', day: 'numeric', month: 'short' }).format(d);
}
