      ${extraFields}
      <label class="form-label">Amount <input type="text" name="amount" class="form-input money-input" value="${new Intl.NumberFormat('en').format(amount)}" inputmode="decimal" required></label>
      <label class="form-label">Notes <textarea name="notes" class="form-input" rows="2">${escapeHtml(notes)}</textarea></label>
      <button type="submit" class="btn-primary btn-full">Save Changes</button>
      <button type="button" class="btn-ghost btn-full" onclick="mmCloseTxDetailDirect()">Cancel</button>
    </form>`;
  
  setupMoneyInputs();
}

function mmSubmitEditTx(event, rowNumber, type) {
  event.preventDefault();
  const form = event.target;
  const payload = {
    rowNumber: rowNumber,
    date: form.date.value,
    type: type,
    account: form.account.value,
    accountTo: form.accountTo ? form.accountTo.value : '',
    category: form.category ? form.category.value : '',
    subcategory: form.subcategory ? form.subcategory.value : '',
    amount: parseMoneyInput(form.amount.value),
    notes: form.notes.value
  };

  const btn = form.querySelector('button[type="submit"]');
  setButtonLoading(btn, true, 'Saving...');

  google.script.run
    .withSuccessHandler(result => {
      setButtonLoading(btn, false, 'Save Changes');
      if (result && result.success) {
        showToast('Transaction updated.', 'success');
        mmCloseTxDetailDirect();
        MM_DASHBOARD = null;
        MM_SEARCH_CACHE = null;
        mmLoadDashboard();
      } else { showToast('Failed.', 'error'); }
    })
    .withFailureHandler(err => {
      setButtonLoading(btn, false, 'Save Changes');
      showToast(err.message || 'Failed.', 'error');
    })
    .mmUpdateTransaction(payload);
}

function mmCloseTxDetail(event) {
  if (event.target === event.currentTarget) {
    document.getElementById('mmTxDetailSheet').classList.add('hidden');
  }
}

function mmCloseTxDetailDirect() {
  document.getElementById('mmTxDetailSheet').classList.add('hidden');
}

function mmDeleteTxFromDetail(rowNumber) {
  if (!confirm('Delete this transaction?')) return;
  google.script.run
    .withSuccessHandler(result => {
      if (result && result.success) {
        showToast('Transaction deleted.', 'success');
        document.getElementById('mmTxDetailSheet').classList.add('hidden');
        MM_DASHBOARD = null;
        MM_SEARCH_CACHE = null;
        mmLoadDashboard();
      } else {
        showToast('Failed to delete.', 'error');
      }
    })
    .withFailureHandler(err => showToast(err.message || 'Failed.', 'error'))
    .mmDeleteTransaction(rowNumber);
}


/* === HISTORY (Activity page) ===
   Tiga tampilan: per bulan (default), semua waktu, rentang tanggal.
   Di tampilan bulan, ada tiga penyaring yang bekerja bersama: tanggal yang
   diketuk di kalender, kotak cari, jenis & akun. Semuanya lewat satu fungsi
   (mmHistRenderList) supaya tidak saling menimpa. */
let MM_ALLTIME_CACHE = null;
let MM_MONTH_CACHE = {};
let MM_HIST_TAB = 'month';
let MM_HIST_DAY = null;   // tanggal terpilih di kalender (1-31) atau null

function mmLoadHistory() {
  mmSwitchHistoryTab(MM_HIST_TAB || 'month');
}

function mmSwitchHistoryTab(tab) {
  if (!['month', 'alltime', 'period'].includes(tab)) tab = 'month';
  MM_HIST_TAB = tab;

  // Aktif ditentukan data-tab, bukan urutan tombol: urutan sebelumnya tidak
  // cocok dengan label, jadi "Bulan Ini" menyorot tab yang salah.
  document.querySelectorAll('.ah-seg-btn').forEach(b => {
    const on = b.dataset.tab === tab;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });

  document.querySelectorAll('.mm-history-content').forEach(c => { c.style.display = 'none'; });
  const ids = { month: 'mmHistoryMonth', alltime: 'mmHistoryAllTime', period: 'mmHistoryPeriod' };
  const pane = document.getElementById(ids[tab]);
  if (pane) pane.style.display = '';

  if (tab === 'alltime') {
    mmLoadAllTime();
  } else if (tab === 'month') {
    mmUpdateHistoryMonthLabel();
    mmLoadMonthHistory();
  } else {
    const start = document.getElementById('mmPeriodStart');
    const end = document.getElementById('mmPeriodEnd');
    const box = document.getElementById('mmHistoryPeriodContent');
    if (start && end && !start.value && !end.value) mmHistPreset('month', true);
    else if (box && !box.innerHTML.trim()) mmLoadPeriod();
  }
}

/* --- All time ------------------------------------------------------- */
function mmLoadAllTime() {
  const container = document.getElementById('mmHistoryAllTime');
  if (MM_ALLTIME_CACHE) {
    mmRenderAllTime(MM_ALLTIME_CACHE, container);
    return;
  }
  container.innerHTML = '<div class="hx-card">' + skRows(5) + '</div>';
  google.script.run
    .withSuccessHandler(data => {
      MM_ALLTIME_CACHE = data;
      mmRenderAllTime(data, container);
    })
    .withFailureHandler(() => {
      container.innerHTML = '<div class="hx-card">' + mmEmpty('alert-circle', 'Gagal memuat riwayat', 'Periksa koneksi, lalu buka tab ini lagi.') + '</div>';
      if (window.lucide) lucide.createIcons();
    })
    .mmGetAllTimeSummary();
}

function mmRenderAllTime(data, container) {
  if (!data || !data.length) {
    container.innerHTML = '<div class="hx-card">' + mmEmpty('clock', 'Riwayat masih kosong', 'Semua transaksi yang kamu catat akan tampil di sini.') + '</div>';
    if (window.lucide) lucide.createIcons();
    return;
  }

  const chartData = data.slice(-12);
  const short = (m) => {
    const p = String(m).split('-');
    return new Intl.DateTimeFormat('id-ID', { month: 'short', year: 'numeric' }).format(new Date(Number(p[0]), Number(p[1]) - 1, 1));
  };

  let html = '<div class="hx-card ah-chart"><div id="mmHistoryAreaChart" class="mm-history-chart-wrap"></div></div>';
  html += '<div class="hx-card ah-months">'
    + '<div class="ah-mrow ah-mhead"><span>Bulan</span><span>Masuk</span><span>Keluar</span></div>';
  html += [...data].reverse().map(item => {
    const label = short(item.month);
    return `<button type="button" class="ah-mrow" onclick="mmSelectMonthFromAllTime('${item.month}')" aria-label="Buka detail ${escapeHtml(mmFormatMonthLabel(item.month))}">
      <span class="ah-mname">${escapeHtml(label)}</span>
      <span class="ah-min">${mmFormatIDR(item.income)}</span>
      <span class="ah-mout">${mmFormatIDR(item.expense)}</span>
    </button>`;
  }).join('');
  html += '</div>';
  container.innerHTML = html;

  if (typeof mmHistoryChart !== 'undefined' && mmHistoryChart) { mmHistoryChart.destroy(); mmHistoryChart = null; }
  const el = document.getElementById('mmHistoryAreaChart');
  if (!el || typeof ApexCharts === 'undefined') return;

  const options = {
    series: [{ name: 'Masuk', data: chartData.map(d => d.income) }, { name: 'Keluar', data: chartData.map(d => d.expense) }],
    chart: { type: 'area', height: 160, background: 'transparent', toolbar: { show: false }, zoom: { enabled: false }, animations: { enabled: true, easing: 'easeinout', speed: 600 } },
    colors: ['#22B887', '#E77979'],
    stroke: { curve: 'smooth', width: 2 },
    fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.3, opacityTo: 0, stops: [0, 100] } },
    grid: { show: true, borderColor: 'rgba(255,255,255,0.06)', strokeDashArray: 4, xaxis: { lines: { show: false } }, yaxis: { lines: { show: true } }, padding: { top: 0, bottom: 0, left: 20, right: 20 } },
    xaxis: { categories: chartData.map(d => short(d.month)), axisBorder: { show: false }, axisTicks: { show: false }, labels: { rotate: 0, hideOverlappingLabels: true, style: { colors: '#93A19B', fontSize: '12px', fontFamily: 'Geist, Inter, sans-serif' } } },
    yaxis: { labels: { show: false }, max: function (max) { return max * 1.15; } },
    markers: { size: 0, hover: { size: 4, sizeOffset: 2 } },
    tooltip: { theme: 'dark', style: { fontSize: '12px', fontFamily: 'Geist, Inter, sans-serif' }, y: { formatter: function (val) { return mmFormatIDR(val); } } },
    legend: { show: true, position: 'top', horizontalAlign: 'right', fontSize: '12px', fontFamily: 'Geist, Inter, sans-serif', fontWeight: 500, labels: { colors: '#93A19B' }, markers: { width: 8, height: 8, radius: 4 }, offsetY: 0 },
    dataLabels: { enabled: false }
  };
  mmHistoryChart = new ApexCharts(el, options);
  mmHistoryChart.render();
}

/* --- Month ---------------------------------------------------------- */
function mmUpdateHistoryMonthLabel() {
  const label = document.getElementById('mmHistoryMonthLabel');
  if (label) label.textContent = mmFormatMonthLabel(`${MM_HIST_YEAR}-${String(MM_HIST_MONTH).padStart(2, '0')}`);
}

function mmPrevMonth() {
  MM_HIST_MONTH--;
  if (MM_HIST_MONTH < 1) { MM_HIST_MONTH = 12; MM_HIST_YEAR--; }
  mmUpdateHistoryMonthLabel();
  mmLoadMonthHistory();
}

function mmNextMonth() {
  MM_HIST_MONTH++;
  if (MM_HIST_MONTH > 12) { MM_HIST_MONTH = 1; MM_HIST_YEAR++; }
  mmUpdateHistoryMonthLabel();
  mmLoadMonthHistory();
}

function mmLoadMonthHistory() {
  const cacheKey = `${MM_HIST_YEAR}-${MM_HIST_MONTH}`;
  const container = document.getElementById('mmHistoryMonthContent');
  MM_HIST_DAY = null;

  if (MM_MONTH_CACHE[cacheKey]) {
    mmRenderMonthView(MM_MONTH_CACHE[cacheKey]);
    return;
  }

  const grid = document.getElementById('mmHistoryCalendarGrid');
  const cat = document.getElementById('mmHistoryCategoryBreakdown');
  if (grid) grid.innerHTML = '';
  if (cat) cat.innerHTML = '';
  if (container) container.innerHTML = skRows(5);
  const wanted = cacheKey;
  google.script.run
    .withSuccessHandler(data => {
      MM_MONTH_CACHE[wanted] = data;
      // Pengguna bisa pindah bulan sebelum respons tiba; jangan timpa.
      if (wanted === `${MM_HIST_YEAR}-${MM_HIST_MONTH}`) mmRenderMonthView(data);
    })
    .withFailureHandler(() => {
      if (container) {
        container.innerHTML = mmEmpty('alert-circle', 'Gagal memuat bulan ini', 'Periksa koneksi, lalu coba pindah bulan lagi.');
        if (window.lucide) lucide.createIcons();
      }
    })
    .mmGetCalendarData(MM_HIST_YEAR, MM_HIST_MONTH);
}

/* Ringkasan + rekap kategori + kalender + daftar */
function mmRenderMonthView(data) {
  if (!data || !data.days) {
    const c = document.getElementById('mmHistoryMonthContent');
    if (c) c.innerHTML = mmEmpty('info', 'Belum ada data', 'Data bulan ini tidak tersedia.');
    if (window.lucide) lucide.createIcons();
    return;
  }

  let totalIncome = data.totalIncome !== undefined ? data.totalIncome : 0;
  let totalExpense = data.totalExpense !== undefined ? data.totalExpense : 0;
  if (data.totalIncome === undefined) {
    Object.keys(data.days).forEach(d => {
      totalIncome += data.days[d].income || 0;
      totalExpense += data.days[d].expense || 0;
    });
  }
  const saving = totalIncome - totalExpense;
  setText('mmHistIncome', mmFormatIDR(totalIncome));
  setText('mmHistExpense', mmFormatIDR(totalExpense));
  const savingEl = document.getElementById('mmHistSaving');
  if (savingEl) {
    savingEl.textContent = (saving > 0 ? '+' : '') + mmFormatIDR(saving);
    savingEl.classList.toggle('positive', saving > 0);
    savingEl.classList.toggle('negative', saving < 0);
  }

  // Batang pengeluaran terhadap pemasukan, sama seperti kartu "Bulan Ini" di Home.
  const bar = document.getElementById('mmHistFlowBar');
  const fill = document.getElementById('mmHistFlowFill');
  if (bar && fill) {
    const ratio = totalIncome > 0 ? totalExpense / totalIncome : (totalExpense > 0 ? 1 : 0);
    fill.style.setProperty('--w', Math.min(100, Math.round(ratio * 100)) + '%');
    bar.classList.remove('is-good', 'is-warn', 'is-bad');
    bar.classList.add(ratio > 1 ? 'is-bad' : ratio > 0.85 ? 'is-warn' : 'is-good');
  }

  mmRenderHistCategoryBreakdown(data);
  mmRenderMonthCalendar(data);
  mmPopulateHistoryAccountFilter();
  mmHistRenderList();
  if (window.lucide) lucide.createIcons();
}

function mmRenderHistCategoryBreakdown(data) {
  const wrap = document.getElementById('mmHistoryCategoryBreakdown');
  if (!wrap) return;

  // Pertahankan keadaan buka/tutup saat pindah bulan.
  const wasOpen = !!(wrap.querySelector('details') && wrap.querySelector('details').open);

  const categories = data.categoryBreakdown || [];
  const totalExpense = data.totalExpense || 0;

  if (!categories.length) {
    wrap.innerHTML = data.isArchived
      ? '<div class="mm-hist-archived-banner"><i data-lucide="archive"></i> Data bulan ini diarsipkan; rincian pengeluaran tidak tersedia.</div>'
      : '';
    return;
  }

  const palette = ['#22d3ee', '#fbbf24', '#f472b6', '#818cf8', '#fb923c', '#a78bfa', '#2dd4bf', '#60a5fa', '#e879f9', '#94a3b8'];
  const rows = categories.map((cat, idx) => {
    const color = (typeof mmCategoryColor === 'function' ? mmCategoryColor(cat.category) : null) || palette[idx % palette.length];
    const pct = cat.percent ? Number(cat.percent) : (totalExpense > 0 ? (cat.amount / totalExpense) * 100 : 0);
    return { cat, color, pct, idx };
  });

  const segs = rows.map(r => `<span style="flex:${Math.max(r.pct, 0.5)};background:${r.color}" title="${escapeHtml(r.cat.category)} ${r.pct.toFixed(0)}%"></span>`).join('');
  const top = rows[0];

  const list = rows.map(r => {
    const subs = r.cat.subcategories || [];
    const hasSubs = subs.length > 0;
    const id = `hist-cat-${r.idx}-${data.year}-${data.month}`;
    const head = `
      <span class="ah-cat-dot" style="background:${r.color}"></span>
      <span class="ah-cat-name">${escapeHtml(r.cat.category)}${hasSubs ? `<small>${subs.length} sub</small>` : ''}</span>
      <span class="ah-cat-pct">${r.pct.toFixed(0)}%</span>
      <strong class="ah-cat-amt">${mmFormatIDR(r.cat.amount)}</strong>
      ${hasSubs ? lucideIconSvg('chevron-down', 14) : ''}`;
    const subHtml = hasSubs ? `
      <div id="${id}" class="ah-subs" hidden>
        ${subs.map(s => `<div class="ah-sub-row"><span>${escapeHtml(s.subcategory || 'Umum')}</span><strong>${mmFormatIDR(s.amount)}</strong></div>`).join('')}
      </div>` : '';
    return hasSubs
      ? `<div class="ah-cat"><button type="button" class="ah-cat-row" aria-expanded="false" onclick="mmToggleHistSubcat('${id}', this)">${head}</button>${subHtml}</div>`
      : `<div class="ah-cat"><div class="ah-cat-row">${head}</div></div>`;
  }).join('');

  wrap.innerHTML = `
    <details class="hx-card ah-fold"${wasOpen ? ' open' : ''}>
      <summary>
        <span class="ah-fold-row">
          <span class="ah-fold-title">Pengeluaran per kategori</span>
          <span class="ah-fold-hint">${escapeHtml(top.cat.category)} ${top.pct.toFixed(0)}%${data.isArchived ? ' · arsip' : ''}</span>
          ${lucideIconSvg('chevron-down', 16).replace('<svg', '<svg class="ah-fold-chev"')}
        </span>
        <span class="ah-catbar" aria-hidden="true">${segs}</span>
      </summary>
      <div class="ah-cats">${list}</div>
    </details>`;
}

function mmToggleHistSubcat(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  el.hidden = !el.hidden;
  if (btn) btn.setAttribute('aria-expanded', el.hidden ? 'false' : 'true');
  if (btn) btn.classList.toggle('is-open', !el.hidden);
}

function mmHistOpenInsight() {
  if (typeof mmOpenInsightForMonth === 'function') {
    mmOpenInsightForMonth(MM_HIST_YEAR, MM_HIST_MONTH);
  } else if (typeof mmShowPage === 'function') {
    mmShowPage('mmInsightPage');
  }
}

function mmSelectMonthFromAllTime(monthStr) {
  if (!monthStr) return;
  const parts = monthStr.split('-');
  if (parts.length >= 2) {
    MM_HIST_YEAR = parseInt(parts[0], 10);
    MM_HIST_MONTH = parseInt(parts[1], 10);
    mmSwitchHistoryTab('month');
  }
}

/* Kalender mulai Senin (kebiasaan di Indonesia). Sel hari memakai titik
   hijau/merah untuk ada-tidaknya pemasukan/pengeluaran; nominalnya ada di
   daftar saat tanggalnya diketuk. */
function mmRenderMonthCalendar(data) {
  const grid = document.getElementById('mmHistoryCalendarGrid');
  if (!grid) return;

  const dayNames = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
  let html = dayNames.map(d => `<div class="mm-cal-header">${d}</div>`).join('');

  const lead = (new Date(data.year, data.month - 1, 1).getDay() + 6) % 7;
  const now = new Date();
  const isCurrentMonth = now.getFullYear() === data.year && (now.getMonth() + 1) === data.month;
  const monthName = new Intl.DateTimeFormat('id-ID', { month: 'long' }).format(new Date(data.year, data.month - 1, 1));

  for (let i = 0; i < lead; i++) html += '<div class="mm-cal-day empty" aria-hidden="true"></div>';

  for (let d = 1; d <= data.endDay; d++) {
    const dd = data.days[d] || { income: 0, expense: 0, transactions: [] };
    const isToday = isCurrentMonth && now.getDate() === d;
    const n = (dd.transactions || []).length;
    const dots = (dd.income > 0 ? '<i class="ah-dot is-in"></i>' : '') + (dd.expense > 0 ? '<i class="ah-dot is-out"></i>' : '');
    const label = `${d} ${monthName}${n ? ', ' + n + ' transaksi' : ', tidak ada transaksi'}`;
    html += `<button type="button" class="mm-cal-day${isToday ? ' today' : ''}${MM_HIST_DAY === d ? ' selected' : ''}" data-day="${d}" aria-pressed="${MM_HIST_DAY === d}" aria-label="${label}" onclick="mmHistShowDay(${d})">
      <span class="mm-cal-num">${d}</span><span class="ah-dots">${dots}</span>
    </button>`;
  }

  grid.innerHTML = html;
}

function mmHistSyncCalendar() {
  document.querySelectorAll('#mmHistoryCalendarGrid .mm-cal-day[data-day]').forEach(el => {
    const on = Number(el.dataset.day) === MM_HIST_DAY;
    el.classList.toggle('selected', on);
    el.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}

/* Semua tanggal bulan ini */
function mmHistShowAll() {
  MM_HIST_DAY = null;
  mmHistSyncCalendar();
  mmHistRenderList();
}

/* Ketuk tanggal = saring ke tanggal itu; ketuk lagi = batal. */
function mmHistShowDay(day) {
  MM_HIST_DAY = (MM_HIST_DAY === day) ? null : day;
  mmHistSyncCalendar();
  mmHistRenderList();

  if (MM_HIST_DAY) {
    // Kalender ada di atas daftar: tutup dan bawa daftar ke layar, kalau tidak
    // hasil ketukan tidak terlihat.
    const fold = document.getElementById('mmHistCalFold');
    if (fold) fold.open = false;
    const target = document.getElementById('mmHistListSection');
    if (target) {
      const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      target.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'start' });
    }
  }
}

/* Jenis transaksi (chip) */
function mmHistSetType(type) {
  const input = document.getElementById('mmHistTypeFilter');
  if (input) input.value = type;
  document.querySelectorAll('.ah-chips .ah-chip[data-type]').forEach(b => {
    const on = b.dataset.type === type;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  mmHistRenderList();
}

function mmHistResetFilters() {
  const s = document.getElementById('mmHistSearchInput');
  const a = document.getElementById('mmHistAccountFilter');
  if (s) s.value = '';
  if (a) a.value = 'All';
  MM_HIST_DAY = null;
  mmHistSyncCalendar();
  mmHistSetType('All');
}

function mmFilterMonthHistory() { mmHistRenderList(); }

/* Satu-satunya tempat yang menggambar daftar bulan: tanggal + cari + jenis + akun. */
function mmHistRenderList() {
  const container = document.getElementById('mmHistoryMonthContent');
  if (!container) return;
  const data = MM_MONTH_CACHE[`${MM_HIST_YEAR}-${MM_HIST_MONTH}`];
  if (!data || !data.days) return;

  const query = ((document.getElementById('mmHistSearchInput') || {}).value || '').trim().toLowerCase();
  const type = (document.getElementById('mmHistTypeFilter') || {}).value || 'All';
  const acc = (document.getElementById('mmHistAccountFilter') || {}).value || 'All';

  let all = [];
  if (MM_HIST_DAY) {
    all = ((data.days[MM_HIST_DAY] || {}).transactions || []).slice();
  } else {
    Object.keys(data.days).forEach(d => { all = all.concat(data.days[d].transactions || []); });
  }
  const monthHasTx = MM_HIST_DAY ? true : all.length > 0;

  if (query) {
    const terms = query.split(/\s+/).filter(Boolean);
    all = all.filter(tx => {
      const hay = [tx.notes, tx.category, tx.subcategory, tx.account, tx.accountTo, tx.amount, tx.type].join(' ').toLowerCase();
      return terms.every(t => hay.includes(t));
    });
  }
  if (type !== 'All') all = all.filter(tx => tx.type === type);
  if (acc !== 'All') all = all.filter(tx => tx.account === acc || tx.accountTo === acc);

  const filtering = !!(query || type !== 'All' || acc !== 'All' || MM_HIST_DAY);

  // Judul + sub + tombol "Semua tanggal"
  const monthName = new Intl.DateTimeFormat('id-ID', { month: 'long' }).format(new Date(MM_HIST_YEAR, MM_HIST_MONTH - 1, 1));
  setText('mmHistoryListLabel', MM_HIST_DAY ? `${MM_HIST_DAY} ${monthName}` : 'Transaksi');
  const btn = document.getElementById('mmHistoryShowAllBtn');
  if (btn) btn.style.display = MM_HIST_DAY ? '' : 'none';

  const net = all.reduce((s, t) => s + (t.type === 'Income' ? Number(t.amount) : t.type === 'Expense' ? -Number(t.amount) : 0), 0);
  const sub = document.getElementById('mmHistoryListSub');
  if (sub) {
    sub.textContent = all.length
      ? `${all.length} transaksi` + (filtering && net !== 0 ? ` · net ${net > 0 ? '+' : '−'}${mmFormatIDR(Math.abs(net))}` : '')
      : '';
  }

  if (!all.length) {
    if (!monthHasTx && data.isArchived) {
      container.innerHTML = mmEmpty('info', 'Transaksi diarsipkan', 'Rincian bulan ini sudah diarsipkan. Lihat rekap per kategori di atas.');
    } else if (filtering) {
      container.innerHTML = mmEmpty('search', 'Tidak ada yang cocok', 'Ubah kata kunci atau filter.',
        '<button type="button" class="mm-empty-action" onclick="mmHistResetFilters()">Reset filter</button>');
    } else {
      container.innerHTML = mmEmpty('arrow-right-left', 'Belum ada transaksi bulan ini', 'Mulai dari yang barusan kamu belanjakan.',
        '<button type="button" class="mm-empty-action" onclick="mmShowActionSheet(\'expense\')">Catat pengeluaran</button>');
    }
  } else {
    container.innerHTML = mmRenderTransactionList(all);
  }
  if (window.lucide) lucide.createIcons();
}

/* --- Period --------------------------------------------------------- */
function mmHistPreset(range, quiet) {
  const end = new Date();
  const start = new Date();
  if (range === 'month') start.setDate(1);
  else start.setDate(start.getDate() - (Number(range) - 1));
  const s = document.getElementById('mmPeriodStart');
  const e = document.getElementById('mmPeriodEnd');
  if (s) s.value = localISODate(start);
  if (e) e.value = localISODate(end);
  mmLoadPeriod(quiet);
}

function mmLoadPeriod() {
  let start = document.getElementById('mmPeriodStart').value;
  let end = document.getElementById('mmPeriodEnd').value;
  if (!start || !end) {
    showToast('Pilih tanggal awal dan akhir.', 'error');
    return;
  }
  if (start > end) {   // tertukar: balik saja daripada menolak
    const t = start; start = end; end = t;
    document.getElementById('mmPeriodStart').value = start;
    document.getElementById('mmPeriodEnd').value = end;
  }
  const container = document.getElementById('mmHistoryPeriodContent');
  container.innerHTML = '<div class="hx-card">' + skRows(5) + '</div>';
  google.script.run
    .withSuccessHandler(data => mmRenderPeriod(data, container))
    .withFailureHandler(() => {
      container.innerHTML = '<div class="hx-card">' + mmEmpty('alert-circle', 'Gagal memuat', 'Periksa koneksi, lalu coba lagi.') + '</div>';
      if (window.lucide) lucide.createIcons();
    })
    .mmGetTransactions({ startDate: start, endDate: end });
}

function mmRenderPeriod(data, container) {
  if (!data || !data.length) {
    container.innerHTML = '<div class="hx-card">' + mmEmpty('clock', 'Tidak ada transaksi', 'Belum ada catatan pada rentang tanggal ini.') + '</div>';
    if (window.lucide) lucide.createIcons();
    return;
  }
  let totalIn = 0, totalOut = 0;
  data.forEach(tx => {
    if (tx.type === 'Income') totalIn += Number(tx.amount) || 0;
    if (tx.type === 'Expense') totalOut += Number(tx.amount) || 0;
  });
  const net = totalIn - totalOut;
  container.innerHTML = `
    <section class="hx-card ah-psum" aria-label="Ringkasan rentang">
      <dl class="hx-flow ah-flow">
        <div class="hx-flow-item is-in"><dt><span class="hx-dot"></span>Masuk</dt><dd>${mmFormatIDR(totalIn)}</dd></div>
        <div class="hx-flow-item is-out"><dt><span class="hx-dot"></span>Keluar</dt><dd>${mmFormatIDR(totalOut)}</dd></div>
        <div class="hx-flow-item is-net"><dt><span class="hx-dot"></span>Sisa</dt><dd class="${net > 0 ? 'positive' : net < 0 ? 'negative' : ''}">${net > 0 ? '+' : ''}${mmFormatIDR(net)}</dd></div>
      </dl>
    </section>
    <section class="hx-block">
      <div class="hx-head"><div class="hx-head-text"><h3 class="hx-title">Transaksi</h3><p class="hx-sub">${data.length} transaksi</p></div></div>
      <div class="hx-card hx-activity ah-tx">${mmRenderTransactionList(data)}</div>
    </section>`;
  if (window.lucide) lucide.createIcons();
}

/* Baris transaksi dikelompokkan per hari — pola yang sama dengan "Aktivitas
   Terbaru" di Home (hx-day / hx-tx), tanpa chip jenis: warna & tanda +/− sudah
   menyampaikannya. */
function mmRenderTransactionList(transactions) {
  if (!transactions || !transactions.length) return mmEmpty('arrow-right-left', 'Belum ada transaksi', '');

  const sorted = [...transactions].sort((a, b) =>
    (b.date || '').localeCompare(a.date || '') || ((b.rowNumber || 0) - (a.rowNumber || 0)));

  const groups = [];
  sorted.forEach(tx => {
    const last = groups[groups.length - 1];
    if (last && last.date === tx.date) last.items.push(tx);
    else groups.push({ date: tx.date, items: [tx] });
  });

  return groups.map(g => {
    const net = g.items.reduce((s, t) => s + (t.type === 'Income' ? Number(t.amount) : t.type === 'Expense' ? -Number(t.amount) : 0), 0);
    const netClass = net > 0 ? 'income-color' : net < 0 ? 'expense-color' : '';
    const netText = net === 0 ? '' : (net > 0 ? '+' : '−') + mmFormatIDR(Math.abs(net));

    const rows = g.items.map(tx => {
      const isIn = tx.type === 'Income', isOut = tx.type === 'Expense';
      const prefix = isIn ? '+' : isOut ? '−' : '';
      const colorClass = isIn ? 'income-color' : isOut ? 'expense-color' : 'transfer-color';
      const label = tx.notes || tx.subcategory || tx.category || tx.type;
      const meta = tx.type === 'Transfer'
        ? (tx.account || '') + (tx.accountTo ? ' → ' + tx.accountTo : '')
        : [tx.subcategory || tx.category || tx.type, tx.account].filter(Boolean).join(' · ');
      return `
      <div class="hx-tx" role="button" tabindex="0" onkeydown="if(event.key==='Enter'){this.click();}" onclick="mmShowTxDetail(${tx.rowNumber}, '${jsStr(tx.type)}', '${jsStr(tx.account)}', '${jsStr(tx.accountTo || '')}', '${jsStr(tx.category || '')}', '${jsStr(tx.subcategory || '')}', ${tx.amount}, '${jsStr(tx.notes || '')}', '${jsStr(tx.date || '')}')">
        <div class="hx-tx-ic" style="--c:${mmCategoryColor(tx.category, tx.type)}">${mmCategoryEmoji(tx.category, tx.type)}</div>
        <div class="hx-tx-info">
          <div class="hx-tx-name">${escapeHtml(label)}</div>
          <div class="hx-tx-meta">${escapeHtml(meta)}</div>
        </div>
        <div class="hx-tx-amt ${colorClass}">${prefix}${mmFormatIDR(tx.amount)}</div>
      </div>`;
    }).join('');

    return `
      <div class="hx-day">
        <div class="hx-day-head">
          <span>${mmDayLabel(g.date)}</span>
          <strong class="${netClass}">${netText}</strong>
        </div>
        ${rows}
      </div>`;
  }).join('');
}

/* === CALENDAR HELPERS === */
// Compact rupiah for tight spots (hero strip, budget rows); honours the
// hide-amounts toggle like mmFormatIDR does.
function mmFormatIDRShort(value) {
  if (typeof AMOUNTS_HIDDEN !== 'undefined' && AMOUNTS_HIDDEN) return '••••';
  const v = Number(value) || 0;
  return (v < 0 ? '-' : '') + 'Rp ' + mmFormatShort(Math.abs(v));
}

function mmFormatShort(value) {
  const abs = Math.abs(value);
  // toFixed gives "2.7", but everything else on screen uses id-ID where a dot
  // is the thousands separator — "2.7 jt" reads as 27 million. Use a comma.
  // One decimal at most, and none when it is zero: "2 jt", not "2,0 jt".
  const dec = (v) => v.toFixed(1).replace(/.0$/, '').replace('.', ',');
  if (abs >= 1000000000) return dec(value / 1000000000) + ' M';
  if (abs >= 1000000) return dec(value / 1000000) + ' jt';
  if (abs >= 1000) return Math.round(value / 1000) + ' rb';
  return String(Math.round(value));
}

/* === CATEGORIES RENDERER === */
function mmRenderCategories() {
  const container = document.getElementById('mmCategoriesList');
  if (!container) return;
  if (!MM_CATEGORIES.length) {
    container.innerHTML = '<div class="empty-state">No categories yet.</div>';
    return;
  }

  // Group by type then category
  const groups = {};
  MM_CATEGORIES.forEach(c => {
    const key = `${c.type} — ${c.category}`;
    if (!groups[key]) groups[key] = [];
    if (c.subcategory) groups[key].push(c.subcategory);
  });

  // Expense first, then Income, each category as one compact row of chips.
  const entries = Object.entries(groups).sort(([a], [b]) => a.localeCompare(b));
  let lastType = '';
  container.innerHTML = entries.map(([key, subs]) => {
    const [type, category] = key.split(' — ');
    const typeHead = type !== lastType ? `<div class="set-cat-type">${escapeHtml(type)}</div>` : '';
    lastType = type;
    const chips = subs.length
      ? subs.map(s => `<span class="mm-cat-chip">${escapeHtml(s)}<button class="delete-cat" aria-label="Hapus ${escapeHtml(s)}" onclick="mmDeleteCat('${jsStr(key)}','${jsStr(s)}')">×</button></span>`).join('')
      : '<span class="set-muted">Tanpa subkategori</span>';
    return `${typeHead}<div class="mm-cat-group"><div class="mm-cat-group-title">${escapeHtml(category || key)} <span class="set-count">${subs.length}</span></div><div class="set-chip-row">${chips}</div></div>`;
  }).join('');
}

function mmDeleteCat(groupKey, subcategory) {
  const parts = groupKey.split(' — ');
  const type = parts[0];
  const category = parts[1];
  if (!confirm(`Delete subcategory "${subcategory}" from ${category}?`)) return;
  google.script.run
    .withSuccessHandler(result => {
      if (result.success) {
        showToast('Category deleted.', 'success');
        mmLoadSettings();
      }
    })
    .withFailureHandler(err => showToast(err.message || 'Failed.', 'error'))
    .mmDeleteCategory({ type, category, subcategory });
}

/* === CATEGORY DETAIL BOTTOM SHEET === */
function mmShowCategoryDetail(category, type) {
  const sheet = document.getElementById('mmCategoryDetailSheet');
  const content = document.getElementById('mmCategoryDetailContent');
  content.innerHTML = skRows(5);
  sheet.classList.remove('hidden');

  const now = new Date();
  const monthStartStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;

  google.script.run
    .withSuccessHandler(txs => {
      const filtered = txs.filter(tx => (type ? tx.type === (type === 'income' ? 'Income' : 'Expense')
        : (tx.type === 'Expense' || tx.type === 'Income' || (tx.type === 'Transfer' && tx.category))) && (tx.category || 'Tanpa kategori') === category);
      if (!filtered.length) {
        content.innerHTML = `<h3 class="sheet-title">${mmCategoryEmoji(category)} ${escapeHtml(category)}</h3><p class="sheet-desc">Belum ada transaksi bulan ini.</p>`;
        return;
      }

      const total = filtered.reduce((s, tx) => s + tx.amount, 0);

      // Group by subcategory
      const subMap = {};
      filtered.forEach(tx => {
        const sub = tx.subcategory || 'General';
        if (!subMap[sub]) subMap[sub] = { amount: 0, transactions: [] };
        subMap[sub].amount += tx.amount;
        subMap[sub].transactions.push(tx);
      });

      const subs = Object.entries(subMap).sort((a, b) => b[1].amount - a[1].amount);

      let html = `<h3 class="sheet-title">${mmCategoryEmoji(category)} ${escapeHtml(category)}</h3>`;
      html += `<p class="sheet-desc">Total bulan ini: ${mmFormatIDR(total)} · ${filtered.length} transaksi</p>`;

      html += subs.map(([subName, data]) => {
        const txRows = data.transactions.map(tx => `
          <div class="mm-detail-tx-row">
            <span>${escapeHtml(tx.notes || tx.type)} <small style="color:var(--text-muted)">${mmFormatDate(tx.date)} · ${escapeHtml(tx.account || '')}</small></span>
            <strong style="color:${tx.type === 'Income' ? 'var(--success)' : tx.type === 'Expense' ? 'var(--error)' : 'var(--text-muted)'}">${mmFormatIDR(tx.amount)}</strong>
          </div>`).join('');
        return `
          <div class="mm-detail-sub-group">
            <div class="mm-detail-sub-header">
              <span>${escapeHtml(subName)}</span>
              <strong>${mmFormatIDR(data.amount)}</strong>
            </div>
            ${txRows}
          </div>`;
      }).join('');

      content.innerHTML = html;
    })
    .withFailureHandler(err => {
      content.innerHTML = '<div class="empty-state">Failed to load detail.</div>';
    })
    .mmGetTransactions({ startDate: monthStartStr });
}

function mmCloseCategoryDetail(event) {
  if (event.target === event.currentTarget) {
    document.getElementById('mmCategoryDetailSheet').classList.add('hidden');
  }
}

/* === ACCOUNT TRANSACTIONS DETAIL === */
function mmShowAccountTransactions(accountName) {
  const sheet = document.getElementById('mmCategoryDetailSheet');
  const content = document.getElementById('mmCategoryDetailContent');
  content.innerHTML = skRows(5);
  sheet.classList.remove('hidden');

  // Get transactions from cache
  const txs = (MM_DASHBOARD && MM_DASHBOARD.monthTransactions) || [];
  const filtered = txs.filter(tx => tx.account === accountName || tx.accountTo === accountName);

  if (!filtered.length) {
    content.innerHTML = `<h3 class="sheet-title">${lucideIconSvg('wallet', 18)} ${escapeHtml(accountName)}</h3><p class="sheet-desc">No transactions this month.</p>`;
    return;
  }

  // Calculate totals
  let totalIn = 0, totalOut = 0;
  filtered.forEach(tx => {
    if (tx.type === 'Income' && tx.account === accountName) totalIn += tx.amount;
    else if (tx.type === 'Expense' && tx.account === accountName) totalOut += tx.amount;
    else if (tx.type === 'Transfer') {
      if (tx.accountTo === accountName) totalIn += tx.amount;
      if (tx.account === accountName) totalOut += tx.amount;
    }
  });

  let html = `<h3 class="sheet-title">${lucideIconSvg('wallet', 18)} ${escapeHtml(accountName)}</h3>`;
  html += `<div style="display:flex;gap:12px;margin:8px 0 16px;">`;
  html += `<span style="font-size:12px;color:var(--success);">↓ In: ${mmFormatIDR(totalIn)}</span>`;
  html += `<span style="font-size:12px;color:var(--error);">↑ Out: ${mmFormatIDR(totalOut)}</span>`;
  html += `</div>`;

  // Group by date
  const grouped = {};
  filtered.forEach(tx => {
    if (!grouped[tx.date]) grouped[tx.date] = [];
    grouped[tx.date].push(tx);
  });

  const sortedDates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

  html += sortedDates.map(date => {
    const dayTxs = grouped[date];
    const rows = dayTxs.map(tx => {
      let prefix = '', color = 'var(--text-muted)';
      if (tx.type === 'Income') { prefix = '+'; color = 'var(--success)'; }
      else if (tx.type === 'Expense') { prefix = '-'; color = 'var(--error)'; }
      else if (tx.type === 'Transfer') {
        if (tx.accountTo === accountName) { prefix = '+'; color = 'var(--success)'; }
        else { prefix = '-'; color = '#60a5fa'; }
      }
      const label = tx.notes || tx.subcategory || tx.category || tx.type;
      const meta = tx.type === 'Transfer' ? (tx.account === accountName ? `→ ${tx.accountTo}` : `← ${tx.account}`) : (tx.category || '');
      return `
        <div class="mm-detail-tx-row">
          <div style="display:flex;flex-direction:column;gap:1px;">
            <span style="font-size:12px;font-weight:600;color:var(--text);">${escapeHtml(label)}</span>
            <span style="font-size:10px;color:var(--text-muted);">${escapeHtml(meta)}</span>
          </div>
          <strong style="color:${color};font-size:13px;">${prefix}${mmFormatIDR(tx.amount)}</strong>
        </div>`;
    }).join('');

    return `
      <div class="mm-detail-sub-group">
        <div class="mm-detail-sub-header">
          <span>${mmFormatDate(date)}</span>
        </div>
        ${rows}
      </div>`;
  }).join('');

  content.innerHTML = html;
}

function mmCategoryEmoji(category, txType) {
  // Transfer
  if (txType === 'Transfer' || (!category && txType !== 'Income')) {
    return lucideIconSvg('arrow-right-left', 16);
  }
  // Lookup from config
  const cfg = MM_CATEGORY_CONFIG[category];
  if (cfg) return lucideIconSvg(cfg.icon, 16);
  // Income generic
  if (txType === 'Income') return lucideIconSvg('wallet', 16);
  // Fallback
  return lucideIconSvg('tag', 16);
}

function mmCategoryColor(category, txType) {
  // Transfer
  if (txType === 'Transfer' || (!category && txType !== 'Income')) return '#a78bfa';
  // Lookup from config
  const cfg = MM_CATEGORY_CONFIG[category];
  if (cfg) return cfg.color;
  // Income generic
  if (txType === 'Income') return '#34d399';
  // Fallback
  return '#64748b';
}

/* === FORMATTING HELPERS === */
function mmFormatIDR(value) {
  if (typeof AMOUNTS_HIDDEN !== 'undefined' && AMOUNTS_HIDDEN) return '••••••';
  return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(Number(value) || 0);
}

function mmFormatDate(value) {
  if (!value) return '-';
  const d = new Date(value);
  if (isNaN(d.getTime())) return String(value);
  return new Intl.DateTimeFormat('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }).format(d);
}

function mmFormatMonthLabel(monthStr) {
  // monthStr: "2024-01"
  const parts = monthStr.split('-');
  const d = new Date(Number(parts[0]), Number(parts[1]) - 1, 1);
  return new Intl.DateTimeFormat('id-ID', { month: 'long', year: 'numeric' }).format(d);
}

/* === CSV HELPERS === */
function csvEscape(value) {
  if (value == null) return '';
  const str = String(value);
  if (str.includes(',') || str.includes('"') || str.includes('\n')) {
    return '"' + str.replace(/"/g, '""') + '"';
  }
  return str;
}

function csvToArray(csv) {
  const lines = csv.split('\n').filter(l => l.trim());
  if (lines.length < 2) return [];

  const headers = parseCsvLine(lines[0]);
  const rows = [];

  for (let i = 1; i < lines.length; i++) {
    const values = parseCsvLine(lines[i]);
    if (values.length === 0) continue;
    const obj = {};
    headers.forEach((h, idx) => { obj[h.trim()] = (values[idx] || '').trim(); });
    rows.push(obj);
  }
  return rows;
}

function parseCsvLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;

  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQuotes && line[i + 1] === '"') {
        current += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }
    } else if (ch === ',' && !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += ch;
    }
  }
  result.push(current);
  return result;
}

/* === EXPORT === */
function mmExportData(target) {
  showToast('Exporting...', 'success');
  google.script.run
    .withSuccessHandler(data => {
      if (target === 'transactions') {
        downloadCsv(buildTransactionsCsv(data.transactions), 'transactions');
      } else if (target === 'accounts') {
        downloadCsv(buildAccountsCsv(data.accounts), 'accounts');
      } else {
        // Export all as separate CSVs in one zip-like approach: multiple downloads
        downloadCsv(buildTransactionsCsv(data.transactions), 'transactions');
        setTimeout(() => downloadCsv(buildAccountsCsv(data.accounts), 'accounts'), 300);
        setTimeout(() => downloadCsv(buildCategoriesCsv(data.categories), 'categories'), 600);
        setTimeout(() => downloadCsv(buildAllocationCsv(data.allocation), 'allocation'), 900);
      }
      showToast('Export berhasil!', 'success');
    })
    .withFailureHandler(err => {
      showToast(err.message || 'Export gagal.', 'error');
    })
    .mmExportAllData(target);
}

function buildTransactionsCsv(rows) {
  const headers = ['date', 'type', 'account', 'accountTo', 'category', 'subcategory', 'amount', 'notes'];
  let csv = headers.join(',') + '\n';
  (rows || []).forEach(r => {
    csv += [r.date, r.type, csvEscape(r.account), csvEscape(r.accountTo), csvEscape(r.category), csvEscape(r.subcategory), r.amount, csvEscape(r.notes)].join(',') + '\n';
  });
  return csv;
}

function buildAccountsCsv(rows) {
  const headers = ['name', 'icon', 'initialBalance', 'order', 'showOnDashboard', 'status'];
  let csv = headers.join(',') + '\n';
  (rows || []).forEach(r => {
    csv += [csvEscape(r.name), csvEscape(r.icon), r.initialBalance, r.order, r.showOnDashboard, r.status].join(',') + '\n';
  });
  return csv;
}

function buildCategoriesCsv(rows) {
  const headers = ['type', 'category', 'subcategory', 'status'];
  let csv = headers.join(',') + '\n';
  (rows || []).forEach(r => {
    csv += [r.type, csvEscape(r.category), csvEscape(r.subcategory), r.status].join(',') + '\n';
  });
  return csv;
}

function buildAllocationCsv(rows) {
  const headers = ['category', 'percent', 'icon', 'color'];
  let csv = headers.join(',') + '\n';
  (rows || []).forEach(r => {
    csv += [csvEscape(r.category), r.percent, csvEscape(r.icon), r.color].join(',') + '\n';
  });
  return csv;
}

function downloadCsv(csvContent, name) {
  const bom = '\uFEFF'; // UTF-8 BOM for Excel compatibility
  const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${name}-${localISODate()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function mmImportData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const statusEl = document.getElementById('mmImportStatus');
  statusEl.style.display = 'block';
  statusEl.className = 'import-status';
  statusEl.textContent = 'Membaca file...';

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const csv = e.target.result;
      const rows = csvToArray(csv);

      if (!rows.length) {
        statusEl.className = 'import-status error';
        statusEl.textContent = 'File CSV kosong atau format tidak valid.';
        event.target.value = '';
        return;
      }

      // Validate headers
      const firstRow = rows[0];
      if (!firstRow.date && !firstRow.type && !firstRow.amount) {
        statusEl.className = 'import-status error';
        statusEl.textContent = 'Header CSV tidak valid. Pastikan ada kolom: date, type, amount.';
        event.target.value = '';
        return;
      }

      // Confirm
      if (!confirm(`Import ${rows.length} transaksi dari CSV?\n\nData akan ditambahkan ke data existing.`)) {
        statusEl.style.display = 'none';
        event.target.value = '';
        return;
      }

      statusEl.textContent = 'Importing...';

      google.script.run
        .withSuccessHandler(result => {
          if (result.success) {
            statusEl.className = 'import-status success';
            statusEl.textContent = result.message;
            MM_DASHBOARD = null;
        MM_SEARCH_CACHE = null;
            if (typeof mmLoadDashboard === 'function') mmLoadDashboard();
          } else {
            statusEl.className = 'import-status error';
            statusEl.textContent = result.message || 'Import gagal.';
          }
          event.target.value = '';
        })
        .withFailureHandler(err => {
          statusEl.className = 'import-status error';
          statusEl.textContent = err.message || 'Import gagal.';
          event.target.value = '';
        })
        .mmImportData({ rows: rows });

    } catch (err) {
      statusEl.className = 'import-status error';
      statusEl.textContent = 'Gagal membaca file: ' + err.message;
      event.target.value = '';
    }
  };
  reader.readAsText(file);
}

/* === DELETE DATA === */
function mmDeleteDataPrompt(target) {
  const labels = {
    transactions: 'SEMUA TRANSAKSI',
    accounts: 'SEMUA AKUN',
    categories: 'SEMUA KATEGORI',
    all: 'SEMUA DATA (RESET TOTAL)'
  };

  const label = labels[target] || target;

  // First confirmation
  if (!confirm(`Anda yakin ingin menghapus ${label}?\n\nTindakan ini TIDAK DAPAT dibatalkan!`)) return;

  // Second confirmation for extra safety
  const confirmText = target === 'all' ? 'HAPUS SEMUA' : 'HAPUS';
  const userInput = prompt(`Ketik "${confirmText}" untuk konfirmasi penghapusan:`);

  if (userInput !== confirmText) {
    showToast('Penghapusan dibatalkan.', 'error');
    return;
  }

  showToast('Menghapus data...', 'error');

  google.script.run
    .withSuccessHandler(result => {
      if (result.success) {
        showToast(result.message, 'success');
        // Reset caches and reload
        MM_DASHBOARD = null;
        MM_SEARCH_CACHE = null;
        MM_ACCOUNTS = [];
        MM_CATEGORIES = [];
        MM_ALLOCATION = [];
        if (typeof mmLoadDashboard === 'function') mmLoadDashboard();
        if (typeof mmLoadSettings === 'function') mmLoadSettings();
      } else {
        showToast(result.message || 'Gagal menghapus.', 'error');
      }
    })
    .withFailureHandler(err => {
      showToast(err.message || 'Gagal menghapus.', 'error');
    })
    .mmDeleteData(target);
}
