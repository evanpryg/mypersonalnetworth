// Safe localStorage wrapper — prevents crashes when browser blocks storage

// Case-insensitive key mapper dictionaries to bridge PostgreSQL and frontend logic
var KEY_MAP = {
  'id': 'id',
  'timestamp': 'Timestamp',
  'date': 'Date',
  'notes': 'Notes',
  'status': 'Status',
  'targetid': 'TargetID',
  'targetname': 'TargetName',
  'targetamount': 'TargetAmount',
  'targetcurrency': 'TargetCurrency',
  'startdate': 'StartDate',
  'platform': 'Platform',
  'sector': 'Sector',
  'asset': 'Asset',
  'transactiontype': 'TransactionType',
  'amountidr': 'AmountIDR',
  'currentvalueidr': 'CurrentValueIDR',
  'key': 'Key',
  'value': 'Value',
  'targetpercent': 'TargetPercent',
  'accountid': 'AccountID',
  'name': 'Name',
  'icon': 'Icon',
  'initialbalance': 'InitialBalance',
  'order': 'Order',
  'showondashboard': 'ShowOnDashboard',
  'type': 'Type',

  'accountto': 'AccountTo',
  'category': 'Category',
  'subcategory': 'Subcategory',
  'amount': 'Amount',
  'percent': 'Percent',
  'color': 'Color'
};

function mapRowToFrontend(row) {
  if (!row) return row;
  var mapped = {};
  for (var k in row) {
    var targetKey = KEY_MAP[k.toLowerCase()] || k;
    mapped[targetKey] = row[k];
  }
  return mapped;
}

function mapRowToDb(row) {
  if (!row) return row;
  var mapped = {};
  for (var k in row) {
    mapped[k.toLowerCase()] = row[k];
  }
  return mapped;
}

// Helpers
function normalize_(value) { return String(value || '').trim(); }
function normalizeUpper_(value) { return normalize_(value).toUpperCase(); }
function toNumber_(value) { var n = Number(value); return isNaN(n) ? 0 : n; }
function makeAssetKey_(platform, sector, asset) {
  return [normalizeUpper_(platform), normalizeUpper_(sector), normalizeUpper_(asset)].join('|');
}
function getCashAssetName_(platform) { return normalize_(platform) + ' Cash'; }
function formatDateForClient_(value) {
  if (!value) return '';
  var d = new Date(value);
  if (isNaN(d.getTime())) return String(value);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function formatTimestampForClient_(value) {
  if (!value) return '';
  var d = new Date(value);
  if (isNaN(d.getTime())) return String(value);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}

// PostgREST caps a single response at 1000 rows, so getRows_ pages through
// with .range() when a table is bigger than that. Paging needs a stable sort
// or rows can repeat/vanish between pages — this maps every table to its
// primary key. Small tables are read unsorted, which keeps the natural row
// order the UI has always shown (budget categories, accounts, settings).
var PAGE_ORDER_KEY = {
  'targets': 'targetid',
  'transactions': 'id',
  'portfolio': 'platform,sector,asset',
  'settings': 'id',
  'allocation_targets': 'sector',
  'mm_accounts': 'accountid',
  'mm_transactions': 'id',
  'mm_categories': 'id',
  'mm_allocation': 'category'
};
var PAGE_SIZE = 1000;

// Get raw rows from Supabase (auto-mapped to frontend keys)
async function getRows_(tableName) {
  if (!_sb) throw new Error("Supabase is not initialized.");
  var table = tableName.toLowerCase();
  var first = await _sb.from(table).select('*').range(0, PAGE_SIZE - 1);
  if (first.error) { console.error('Error reading ' + tableName + ':', first.error); throw first.error; }
  var data = first.data;

  if (data.length === PAGE_SIZE) {
    // Table spills past one page — redo the read with a stable sort so the
    // page boundaries line up, then walk the rest.
    var orderKey = PAGE_ORDER_KEY[table];
    data = [];
    for (var from = 0; ; from += PAGE_SIZE) {
      var query = _sb.from(table).select('*');
      if (orderKey) {
        orderKey.split(',').forEach(function(col) { query = query.order(col, { ascending: true }); });
      }
      var page = await query.range(from, from + PAGE_SIZE - 1);
      if (page.error) { console.error('Error reading ' + tableName + ':', page.error); throw page.error; }
      data = data.concat(page.data);
      if (page.data.length < PAGE_SIZE) break;
    }
  }
  var mappedData = data.map(mapRowToFrontend);
  var dateFields = ['Timestamp', 'Date', 'StartDate'];
  mappedData.forEach(function(row) {
    dateFields.forEach(function(field) {
      if (row[field] && typeof row[field] === 'string') row[field] = new Date(row[field]);
    });
  });
  return mappedData;
}

// Ported Database API Methods
var DB_API = {
  // SETTINGS
  async getSettings() {
    var rows = await getRows_('settings');
    var settings = {};
    rows.forEach(function(row) {
      var key = normalize_(row.Key);
      var value = normalize_(row.Value);
      if (!key || !value) return;
      if (!settings[key]) settings[key] = [];
      if (!settings[key].includes(value)) settings[key].push(value);
    });
    return settings;
  },

  async addSettingItem(payload) {
    var key = normalize_(payload.key);
    var value = normalize_(payload.value);
    if (!key || !value) throw new Error('Key and value are required.');
    var rows = await getRows_('settings');
    var exists = rows.some(function(row) { return normalizeUpper_(row.Key) === normalizeUpper_(key) && normalizeUpper_(row.Value) === normalizeUpper_(value); });
    if (exists) return { success: false, message: value + ' already exists in ' + key + '.' };
    var { error } = await _sb.from('settings').insert(mapRowToDb({ Key: key, Value: value }));
    if (error) throw error;
    return { success: true, message: value + ' added to ' + key + '.' };
  },

  // TARGETS
  async getMainTarget_() {
    var targets = await getRows_('targets');
    if (targets.length === 0) return { TargetID: 'T001', TargetName: 'First 100 Million', TargetAmount: 100000000, TargetCurrency: 'IDR', StartDate: '', Notes: '' };
    return targets[0];
  },

  async updateMainTarget(payload) {
    var targetName = normalize_(payload.targetName);
    var targetAmount = toNumber_(payload.targetAmount);
    var targetCurrency = normalizeUpper_(payload.targetCurrency || 'IDR');
    var notes = normalize_(payload.notes);
    if (!targetName) throw new Error('Target name is required.');
    if (targetAmount <= 0) throw new Error('Target amount must be greater than 0.');
    var targets = await getRows_('targets');
    if (targets.length === 0) {
      var { error } = await _sb.from('targets').insert(mapRowToDb({ TargetID: 'T001', TargetName: targetName, TargetAmount: targetAmount, TargetCurrency: targetCurrency, StartDate: new Date(), Notes: notes }));
      if (error) throw error;
    } else {
      var { error } = await _sb.from('targets').update(mapRowToDb({ TargetName: targetName, TargetAmount: targetAmount, TargetCurrency: targetCurrency, Notes: notes })).eq('targetid', targets[0].TargetID);
      if (error) throw error;
    }
    return { success: true, message: 'Main target updated successfully.' };
  },

  // PORTFOLIO
  async getPortfolioSheet_() {
    var rows = await getRows_('portfolio');
    var values = {};
    rows.forEach(function(row) {
      var platform = normalize_(row.Platform), sector = normalize_(row.Sector), asset = normalize_(row.Asset);
      var currentValueIDR = toNumber_(row.CurrentValueIDR);
      if (!platform || !sector || !asset) return;
      values[makeAssetKey_(platform, sector, asset)] = currentValueIDR;
    });
    return values;
  },

  async updateAssetValue(payload) {
    var platform = normalize_(payload.platform), sector = normalize_(payload.sector), asset = normalize_(payload.asset);
    var currentValueIDR = toNumber_(payload.currentValueIDR);
    if (!platform || !sector || !asset) throw new Error('Platform, Sector, and Asset are required.');
    var { error } = await _sb.from('portfolio').upsert(mapRowToDb({ Platform: platform, Sector: sector, Asset: asset, CurrentValueIDR: currentValueIDR }));
    if (error) throw error;
    return { success: true, message: 'Asset value updated successfully.' };
  },

  // ALLOCATION TARGETS (INVESTMENT)
  async getAllocationTargets() {
    var rows = await getRows_('allocation_targets');
    return rows.filter(function(r) { return normalize_(r.Sector); }).map(function(r) { return { sector: normalize_(r.Sector), targetPercent: toNumber_(r.TargetPercent) }; });
  },

  async getAllocationTargets_() {
    var rows = await getRows_('allocation_targets');
    var targets = {};
    rows.forEach(function(r) { var s = normalize_(r.Sector), tp = toNumber_(r.TargetPercent); if (s && tp > 0) targets[s] = tp; });
    return targets;
  },

  async saveAllocationTargets(payload) {
    var items = payload.items || [];
    var cleanedItems = items.map(function(i) { return { sector: normalize_(i.sector), targetPercent: toNumber_(i.targetPercent) }; }).filter(function(i) { return i.sector && i.targetPercent >= 0; });
    var total = cleanedItems.reduce(function(s, i) { return s + i.targetPercent; }, 0);
    if (cleanedItems.length === 0) throw new Error('Allocation target cannot be empty.');
    if (Math.abs(total - 100) > 0.01) throw new Error('Total allocation must be 100%. Current total is ' + total + '%.');
    var { error: delError } = await _sb.from('allocation_targets').delete().neq('sector', '');
    if (delError) throw delError;
    var { error: insError } = await _sb.from('allocation_targets').insert(cleanedItems.map(function(i) { return mapRowToDb({ Sector: i.sector, TargetPercent: i.targetPercent }); }));
    if (insError) throw insError;
    return { success: true, message: 'Allocation targets saved successfully.' };
  },

  // DASHBOARD DATA
  async getDashboardData() {
    var target = await this.getMainTarget_();
    var allTransactions = await getRows_('transactions');
    var transactions = allTransactions.filter(function(r) { return normalize_(r.Status || 'Active') !== 'Deleted'; });
    var persistedValues = await this.getPortfolioSheet_();
    var allocationTargets = await this.getAllocationTargets_();
    var portfolioMap = {};

    function ensurePortfolioItem_(pm, platform, sector, asset) {
      var key = makeAssetKey_(platform, sector, asset);
      if (!pm[key]) pm[key] = { Platform: normalize_(platform), Sector: normalize_(sector), Asset: normalize_(asset), TotalCapitalIDR: 0, CurrentValueIDR: 0, ProfitLossIDR: 0, GrowthPercent: 0 };
      return pm[key];
    }
    function addCashMovement_(pm, platform, amountIDR) {
      var cashItem = ensurePortfolioItem_(pm, platform, 'Cash', getCashAssetName_(platform));
      cashItem.TotalCapitalIDR += amountIDR;
    }

    transactions.forEach(function(row) {
      var platform = normalize_(row.Platform), sector = normalize_(row.Sector), asset = normalize_(row.Asset), type = normalize_(row.TransactionType);
      if (!platform || !type) return;
      var amountIDR = toNumber_(row.AmountIDR);
      if (type === 'Buy') { if (!sector||!asset) return; ensurePortfolioItem_(portfolioMap, platform, sector, asset).TotalCapitalIDR += amountIDR; addCashMovement_(portfolioMap, platform, -amountIDR); }
      else if (type === 'Sell') { if (!sector||!asset) return; ensurePortfolioItem_(portfolioMap, platform, sector, asset).TotalCapitalIDR -= amountIDR; addCashMovement_(portfolioMap, platform, amountIDR); }
      else if (type === 'Deposit') { addCashMovement_(portfolioMap, platform, amountIDR); }
      else if (type === 'Withdraw') { addCashMovement_(portfolioMap, platform, -amountIDR); }
      else if (type === 'Initial Holding') { if (!sector||!asset) return; ensurePortfolioItem_(portfolioMap, platform, sector, asset).TotalCapitalIDR += amountIDR; }
      else if (type === 'Cash Adjustment') { addCashMovement_(portfolioMap, platform, amountIDR); }
    });

    var portfolio = Object.values(portfolioMap).map(function(item) {
      var key = makeAssetKey_(item.Platform, item.Sector, item.Asset);
      if (item.Sector === 'Cash') { item.CurrentValueIDR = item.TotalCapitalIDR; item.ProfitLossIDR = 0; item.GrowthPercent = 0; return item; }
      item.CurrentValueIDR = (persistedValues[key] !== undefined) ? persistedValues[key] : item.TotalCapitalIDR;
      item.ProfitLossIDR = item.CurrentValueIDR - item.TotalCapitalIDR;
      item.GrowthPercent = item.TotalCapitalIDR > 0 ? item.ProfitLossIDR / item.TotalCapitalIDR : 0;
      return item;
    });

    var investedAssets = portfolio.filter(function(i) { return i.Sector !== 'Cash'; });
    var cashItems = portfolio.filter(function(i) { return i.Sector === 'Cash'; });
    var totalInvestedAssetsIDR = investedAssets.reduce(function(s,i) { return s + i.CurrentValueIDR; }, 0);
    var totalCashIDR = cashItems.reduce(function(s,i) { return s + i.CurrentValueIDR; }, 0);
    var totalPortfolioValueIDR = totalInvestedAssetsIDR + totalCashIDR;
    var totalCapitalIDR = investedAssets.reduce(function(s,i) { return s + i.TotalCapitalIDR; }, 0);
    var totalProfitLossIDR = investedAssets.reduce(function(s,i) { return s + i.ProfitLossIDR; }, 0);
    var targetAmount = toNumber_(target.TargetAmount) || 100000000;
    var progressPercent = targetAmount > 0 ? totalPortfolioValueIDR / targetAmount : 0;
    var remainingAmountIDR = Math.max(targetAmount - totalPortfolioValueIDR, 0);

    var averageMonthlyInvestmentIDR = (function(txs) {
      var monthly = {};
      txs.forEach(function(r) { var type = normalize_(r.TransactionType); if (!['Initial Holding','Deposit'].includes(type)) return; var d = new Date(r.Date); if (isNaN(d.getTime())) return; var k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); if (!monthly[k]) monthly[k]=0; monthly[k]+=toNumber_(r.AmountIDR); });
      var vals = Object.values(monthly); return vals.length === 0 ? 0 : vals.reduce(function(a,b){return a+b;},0)/vals.length;
    })(transactions);
    var estimatedMonthsLeft = averageMonthlyInvestmentIDR > 0 ? Math.ceil(remainingAmountIDR / averageMonthlyInvestmentIDR) : null;

    var sectorMap = {};
    portfolio.forEach(function(i) { if (!sectorMap[i.Sector]) sectorMap[i.Sector]=0; sectorMap[i.Sector]+=i.CurrentValueIDR; });
    var totalSectorVal = Object.values(sectorMap).reduce(function(s,v){return s+v;},0);
    var allocationBySector = Object.keys(sectorMap).map(function(sector) {
      var valueIDR = sectorMap[sector], actualPercent = totalSectorVal > 0 ? (valueIDR/totalSectorVal)*100 : 0;
      var targetPercent = allocationTargets[sector] || 0, difference = actualPercent - targetPercent;
      var status = 'No Target';
      if (targetPercent > 0) { if (Math.abs(difference)<=3) status='Balanced'; else if (difference>3) status='Overweight'; else status='Underweight'; }
      return { sector:sector, valueIDR:valueIDR, actualPercent:actualPercent, targetPercent:targetPercent, difference:difference, status:status };
    });
    var cashByPlatform = cashItems.map(function(i) { return { platform:i.Platform, asset:i.Asset, cashBalanceIDR:i.CurrentValueIDR }; });

    var rebalanceSuggestions = (function(abs, tc) {
      if (!abs||abs.length===0||tc<=0) return [];
      var uw = abs.filter(function(i){return i.sector!=='Cash'&&i.status==='Underweight';}).map(function(i){return{sector:i.sector,actualPercent:Number(i.actualPercent)||0,targetPercent:Number(i.targetPercent)||0,gapPercent:Math.abs(Number(i.difference)||0)};}).filter(function(i){return i.gapPercent>0;});
      if (uw.length===0) return [];
      var tg = uw.reduce(function(s,i){return s+i.gapPercent;},0);
      return uw.map(function(i){var p=tg>0?i.gapPercent/tg:0;return{sector:i.sector,actualPercent:i.actualPercent,targetPercent:i.targetPercent,gapPercent:i.gapPercent,portion:p,suggestedAmountIDR:tc*p};}).sort(function(a,b){return b.suggestedAmountIDR-a.suggestedAmountIDR;});
    })(allocationBySector, totalCashIDR);

    return { target:{name:target.TargetName||'First 100 Million',amount:targetAmount,currency:target.TargetCurrency||'IDR'}, summary:{totalPortfolioValueIDR:totalPortfolioValueIDR,totalInvestedAssetsIDR:totalInvestedAssetsIDR,totalCashIDR:totalCashIDR,totalCapitalIDR:totalCapitalIDR,totalProfitLossIDR:totalProfitLossIDR,progressPercent:progressPercent,remainingAmountIDR:remainingAmountIDR,averageMonthlyInvestmentIDR:averageMonthlyInvestmentIDR,estimatedMonthsLeft:estimatedMonthsLeft}, allocationTargets:allocationTargets, allocationBySector:allocationBySector, cashByPlatform:cashByPlatform, rebalanceSuggestions:rebalanceSuggestions, portfolio:portfolio };
  },

  async addTransaction(payload) {
    var platform = normalize_(payload.platform), transactionType = normalize_(payload.transactionType), amountIDR = toNumber_(payload.amountIDR);
    var sector = normalize_(payload.sector), asset = normalize_(payload.asset);
    if (transactionType==='Deposit'||transactionType==='Withdraw') { sector='Cash'; asset=getCashAssetName_(platform); }
    var row = mapRowToDb({ Date:payload.date, Platform:platform, Sector:sector, Asset:asset, TransactionType:transactionType, AmountIDR:amountIDR, Notes:payload.notes||'', Status:'Active' });
    // Backlink to the money-management row that spawned this one, so deleting
    // the transfer can take this row with it.
    if (payload.mmTxId) row.mm_tx_id = payload.mmTxId;
    var { error } = await _sb.from('transactions').insert(row);
    if (error && row.mm_tx_id && /mm_tx_id/.test(error.message || '')) {
      // Column not added yet — fall back so transfers keep working.
      console.warn('transactions.mm_tx_id missing; inserting without backlink.');
      delete row.mm_tx_id;
      var retry = await _sb.from('transactions').insert(row);
      error = retry.error;
    }
    if (error) throw error;
    return { success:true, message:'Transaction added successfully.' };
  },

  async syncCashBalance(payload) {
    var platform = normalize_(payload.platform), actualBalance = toNumber_(payload.actualBalance), notes = normalize_(payload.notes) || 'Balance sync';
    if (!platform) throw new Error('Platform is required.');
    var dashData = await this.getDashboardData();
    var cashItem = dashData.portfolio.find(function(i){return i.Sector==='Cash'&&i.Platform===platform;});
    var currentCash = cashItem ? cashItem.CurrentValueIDR : 0, difference = actualBalance - currentCash;
    if (Math.abs(difference)<1) return { success:true, message:'Balance already in sync.' };
    var todayStr = new Date().toISOString().slice(0,10);
    var { error } = await _sb.from('transactions').insert(mapRowToDb({ Date:todayStr, Platform:platform, Sector:'Cash', Asset:getCashAssetName_(platform), TransactionType:'Cash Adjustment', AmountIDR:difference, Notes:notes, Status:'Active' }));
    if (error) throw error;
    return { success:true, message:'Balance synced. Adjusted '+(difference>=0?'+':'')+difference.toLocaleString('id-ID')+'.' };
  },

  async getAssetOptions() {
    var dd = await this.getDashboardData();
    return dd.portfolio.filter(function(i){return i.Sector!=='Cash'&&i.TotalCapitalIDR>0;}).map(function(i){return{platform:i.Platform,sector:i.Sector,asset:i.Asset,currentValueIDR:i.CurrentValueIDR};}).sort(function(a,b){return a.platform.localeCompare(b.platform)||a.sector.localeCompare(b.sector)||a.asset.localeCompare(b.asset);});
  },

  async getHistoryData() {
    var raw = await getRows_('transactions');
    var transactions = raw.map(function(row){return{rowNumber:row.id,timestamp:formatTimestampForClient_(row.Timestamp),date:formatDateForClient_(row.Date),platform:row.Platform||'',sector:row.Sector||'',asset:row.Asset||'',transactionType:row.TransactionType||'',amountIDR:toNumber_(row.AmountIDR),notes:row.Notes||'',status:row.Status||'Active'};}).filter(function(i){return i.status!=='Deleted'&&(i.asset||i.transactionType||i.amountIDR);}).reverse().slice(0,50);
    return { transactions:transactions };
  },

  async deleteTransaction(rowNumber) {
    var { error } = await _sb.from('transactions').update({status:'Deleted'}).eq('id',rowNumber);
    if (error) throw error;
    return { success:true, message:'Transaction deleted successfully.' };
  },

  // MONEY MANAGEMENT
  async mmGetAccounts() {
    var rows = await getRows_('mm_accounts');
    return rows.filter(function(r){return normalize_(r.Status||'Active')!=='Deleted';}).map(function(r){
      var showDb = r.ShowOnDashboard;
      var showOnDashboard = false;
      if (typeof showDb === 'boolean') {
        showOnDashboard = showDb;
      } else if (showDb !== undefined && showDb !== null) {
        var s = String(showDb).trim().toLowerCase();
        showOnDashboard = (s === 'true' || s === '1' || s === 'yes' || s === 't');
      }
      return {id:normalize_(r.AccountID),name:normalize_(r.Name),icon:normalize_(r.Icon)||'💳',initialBalance:toNumber_(r.InitialBalance),order:toNumber_(r.Order),showOnDashboard:showOnDashboard,status:normalize_(r.Status)||'Active'};
    }).sort(function(a,b){return a.order-b.order;});
  },

  async mmAddAccount(payload) {
    var id = 'ACC_'+Date.now();
    var { error } = await _sb.from('mm_accounts').insert(mapRowToDb({ AccountID:id, Name:normalize_(payload.name), Icon:normalize_(payload.icon)||'💳', InitialBalance:toNumber_(payload.initialBalance), Order:toNumber_(payload.order)||999, ShowOnDashboard:payload.showOnDashboard?'true':'false', Status:'Active' }));
    if (error) throw error;
    return { success:true, message:'Account added.', id:id };
  },

  async mmUpdateAccount(payload) {
    var up = {};
    if (payload.name!==undefined) up.Name=normalize_(payload.name);
    if (payload.icon!==undefined) up.Icon=normalize_(payload.icon);
    if (payload.initialBalance!==undefined) up.InitialBalance=toNumber_(payload.initialBalance);
    if (payload.order!==undefined) up.Order=toNumber_(payload.order);
    if (payload.showOnDashboard!==undefined) up.ShowOnDashboard=payload.showOnDashboard?'true':'false';
    var { error } = await _sb.from('mm_accounts').update(mapRowToDb(up)).eq('accountid',payload.id);
    if (error) throw error;
    return { success:true, message:'Account updated.' };
  },

  async mmDeleteAccount(accountId) {
    var { error } = await _sb.from('mm_accounts').update({status:'Deleted'}).eq('accountid',accountId);
    if (error) throw error;
    return { success:true, message:'Account deleted.' };
  },

  async mmGetCategories() {

    return rows.filter(function(r){return normalize_(r.Status||'Active')!=='Deleted';}).map(function(r){return{type:normalize_(r.Type),category:normalize_(r.Category),subcategory:normalize_(r.Subcategory)};});
  },

  async mmAddCategory(payload) {

  async mmGetAllocation() {
    var rows = await getRows_('mm_allocation');
    if (!rows.length) return [{category:'Living',percent:50,icon:'🏠',color:'#10b981'},{category:'Playing',percent:20,icon:'🎮',color:'#f59e0b'},{category:'Alms',percent:10,icon:'🤲',color:'#ec4899'},{category:'Invest',percent:20,icon:'📈',color:'#3b82f6'}];

  async mmSaveAllocation(payload) {
    var items = payload.items || [];
    var total = items.reduce(function(s,i){return s+toNumber_(i.percent);},0);
    if (Math.abs(total-100)>0.01) throw new Error('Total must be 100%. Current: '+total+'%');
    var { error: delError } = await _sb.from('mm_allocation').delete().neq('category','');
    if (delError) throw delError;
    var values = items.map(function(i){return mapRowToDb({Category:normalize_(i.category),Percent:toNumber_(i.percent),Icon:normalize_(i.icon)||'',Color:normalize_(i.color)||''});});
    if (values.length>0) { var { error: insError } = await _sb.from('mm_allocation').insert(values); if (insError) throw insError; }
    return { success:true, message:'Allocation saved.' };
  },

  async mmAddTransaction(payload) {
    var type=normalize_(payload.type),account=normalize_(payload.account),accountTo=normalize_(payload.accountTo)||'',amount=toNumber_(payload.amount);
    var category=(type==='Transfer'&&accountTo.startsWith('Invest:'))?'Invest':normalize_(payload.category)||'';
    // Need the new id back so the paired investment row can point at it.
    var { data, error } = await _sb.from('mm_transactions').insert(mapRowToDb({Date:payload.date,Type:type,Account:account,AccountTo:accountTo,Category:category,Subcategory:normalize_(payload.subcategory)||'',Amount:amount,Notes:normalize_(payload.notes)||'',Status:'Active'})).select('id');
    if (error) throw error;
    var mmId = data && data[0] ? data[0].id : null;

    // A transfer touching the investment side writes a second row in another
    // table. There is no shared transaction across two PostgREST calls, so on
    // failure undo the first write rather than leaving a half-recorded transfer.
    var invest = null;
    if (type==='Transfer'&&accountTo.startsWith('Invest:')) {
      var p=accountTo.replace('Invest:','');
      invest={date:payload.date,platform:p,sector:'Cash',asset:getCashAssetName_(p),amountIDR:amount,transactionType:'Deposit',notes:'Transfer from '+account,mmTxId:mmId};
    } else if (type==='Transfer'&&account.startsWith('Invest:')) {
      var p2=account.replace('Invest:','');
      invest={date:payload.date,platform:p2,sector:'Cash',asset:getCashAssetName_(p2),amountIDR:amount,transactionType:'Withdraw',notes:'Transfer to '+accountTo,mmTxId:mmId};
    }
    if (invest) {
      try {
        await this.addTransaction(invest);
      } catch (e) {
        if (mmId) await _sb.from('mm_transactions').delete().eq('id',mmId);
        throw new Error('Transfer dibatalkan — sisi investasi gagal disimpan: ' + (e.message || e));
      }
    }
    return { success:true, message:'Transaction saved.' };
  },

  async mmDeleteTransaction(rowNumber) {
    // Soft delete, matching accounts/categories — reads already skip Status='Deleted'.
    var { error } = await _sb.from('mm_transactions').update({status:'Deleted'}).eq('id',rowNumber);
    if (error) throw error;
    // Drop the paired investment row too, or the portfolio keeps counting it.
    // Tolerated if mm_tx_id has not been added to `transactions` yet.
    var pair = await _sb.from('transactions').update({status:'Deleted'}).eq('mm_tx_id',rowNumber);
    if (pair.error) console.warn('Paired investment row not cascaded:', pair.error.message);
    return { success:true, message:'Transaction deleted.' };
  },

  async mmUpdateTransaction(payload) {
    var { error } = await _sb.from('mm_transactions').update(mapRowToDb({Date:payload.date,Type:normalize_(payload.type),Account:normalize_(payload.account),AccountTo:normalize_(payload.accountTo)||'',Category:normalize_(payload.category)||'',Subcategory:normalize_(payload.subcategory)||'',Amount:toNumber_(payload.amount),Notes:normalize_(payload.notes)||''})).eq('id',payload.rowNumber);
    if (error) throw error;
    // Keep the paired investment row in step, otherwise editing a transfer
    // silently desyncs the portfolio from the ledger.
    var pair = await _sb.from('transactions').update({date:payload.date,amountidr:toNumber_(payload.amount)}).eq('mm_tx_id',payload.rowNumber);
    if (pair.error) console.warn('Paired investment row not updated:', pair.error.message);
    return { success:true, message:'Transaction updated.' };
  },

  async mmGetTransactions(options) {
    var rows = await getRows_('mm_transactions');
    var filtered = rows.filter(function(r){return normalize_(r.Status||'Active')!=='Deleted';});
    if (options&&options.startDate) filtered=filtered.filter(function(r){return formatDateForClient_(r.Date)>=options.startDate;});
    if (options&&options.endDate) filtered=filtered.filter(function(r){return formatDateForClient_(r.Date)<=options.endDate;});
    return filtered.map(function(r){return{rowNumber:r.id,timestamp:formatTimestampForClient_(r.Timestamp),date:formatDateForClient_(r.Date),type:normalize_(r.Type),account:normalize_(r.Account),accountTo:normalize_(r.AccountTo),category:normalize_(r.Category),subcategory:normalize_(r.Subcategory),amount:toNumber_(r.Amount),notes:normalize_(r.Notes),status:normalize_(r.Status)};}).reverse();
  },

  async mmGetDashboard() {
    var accounts=await this.mmGetAccounts(),allTransactions=await this.mmGetTransactions({}),allocation=await this.mmGetAllocation();
    var balances={}; accounts.forEach(function(acc){balances[acc.name]=acc.initialBalance;});
    function findExactAccountName(name) {
      if (!name) return null;
      var normalized = name.trim().toLowerCase();
      for (var i = 0; i < accounts.length; i++) {
        if (accounts[i].name.toLowerCase() === normalized) {
          return accounts[i].name;
        }
      }
      return name;
    }
    allTransactions.slice().reverse().forEach(function(tx){
      var accName = findExactAccountName(tx.account);
      var accToName = findExactAccountName(tx.accountTo);
      if(tx.type==='Income') {
        if (accName) balances[accName]=(balances[accName]||0)+tx.amount;
      } else if(tx.type==='Expense') {
        if (accName) balances[accName]=(balances[accName]||0)-tx.amount;
      } else if(tx.type==='Transfer'){
        if (accName) balances[accName]=(balances[accName]||0)-tx.amount;
        if (accToName) balances[accToName]=(balances[accToName]||0)+tx.amount;
      }
    });
    var netWorth=0; accounts.forEach(function(acc){if(acc.showOnDashboard) netWorth+=balances[acc.name]||0;});
    var now=new Date(),monthStartStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-01';

    // Net worth as it stood at the end of last month, so the dashboard badge
    // can show a real change instead of a hardcoded 0%. Same walk as above,
    // stopping before this month.
    var prevBalances={}; accounts.forEach(function(acc){prevBalances[acc.name]=acc.initialBalance;});
    allTransactions.slice().reverse().forEach(function(tx){
      if(tx.date>=monthStartStr) return;
      var accName=findExactAccountName(tx.account), accToName=findExactAccountName(tx.accountTo);
      if(tx.type==='Income'){ if(accName) prevBalances[accName]=(prevBalances[accName]||0)+tx.amount; }
      else if(tx.type==='Expense'){ if(accName) prevBalances[accName]=(prevBalances[accName]||0)-tx.amount; }
      else if(tx.type==='Transfer'){
        if(accName) prevBalances[accName]=(prevBalances[accName]||0)-tx.amount;
        if(accToName) prevBalances[accToName]=(prevBalances[accToName]||0)+tx.amount;
      }
    });
    var prevNetWorth=0; accounts.forEach(function(acc){if(acc.showOnDashboard) prevNetWorth+=prevBalances[acc.name]||0;});

    // Real net worth at the close of each of the last 6 months, for the
    // sparkline. It used to plot day-by-day within the current month, which
    // on the 1st leaves a single point — and the fallback then invented a
    // rising line out of nothing. One pass over date-sorted transactions,
    // snapshotting at each month end.
    var monthEnds=[];
    for(var mi=5;mi>=0;mi--){
      var me=new Date(now.getFullYear(), now.getMonth()-mi+1, 0);
      monthEnds.push(me.getFullYear()+'-'+String(me.getMonth()+1).padStart(2,'0')+'-'+String(me.getDate()).padStart(2,'0'));
    }
    var running={}; accounts.forEach(function(acc){running[acc.name]=acc.initialBalance;});
    // mmGetTransactions orders by insertion, not by date — a backdated entry
    // would land out of order, so sort explicitly before walking.
    var ascending=allTransactions.slice().sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);});
    var cursor=0, netWorthTrend=[];
    monthEnds.forEach(function(cutoff){
      while(cursor<ascending.length && ascending[cursor].date<=cutoff){
        var tx=ascending[cursor];
        var an=findExactAccountName(tx.account), atn=findExactAccountName(tx.accountTo);
        if(tx.type==='Income'){ if(an) running[an]=(running[an]||0)+tx.amount; }
        else if(tx.type==='Expense'){ if(an) running[an]=(running[an]||0)-tx.amount; }
        else if(tx.type==='Transfer'){
          if(an) running[an]=(running[an]||0)-tx.amount;
          if(atn) running[atn]=(running[atn]||0)+tx.amount;
        }
        cursor++;
      }
      var snapshot=0; accounts.forEach(function(acc){if(acc.showOnDashboard) snapshot+=running[acc.name]||0;});
      netWorthTrend.push({month:cutoff.slice(0,7), netWorth:snapshot});
    });

    var monthTransactions=allTransactions.filter(function(tx){return tx.date>=monthStartStr;});
    var totalIncome=0,totalExpense=0,categoryExpenses={};
    allocation.forEach(function(a){categoryExpenses[a.category]=0;});
    monthTransactions.forEach(function(tx){
      if(tx.type==='Income') totalIncome+=tx.amount;
      if(tx.type==='Expense'){totalExpense+=tx.amount;if(categoryExpenses[tx.category]!==undefined) categoryExpenses[tx.category]+=tx.amount;}
      if(tx.type==='Transfer'&&tx.category==='Invest'){if(categoryExpenses['Invest']!==undefined) categoryExpenses['Invest']+=tx.amount;}
    });
    var saving=totalIncome-totalExpense;
    var allocationCards=allocation.map(function(a){var target=totalIncome*(a.percent/100),spent=categoryExpenses[a.category]||0,progress=target>0?Math.min(spent/target,1):0;return{category:a.category,percent:a.percent,icon:a.icon,color:a.color,spent:spent,target:target,progress:progress};});
    return {accounts:accounts.map(function(acc){return Object.assign({},acc,{balance:balances[acc.name]||0});}),netWorth:netWorth,prevNetWorth:prevNetWorth,netWorthTrend:netWorthTrend,totalIncome:totalIncome,totalExpense:totalExpense,saving:saving,allocationCards:allocationCards,monthTransactions:monthTransactions,allocation:allocation};
  },

  // Years whose detail has been archived live in mm_summary instead of
  // mm_transactions: one row per month/type/category/subcategory. Anything
  // reading history has to look in both places or archived years vanish.
  async mmGetSummaryRows() {
    if (_summaryCache) return _summaryCache;
    var res = await _sb.from('mm_summary').select('*');
    if (res.error) {
      // Table not created yet (migration 001 not run) — behave exactly as
      // before instead of breaking History and Insight. PGRST205 is
      // PostgREST's "table not in schema cache".
      if (res.error.code === 'PGRST205' || /mm_summary/.test(res.error.message || '')) {
        _summaryCache = [];
        return _summaryCache;
      }
      throw res.error;
    }
    _summaryCache = (res.data || []).map(function(r){
      return { year:Number(r.period_year), month:Number(r.period_month), type:normalize_(r.type),
               category:normalize_(r.category), subcategory:normalize_(r.subcategory),
               amount:toNumber_(r.amount), txCount:Number(r.tx_count)||0 };
    });
    return _summaryCache;
  },

  // Which months exist only as a summary — used to tell the UI that a month
  // has no drill-down available.
  async mmGetArchivedMonths() {
    var rows = await this.mmGetSummaryRows(), keys = {};
    rows.forEach(function(r){ keys[r.year+'-'+String(r.month).padStart(2,'0')] = true; });
    return Object.keys(keys).sort();
  },

  async mmGetMonthlySummary(year,month) {
    var startDate=year+'-'+String(month).padStart(2,'0')+'-01',endDay=new Date(year,month,0).getDate(),endDate=year+'-'+String(month).padStart(2,'0')+'-'+String(endDay).padStart(2,'0');
    var transactions=await this.mmGetTransactions({startDate:startDate,endDate:endDate});
    var totalIncome=0,totalExpense=0,categoryBreakdown={};
    function addExpense(cat,sub,amount){
      cat=cat||'Other'; sub=sub||'General';
      if(!categoryBreakdown[cat]) categoryBreakdown[cat]={total:0,subs:{}};
      categoryBreakdown[cat].total+=amount;
      if(!categoryBreakdown[cat].subs[sub]) categoryBreakdown[cat].subs[sub]=0;
      categoryBreakdown[cat].subs[sub]+=amount;
    }
    transactions.forEach(function(tx){
      if(tx.type==='Income') totalIncome+=tx.amount;
      if(tx.type==='Expense'){totalExpense+=tx.amount;addExpense(tx.category,tx.subcategory,tx.amount);}
    });
    // Archived month: no rows above, so fold the summary in instead.
    var summary=(await this.mmGetSummaryRows()).filter(function(r){return r.year===Number(year)&&r.month===Number(month);});
    summary.forEach(function(r){
      if(r.type==='Income') totalIncome+=r.amount;
      if(r.type==='Expense'){totalExpense+=r.amount;addExpense(r.category,r.subcategory,r.amount);}
    });
    return {totalIncome:totalIncome,totalExpense:totalExpense,saving:totalIncome-totalExpense,
            categoryBreakdown:categoryBreakdown,transactions:transactions,
            archived:summary.length>0&&transactions.length===0};
  },

  async mmGetAllTimeSummary() {
    var transactions=await this.mmGetTransactions({}),monthly={};
    function bucket(k){ if(!monthly[k]) monthly[k]={income:0,expense:0,archived:false}; return monthly[k]; }
    transactions.forEach(function(tx){var d=new Date(tx.date);if(isNaN(d.getTime()))return;var b=bucket(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));if(tx.type==='Income')b.income+=tx.amount;if(tx.type==='Expense')b.expense+=tx.amount;});
    (await this.mmGetSummaryRows()).forEach(function(r){
      var b=bucket(r.year+'-'+String(r.month).padStart(2,'0'));
      b.archived=true;
      if(r.type==='Income') b.income+=r.amount;
      if(r.type==='Expense') b.expense+=r.amount;
    });
    return Object.entries(monthly).sort(function(a,b){return a[0].localeCompare(b[0]);}).map(function(e){return{month:e[0],income:e[1].income,expense:e[1].expense,saving:e[1].income-e[1].expense,archived:e[1].archived};});
  },

  // Year-over-year view: how the finances moved from one year to the next,
  // spanning archived and live years alike.
  async mmGetYearlySummary() {
    var years={};
    function bucket(y){ if(!years[y]) years[y]={year:Number(y),income:0,expense:0,categories:{},months:{},hasLive:false,hasSummary:false}; return years[y]; }
    function addCat(b,cat,amount){ cat=cat||'Other'; b.categories[cat]=(b.categories[cat]||0)+amount; }

    (await this.mmGetTransactions({})).forEach(function(tx){
      if(!tx.date) return;
      var b=bucket(tx.date.slice(0,4));
      b.hasLive=true;
      b.months[tx.date.slice(0,7)]=true;
      if(tx.type==='Income') b.income+=tx.amount;
      if(tx.type==='Expense'){ b.expense+=tx.amount; addCat(b,tx.category,tx.amount); }
    });
    (await this.mmGetSummaryRows()).forEach(function(r){
      var b=bucket(r.year);
      b.hasSummary=true;
      b.months[r.year+'-'+String(r.month).padStart(2,'0')]=true;
      if(r.type==='Income') b.income+=r.amount;
      if(r.type==='Expense'){ b.expense+=r.amount; addCat(b,r.category,r.amount); }
    });

    var list=Object.values(years).sort(function(a,b){return a.year-b.year;});
    return list.map(function(y,i){
      var prev=list[i-1];
      var saving=y.income-y.expense;
      var monthCount=Object.keys(y.months).length;
      return {
        year:y.year, income:y.income, expense:y.expense, saving:saving,
        savingRate: y.income>0 ? (saving/y.income)*100 : 0,
        monthCount: monthCount,
        avgMonthlyIncome: monthCount ? y.income/monthCount : 0,
        avgMonthlyExpense: monthCount ? y.expense/monthCount : 0,
        categories: Object.entries(y.categories).sort(function(a,b){return b[1]-a[1];}).map(function(e){return{category:e[0],amount:e[1],percent:y.expense>0?(e[1]/y.expense)*100:0};}),
        // Summary-only year: totals are trustworthy, but there is no detail to open.
        archived: y.hasSummary && !y.hasLive,
        // Growth against the previous year, normalised per month so a partial
        // year (2025 starts in July) is not compared unfairly against a full one.
        incomeGrowth: prev && prev.income>0 ? ((y.income/Math.max(monthCount,1)) / (prev.income/Math.max(Object.keys(prev.months).length,1)) - 1) * 100 : null,
        expenseGrowth: prev && prev.expense>0 ? ((y.expense/Math.max(monthCount,1)) / (prev.expense/Math.max(Object.keys(prev.months).length,1)) - 1) * 100 : null
      };
    });
  },

  async mmGetCalendarData(year,month) {

  async mmGetFinancialInsight() {

    var totalIncome=0,totalExpense=0,categoryExpenses={};
    allocation.forEach(function(a){categoryExpenses[a.category]=0;});
    monthTxs.forEach(function(tx){if(tx.type==='Income')totalIncome+=tx.amount;if(tx.type==='Expense'){totalExpense+=tx.amount;if(categoryExpenses[tx.category]!==undefined)categoryExpenses[tx.category]+=tx.amount;}if(tx.type==='Transfer'&&tx.category==='Invest'){if(categoryExpenses['Invest']!==undefined)categoryExpenses['Invest']+=tx.amount;}});
    var saving=totalIncome-totalExpense,savingRate=totalIncome>0?(saving/totalIncome)*100:0;
    var prevMonth=currentMonth===1?12:currentMonth-1,prevYear=currentMonth===1?currentYear-1:currentYear;
    var prevStartStr=prevYear+'-'+String(prevMonth).padStart(2,'0')+'-01',prevEndDay=new Date(prevYear,prevMonth,0).getDate(),prevEndStr=prevYear+'-'+String(prevMonth).padStart(2,'0')+'-'+String(prevEndDay).padStart(2,'0');
    var prevTxs=allTransactions.filter(function(tx){return tx.date>=prevStartStr&&tx.date<=prevEndStr;});

    var monthlyHistory=[];

// Apps Script Runner Mock (intercepts google.script.run)
function AppsScriptMockRunner(successCb, failureCb) { this.successCb = successCb; this.failureCb = failureCb; }
AppsScriptMockRunner.prototype.withSuccessHandler = function(cb) { this.successCb = cb; return this; };
AppsScriptMockRunner.prototype.withFailureHandler = function(cb) { this.failureCb = cb; return this; };

var runnerProxyHandler = {
  get: function(runner, methodName) {
    if (methodName in runner) return runner[methodName];
    return async function() {
      var args = arguments;
      try {
        if (!DB_API[methodName]) throw new Error('Function "' + methodName + '" is not implemented in the Supabase adapter.');
        var result = await DB_API[methodName].apply(DB_API, args);
        if (runner.successCb) runner.successCb(result);
      } catch (err) {
        console.error('Error executing ' + methodName + ':', err);
        if (runner.failureCb) runner.failureCb(err);
        else if (typeof showToast === 'function') showToast('Error: ' + (err.message || err), 'error');
      }
    };
  }
};

function createRunner(successCb, failureCb) {
  return new Proxy(new AppsScriptMockRunner(successCb, failureCb), runnerProxyHandler);
}

// Create global window.google object
window.google = {
  script: {
    run: new Proxy({}, {
      get: function(target, prop) {
        if (prop === 'withSuccessHandler') return function(cb) { return createRunner(cb, null); };
        if (prop === 'withFailureHandler') return function(cb) { return createRunner(null, cb); };
        return async function() {
          try { if (!DB_API[prop]) throw new Error('Function "'+prop+'" is not implemented.'); await DB_API[prop].apply(DB_API, arguments); }
          catch(err) { console.error(err); if (typeof showToast === 'function') showToast('Error: '+(err.message||err),'error'); }
        };
      }
    })
  }
};

// ============================================================
// INITIALIZATION & WIZARD
// ============================================================
function initSupabaseClient() {
  var creds = getSupabaseCredentials();
  if (creds.url && creds.key) {
    _sb = window.supabase.createClient(creds.url, creds.key, {
      auth: {
        // Keep the session so signing in is a one-time thing per device, and
        // let the client pick the token out of a magic-link redirect.
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });
    window.supabaseConnected = true;
    return true;
  }
  window.supabaseConnected = false;
  return false;
}

function saveSupabaseSettingsForm(event) {
  event.preventDefault();
  var url = document.getElementById('supabaseSettingsUrl').value.trim();
  var key = document.getElementById('supabaseSettingsKey').value.trim();
  safeStorage.setItem('supabase_url', url);
  safeStorage.setItem('supabase_key', key);
  if (typeof showToast === 'function') showToast('Supabase settings saved! Reloading...', 'success');
  setTimeout(function() { window.location.reload(); }, 1000);
}

function resetSupabaseSettings() {
  if (confirm('Apakah Anda yakin ingin memutuskan koneksi database? Data tidak akan hilang di Supabase, tapi Anda harus memasukkan URL & Anon Key lagi.')) {
    safeStorage.removeItem('supabase_url');
    safeStorage.removeItem('supabase_key');
    window.location.reload();
  }
}

  if (!settingsPage) return;

// ============================================================
// AUTH — magic link
// ============================================================
// The anon key ships inside this page, so it is not a secret. What keeps the
// data private is row level security: once migration 002 is applied, the
// database only answers requests carrying a logged-in user's token.
//
// The gate is driven by what the database actually allows, never by a flag in
// the client. If anonymous reads still work, RLS is not on yet and the app
// behaves exactly as it always has — so deploying this can never lock anyone
// out before the migration is run.

var AUTH_USER = null;

async function authCurrentUser() {
  if (!_sb) return null;
  try {
    var { data } = await _sb.auth.getSession();
    return data && data.session ? data.session.user : null;
  } catch (e) { return null; }
}

// Can we read anything without a session? Distinguishes "RLS off" from
// "RLS on and we are not logged in".
async function authAnonymousReadWorks() {
  try {
    var res = await _sb.from('mm_accounts').select('accountid').limit(1);
    return !res.error;
  } catch (e) { return false; }
}

function authShowGate(show) {
  var gate = document.getElementById('authGate');
  if (gate) gate.classList.toggle('hidden', !show);
}

function authResetStep() {
  document.getElementById('authStepPassword').classList.remove('hidden');
  document.getElementById('authStepSent').classList.add('hidden');
  document.getElementById('authError').classList.add('hidden');
}

// Password sign-in is the default route: it sends no email at all, so it is
// immune to both the redirect-URL trap and Supabase's 2-emails-per-hour cap
// on the built-in mailer. The phone's password manager fills it in one tap.
async function authSignIn(event) {
  event.preventDefault();
  var email = document.getElementById('authEmail').value.trim();
  var password = document.getElementById('authPassword').value;
  var btn = document.getElementById('authSignInBtn');
  if (!email || !password) return;
  btn.disabled = true;
  btn.textContent = 'Masuk...';
  document.getElementById('authError').classList.add('hidden');
  try {
    var { error } = await _sb.auth.signInWithPassword({ email: email, password: password });
    if (error) throw error;
    window.location.reload();
  } catch (e) {
    var msg = e.message || 'Gagal masuk.';
    if (/invalid login credentials/i.test(msg)) {
      msg = 'Email atau password salah.';
    } else if (/email not confirmed/i.test(msg)) {
      msg = 'Akun belum dikonfirmasi. Di Supabase → Authentication → Users, centang "Auto Confirm User".';
    }
    authShowError(msg);
    btn.disabled = false;
    btn.textContent = 'Masuk';
  }
}

function authShowMagicLink() {
  var email = document.getElementById('authEmail').value.trim();
  if (!email) {
    authShowError('Isi email dulu, lalu tekan lagi.');
    document.getElementById('authEmail').focus();
    return;
  }
  authSendMagicLink({ preventDefault: function(){} });
}

function authShowError(message) {
  var el = document.getElementById('authError');
  if (!el) return;
  el.textContent = message;
  el.classList.remove('hidden');
}

async function authSendMagicLink(event) {
  event.preventDefault();
  var email = document.getElementById('authEmail').value.trim();
  if (!email) return;
  document.getElementById('authError').classList.add('hidden');
  try {
    // Come back to this exact page; Supabase must have this URL in its
    // allow-list (Authentication -> URL Configuration -> Redirect URLs),
    // otherwise it silently falls back to Site URL — localhost by default.
    var redirectTo = window.location.origin + window.location.pathname;
    var { error } = await _sb.auth.signInWithOtp({
      email: email,
      options: { emailRedirectTo: redirectTo }
    });
    if (error) throw error;
    document.getElementById('authSentTo').textContent = email;
    document.getElementById('authStepPassword').classList.add('hidden');
    document.getElementById('authStepSent').classList.remove('hidden');
  } catch (e) {
    var msg = e.message || 'Gagal mengirim link.';
    // The built-in mailer allows only a couple of messages per hour.
    if (/rate limit|too many/i.test(msg)) {
      msg = 'Batas kirim email Supabase tercapai (2 per jam). Pakai password saja — tidak perlu email sama sekali.';
    }
    authShowError(msg);
  }
}

async function authSignOut() {
  if (!_sb) return;
  await _sb.auth.signOut();
  window.location.reload();
}

function injectAuthSettingsCard() {
  var settingsPage = document.getElementById('mmSettingsPage') || document.getElementById('settingsPage');
  if (!settingsPage || document.getElementById('authAccountCard')) return;
  var who = AUTH_USER ? AUTH_USER.email : 'Belum login';
  var action = AUTH_USER
    ? '<button class="btn-ghost" type="button" onclick="authSignOut()" style="color:var(--error);border-color:var(--error);">Logout</button>'
    : '<button class="btn-primary" type="button" onclick="authShowGate(true)">Login</button>';
  var card = '<section class="panel-card" id="authAccountCard"><div class="panel-body" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">'
    + '<div><p class="panel-eyebrow">Akun</p><h3 class="panel-title" style="font-size:14px;">' + escapeHtml(who) + '</h3></div>'
    + action + '</div></section>';
  var headerCard = settingsPage.querySelector('.page-header-card');
  if (headerCard) headerCard.insertAdjacentHTML('afterend', card);
  else settingsPage.insertAdjacentHTML('afterbegin', card);
}

// BOOTSTRAPPER — runs immediately
(function() {
  async function boot() {
    initSupabaseClient();

    if (_sb) {
      AUTH_USER = await authCurrentUser();
      if (!AUTH_USER && !(await authAnonymousReadWorks())) {
        // Database is locked down and we have no session: nothing will load,
        // so ask for a login instead of showing a broken dashboard.
        authShowGate(true);
        setTimeout(injectAuthSettingsCard, 300);
        return;
      }
      authShowGate(false);
      // Signing in or out mid-session should re-read everything.
      _sb.auth.onAuthStateChange(function(event) {
        if (event === 'SIGNED_IN' && !AUTH_USER) window.location.reload();
      });
    }

    setTimeout(injectSupabaseSettingsCard, 300);
    setTimeout(injectAuthSettingsCard, 300);
    if (typeof initApp === 'function') {
      initApp();
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
