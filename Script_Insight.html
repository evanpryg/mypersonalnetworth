<script>
/* ============================================================
   FINANCIAL INSIGHT — Frontend JavaScript
   Same quiet language as Home: score and numbers on the page, ONE card
   (this month vs last + cash flow), everything else as hairline lists.
   Icons are Lucide placeholders swapped in by lucide.createIcons().
   ============================================================ */

let INSIGHT_DATA = null;
let INSIGHT_LOADED = false;
let INSIGHT_YEAR = null;
let INSIGHT_MONTH = null;
let INSIGHT_CACHE = {};

function loadFinancialInsight(year, month) {
  if (!window.supabaseConnected) {
    const container = document.getElementById('insightContent');
    if (container) container.innerHTML = '<div class="insight-error"><p>Database is not connected. Configure connection in Settings.</p></div>';
    return;
  }

  const now = new Date();
  if (year && month) {
    INSIGHT_YEAR = Number(year);
    INSIGHT_MONTH = Number(month);
  } else if (!INSIGHT_YEAR || !INSIGHT_MONTH) {
    INSIGHT_YEAR = now.getFullYear();
    INSIGHT_MONTH = now.getMonth() + 1;
  }

  const cacheKey = `${INSIGHT_YEAR}-${INSIGHT_MONTH}`;
  if (INSIGHT_CACHE[cacheKey]) {
    INSIGHT_DATA = INSIGHT_CACHE[cacheKey];
    INSIGHT_LOADED = true;
    renderFinancialInsight(INSIGHT_DATA);
    return;
  }

  const container = document.getElementById('insightContent');
  if (container) {
    container.innerHTML = '<div class="insight-loading"><div class="mm-spinner"></div><p>Menganalisis keuangan…</p></div>';
  }

  google.script.run
    .withSuccessHandler(data => {
      INSIGHT_CACHE[cacheKey] = data;
      INSIGHT_DATA = data;
      INSIGHT_LOADED = true;
      renderFinancialInsight(data);
    })
    .withFailureHandler(err => {
      if (container) {
        container.innerHTML = `<div class="insight-error"><p>Gagal memuat data insight.</p><button class="btn-primary" onclick="loadFinancialInsight(INSIGHT_YEAR, INSIGHT_MONTH)">Coba lagi</button></div>`;
      }
    })
    .mmGetFinancialInsight(INSIGHT_YEAR, INSIGHT_MONTH);
}

function insPrevMonth() {
  if (!INSIGHT_MONTH) {
    const now = new Date();
    INSIGHT_YEAR = now.getFullYear();
    INSIGHT_MONTH = now.getMonth() + 1;
  }
  INSIGHT_MONTH--;
  if (INSIGHT_MONTH < 1) {
    INSIGHT_MONTH = 12;
    INSIGHT_YEAR--;
  }
  loadFinancialInsight(INSIGHT_YEAR, INSIGHT_MONTH);
}

function insNextMonth() {
  const now = new Date();
  if (INSIGHT_YEAR === now.getFullYear() && INSIGHT_MONTH >= (now.getMonth() + 1)) return;
  INSIGHT_MONTH++;
  if (INSIGHT_MONTH > 12) {
    INSIGHT_MONTH = 1;
    INSIGHT_YEAR++;
  }
  loadFinancialInsight(INSIGHT_YEAR, INSIGHT_MONTH);
}

function insCurrentMonth() {
  const now = new Date();
  loadFinancialInsight(now.getFullYear(), now.getMonth() + 1);
}

function refreshInsight() {
  if (INSIGHT_YEAR && INSIGHT_MONTH) {
    delete INSIGHT_CACHE[`${INSIGHT_YEAR}-${INSIGHT_MONTH}`];
  } else {
    INSIGHT_CACHE = {};
  }
  INSIGHT_LOADED = false;
  INSIGHT_DATA = null;
  loadFinancialInsight(INSIGHT_YEAR, INSIGHT_MONTH);
}

window.mmOpenInsightForMonth = function(year, month) {
  if (typeof mmShowPage === 'function') {
    mmShowPage('mmInsightPage');
  }
  loadFinancialInsight(Number(year), Number(month));
};

// Formatting helpers — both honour the hide-amounts toggle.
function insightIDR(value) { return mmFormatIDR(value); }
function insightShort(value) { return mmFormatIDRShort(value); }
function insIcon(name) { return `<i data-lucide="${name}" aria-hidden="true"></i>`; }
function insEsc(v) { return escapeHtml(String(v == null ? '' : v)); }

/* Section on the page background: title + optional sub over a hairline,
   then the body. Same shape as Home's plain lists (.hq-list-block). */
function insightSection(title, sub, body, extraClass, action) {
  return `
    <section class="hq-list-block ig-block ${extraClass || ''}">
      <div class="hx-head hq-head">
        <div class="hx-head-text">
          <h3 class="hx-title">${title}</h3>
          ${sub ? `<p class="hx-sub">${sub}</p>` : ''}
        </div>
        ${action || ''}
      </div>
      ${body}
    </section>`;
}

/* Layout (v4 — "Quiet Ledger", same language as Home):
   1. Top bar     — title, month switch, refresh
   2. Skor        — ring + status + three numbers, no card
   3. Bulan ini   — the ONE card: this month vs last + 6-month cash flow
   4. Perhatian   — plain list, most urgent first, good news as one line
   5. Anggaran    — plain list with today's pace marker
   6. Belanja     — one stacked bar + legend rows
   7. Investasi   — three numbers + best / worst / top-up rows
   8. Per tahun   — folded
   Desktop (>=1024): two columns — left 2-4, right 5-8. */
function renderFinancialInsight(data) {
  const container = document.getElementById('insightContent');
  if (!container || !data) return;

  const monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const now = new Date();
  const isCurrentMonth = data.isCurrentMonth;
  const isLatestMonth = data.currentYear === now.getFullYear() && data.currentMonth >= (now.getMonth() + 1);

  const subText = isCurrentMonth
    ? `Hari ke-${data.dayOfMonth} dari ${data.daysInMonth}`
    : `Rekap ${data.daysInMonth} hari${data.isArchived ? ' · ringkasan arsip' : ''}`;

  const head = `
    <header class="ah-top">
      <div class="ah-top-text">
        <h1 class="ah-title">Insight</h1>
        <p class="ah-sub">${subText}</p>
      </div>
      <button type="button" class="ah-icon-btn is-bordered" onclick="refreshInsight()" aria-label="Muat ulang analisis">${insIcon('refresh-cw')}</button>
    </header>
    <div class="ig-monthbar" role="group" aria-label="Pilih bulan">
      <button type="button" class="ah-icon-btn" onclick="insPrevMonth()" aria-label="Bulan sebelumnya">${insIcon('chevron-left')}</button>
      <strong class="ah-month" aria-live="polite">${monthNames[data.currentMonth - 1]} ${data.currentYear}</strong>
      <button type="button" class="ah-icon-btn" onclick="insNextMonth()" aria-label="Bulan berikutnya" ${isLatestMonth ? 'disabled' : ''}>${insIcon('chevron-right')}</button>
      ${!isCurrentMonth ? `<button type="button" class="ig-today" onclick="insCurrentMonth()">Bulan ini</button>` : ''}
    </div>`;

  const main = renderInsightHero(data) + renderMonthCard(data) + renderAttention(data);
  const side = renderBudgetPace(data) + renderSpendingAnalysis(data)
    + (data.investmentData ? renderInvestmentInsight(data) : '') + renderYearlyProgress(data);

  container.innerHTML = `
    <div class="hx hq ig">
      ${head}
      <div class="hx-cols">
        <div class="hx-col hx-col-main">${main}</div>
        <div class="hx-col hx-col-side">${side}</div>
      </div>
    </div>`;
  if (window.lucide) lucide.createIcons();
}

/* === SCORE === */
function computeHealth(data) {
  let score = 50;
  const reasons = [];
  const add = (points, text, good) => { score += points; reasons.push({ text, good }); };

  if (data.savingRate >= 30) add(25, 'Saving rate sangat baik (≥30%)', true);
  else if (data.savingRate >= 20) add(18, 'Saving rate baik (≥20%)', true);
  else if (data.savingRate >= 10) add(10, 'Saving rate cukup (≥10%)', true);
  else if (data.savingRate > 0) add(5, 'Saving rate masih rendah (<10%)', false);
  else add(-10, 'Pengeluaran melebihi pemasukan', false);

  // Every blown budget costs points in proportion to how far over it is
  // (−8 at the line, up to −20 at double). The old rule *added* 8 for one
  // blown budget, so a month with overspending could still score 100.
  const overBudget = data.budgetAnalysis.filter(b => b.progress > 1 && b.target > 0 && !b.isSaving);
  const investOver = data.budgetAnalysis.filter(b => b.progress > 1 && b.isSaving);
  if (overBudget.length === 0 && data.budgetAnalysis.some(b => b.target > 0)) {
    add(15, 'Semua budget terkendali', true);
  }
  overBudget.forEach(b => {
    const overPct = Math.min((b.progress - 1) * 100, 100);
    add(-Math.round(8 + overPct * 0.12), `Budget ${b.category} lewat ${overPct.toFixed(0)}%`, false);
  });
  if (investOver.length > 0) add(5, 'Investasi melebihi target', true);

  const history = data.monthlyHistory;
  if (history.length >= 2) {
    const positive = history.slice(-3).filter(h => h.saving > 0).length;
    if (positive === 3) add(10, 'Cash flow positif 3 bulan berturut-turut', true);
    else if (positive >= 2) add(5, 'Cash flow umumnya positif', true);
  }

  if (data.investmentData) {
    if (data.investmentData.returnPercent > 0) add(5, 'Investasi menghasilkan profit', true);
    if (data.investmentData.portfolio.length >= 3) add(5, 'Portofolio terdiversifikasi', true);
  }

  // Caps: bonuses elsewhere can't paper over a real problem this month.
  // A deficit keeps the score under "Cukup"; any blown budget keeps it
  // out of "Sangat baik".
  let cap = 100;
  if (data.saving < 0) cap = 45;
  else if (overBudget.length > 0) cap = 75;
  if (score > cap) reasons.push({ text: `Skor dibatasi ${cap} karena ${data.saving < 0 ? 'defisit' : 'ada budget terlampaui'}`, good: false });
  score = Math.max(0, Math.min(cap, score));
  let status, tone;
  if (score >= 80) { status = 'Sangat baik'; tone = 'good'; }
  else if (score >= 60) { status = 'Baik'; tone = 'ok'; }
  else if (score >= 40) { status = 'Cukup'; tone = 'warn'; }
  else { status = 'Perlu perhatian'; tone = 'bad'; }
  return { score, status, tone, reasons };
}


function renderInsightHero(data) {
  const h = computeHealth(data);
  const r = 22;
  const circumference = 2 * Math.PI * r;
  const offset = circumference - (h.score / 100) * circumference;

  const rateDelta = data.prevSavingRate ? data.savingRate - data.prevSavingRate : null;
  const rateSub = rateDelta === null ? 'target ≥20%'
    : `${rateDelta >= 0 ? '↑' : '↓'} ${Math.abs(rateDelta).toFixed(1)} poin`;
  const pred = data.prediction || {};
  const isCurrent = data.isCurrentMonth;
  const hasPred = isCurrent ? (data.dayOfMonth >= 5 && pred.saving !== undefined) : true;
  const kpi3Label = isCurrent ? 'Proyeksi' : 'Status';
  const kpi3Val = isCurrent
    ? (hasPred ? insightShort(pred.saving) : '—')
    : (data.saving >= 0 ? 'Surplus' : 'Defisit');
  const kpi3Sub = isCurrent ? (hasPred ? 'akhir bulan' : 'mulai hari ke-5') : insightShort(Math.abs(data.saving));
  const kpi3Cls = !hasPred ? '' : (isCurrent ? (pred.saving >= 0 ? 'pos' : 'neg') : (data.saving >= 0 ? 'pos' : 'neg'));

  const expenseShare = data.totalIncome > 0 ? Math.round(data.totalExpense / data.totalIncome * 100) : null;
  const line = expenseShare === null
    ? (isCurrent ? 'Belum ada pemasukan tercatat bulan ini.' : 'Tidak ada pemasukan tercatat.')
    : `Pengeluaran ${expenseShare}% dari pemasukan.`;

  return `
    <section class="ig-hero" aria-label="Skor kesehatan keuangan">
      <div class="ig-score">
        <div class="ig-ring tone-${h.tone}" role="img" aria-label="Skor kesehatan ${h.score} dari 100">
          <svg viewBox="0 0 52 52" aria-hidden="true">
            <circle cx="26" cy="26" r="${r}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="5"/>
            <circle class="ig-ring-arc" cx="26" cy="26" r="${r}" fill="none" stroke-width="5"
              stroke-dasharray="${circumference.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"
              stroke-linecap="round" transform="rotate(-90 26 26)"/>
          </svg>
          <strong>${h.score}</strong>
        </div>
        <div class="ig-score-text">
          <span class="ig-status tone-${h.tone}">${h.status}</span>
          <p>${line}</p>
        </div>
      </div>

      <dl class="hx-flow ig-kpis">
        <div class="hx-flow-item">
          <dt>Saving rate</dt>
          <dd class="${data.savingRate >= 20 ? 'pos' : data.savingRate < 0 ? 'neg' : 'warn'}">${data.savingRate.toFixed(1)}%</dd>
          <dd class="ig-kpi-sub ${rateDelta === null ? '' : rateDelta >= 0 ? 'pos' : 'neg'}">${rateSub}</dd>
        </div>
        <div class="hx-flow-item">
          <dt>Sisa</dt>
          <dd class="${data.saving >= 0 ? 'pos' : 'neg'}">${insightShort(data.saving)}</dd>
          <dd class="ig-kpi-sub">masuk − keluar</dd>
        </div>
        <div class="hx-flow-item">
          <dt>${kpi3Label}</dt>
          <dd class="${kpi3Cls}">${kpi3Val}</dd>
          <dd class="ig-kpi-sub">${kpi3Sub}</dd>
        </div>
      </dl>

      <details class="ig-why">
        <summary>Kenapa skor ${h.score}? ${insIcon('chevron-down')}</summary>
        <ul>
          ${h.reasons.map(x => `<li class="${x.good ? 'good' : 'bad'}">${insIcon(x.good ? 'check' : 'x')}<span>${insEsc(x.text)}</span></li>`).join('')}
        </ul>
      </details>
    </section>`;
}

/* === THE ONE CARD: this month vs last, then the 6-month cash flow ===
   Two answers to "how is money moving" in one box instead of two. */
function renderMonthCard(data) {
  const isCurrent = data.isCurrentMonth;
  const hasPred = isCurrent && data.dayOfMonth >= 5 && data.prediction;
  const pred = data.prediction || {};
  const delta = (cur, prev, upIsGood) => {
    if (!prev) return '<span class="ig-delta">—</span>';
    const pct = (cur - prev) / Math.abs(prev) * 100;
    if (!isFinite(pct)) return '<span class="ig-delta">—</span>';
    const good = upIsGood ? pct >= 0 : pct <= 0;
    return `<span class="ig-delta ${good ? 'pos' : 'neg'}">${pct >= 0 ? '↑' : '↓'}${Math.abs(pct).toFixed(0)}%</span>`;
  };
  const col4 = (predVal, pastText, isPositive) => isCurrent
    ? `<span role="cell" class="ig-proj">${hasPred ? insightShort(predVal) : '—'}</span>`
    : `<span role="cell" class="ig-proj ${isPositive === undefined ? '' : (isPositive ? 'pos' : 'neg')}">${pastText}</span>`;
  const rows = [
    { label: 'Masuk', cls: 'is-in', now: insightShort(data.totalIncome), d: delta(data.totalIncome, data.prevIncome, true), c4: col4(pred.income, 'Tercatat') },
    { label: 'Keluar', cls: 'is-out', now: insightShort(data.totalExpense), d: delta(data.totalExpense, data.prevExpense, false), c4: col4(pred.expense, 'Selesai') },
    { label: 'Sisa', cls: data.saving >= 0 ? 'pos' : 'neg', now: insightShort(data.saving), d: delta(data.saving, data.prevSaving, true), c4: col4(pred.saving, data.saving >= 0 ? 'Surplus' : 'Defisit', data.saving >= 0) },
    { label: 'Net worth', cls: '', now: insightShort(data.netWorth), d: '<span class="ig-delta">—</span>', c4: col4(pred.netWorth, 'Akhir bln') }
  ];
  const table = `
    <div class="ig-table" role="table" aria-label="Bulan ini dibanding bulan lalu">
      <div class="ig-tr ig-th" role="row">
        <span role="columnheader"></span>
        <span role="columnheader">${isCurrent ? 'Sekarang' : 'Realisasi'}</span>
        <span role="columnheader">vs lalu</span>
        <span role="columnheader">${isCurrent ? 'Proyeksi' : 'Status'}</span>
      </div>
      ${rows.map(r => `
        <div class="ig-tr" role="row">
          <span role="rowheader">${r.label}</span>
          <strong role="cell" class="${r.cls}">${r.now}</strong>
          <span role="cell">${r.d}</span>
          ${r.c4}
        </div>`).join('')}
    </div>`;

  const sub = isCurrent
    ? (hasPred ? `Proyeksi dari ${data.dayOfMonth} hari berjalan` : 'Proyeksi muncul mulai hari ke-5')
    : 'Dibanding bulan sebelumnya';

  return `
    <section class="hx-card ig-card" aria-labelledby="igMonthTitle">
      <div class="ig-card-head">
        <div class="hx-head-text">
          <h3 class="hx-title" id="igMonthTitle">${isCurrent ? 'Bulan ini' : 'Ringkasan bulan'}</h3>
          <p class="hx-sub">${sub}</p>
        </div>
      </div>
      ${table}
      ${renderCashFlowAnalysis(data)}
    </section>`;
}

/* === WHAT NEEDS ATTENTION ===
   One list, most urgent first; good news is a single quiet line. */
function renderAttention(data) {
  const items = [];   // { rank, tone, icon, title, detail }
  const good = [];    // { icon, text }
  const isCurrent = data.isCurrentMonth;
  const daysLeft = Math.max(data.daysInMonth - data.dayOfMonth, 0);
  const timePct = data.dayOfMonth / data.daysInMonth;

  if (data.saving < 0) {
    items.push({ rank: 0, tone: 'bad', icon: 'trending-down', title: 'Pengeluaran melebihi pemasukan',
      detail: `Defisit ${insightIDR(-data.saving)} ${isCurrent ? 'bulan ini' : 'di bulan tersebut'}.` });
  }

  data.budgetAnalysis.forEach(b => {
    if (!(b.target > 0)) return;
    const cat = insEsc(b.category);
    if (b.isSaving) {
      if (b.progress >= 1) good.push({ icon: 'piggy-bank', text: `${cat} melebihi target` });
      else if (b.progress < 0.5) {
        items.push({ rank: 3, tone: 'info', icon: 'piggy-bank', title: `${cat} baru ${(b.progress * 100).toFixed(0)}% dari target`,
          detail: isCurrent ? `Kurang ${insightIDR(b.target - b.spent)} · ${daysLeft} hari lagi.` : `Realisasi ${insightIDR(b.spent)} dari target ${insightIDR(b.target)}.` });
      }
      return;
    }
    if (b.progress >= 1) {
      items.push({ rank: 0, tone: 'bad', icon: 'octagon-alert', title: `Budget ${cat} terlampaui`,
        detail: isCurrent ? `Lebih ${insightIDR(b.spent - b.target)}. Tahan pengeluaran ${cat} sampai akhir bulan.` : `Melebihi target sebesar ${insightIDR(b.spent - b.target)} (${(b.progress * 100).toFixed(0)}% terpakai).` });
    } else if (b.progress >= 0.9 && isCurrent) {
      items.push({ rank: 1, tone: 'warn', icon: 'triangle-alert', title: `Budget ${cat} hampir habis`,
        detail: `Sisa ${insightIDR(b.target - b.spent)} ≈ ${insightIDR((b.target - b.spent) / Math.max(daysLeft, 1))}/hari untuk ${daysLeft} hari.` });
    } else if (isCurrent && b.progress > timePct + 0.15 && data.dayOfMonth >= 5) {
      items.push({ rank: 2, tone: 'warn', icon: 'gauge', title: `${cat} lebih cepat dari jadwal`,
        detail: `Terpakai ${(b.progress * 100).toFixed(0)}% di hari ke-${data.dayOfMonth} (idealnya ≤${(timePct * 100).toFixed(0)}%).` });
    } else if (!isCurrent && b.progress < 1) {
      good.push({ icon: 'circle-check', text: `Budget ${cat} terkendali (${(b.progress * 100).toFixed(0)}%)` });
    }

    if (b.prevSpent > 0 && b.spent > 0) {
      const change = (b.spent - b.prevSpent) / b.prevSpent * 100;
      if (change >= 15 && b.progress < 0.9) {
        items.push({ rank: 2, tone: 'warn', icon: 'arrow-up-right', title: `Pengeluaran ${cat} naik ${change.toFixed(0)}%`,
          detail: `${insightIDR(b.spent)} vs ${insightIDR(b.prevSpent)} bulan lalu.` });
      } else if (change <= -15) {
        good.push({ icon: 'arrow-down-right', text: `${cat} turun ${Math.abs(change).toFixed(0)}%` });
      }
    }
  });

  if (data.savingRate >= 0 && data.savingRate < 20 && data.totalIncome > 0) {
    const needed = data.totalIncome * 0.2 - data.saving;
    if (needed > 0) items.push({ rank: 2, tone: 'warn', icon: 'percent', title: `Saving rate ${data.savingRate.toFixed(1)}% — di bawah 20%`,
      detail: isCurrent ? `Kurangi pengeluaran ${insightIDR(needed)} untuk mencapai 20%.` : `Selisih ${insightIDR(needed)} untuk mencapai target ideal 20%.` });
  }

  const avgExpense = data.monthlyHistory.length
    ? data.monthlyHistory.reduce((s, h) => s + h.expense, 0) / data.monthlyHistory.length : 0;
  if (avgExpense > 0 && data.netWorth < avgExpense * 3) {
    items.push({ rank: 3, tone: 'info', icon: 'shield', title: 'Dana darurat belum cukup',
      detail: `Target minimal ${insightIDR(avgExpense * 3)} (3× rata-rata pengeluaran).` });
  }

  const inv = data.investmentData;
  if (inv) {
    if (inv.rebalanceSuggestions && inv.rebalanceSuggestions.length) {
      const top = inv.rebalanceSuggestions[0];
      items.push({ rank: 3, tone: 'info', icon: 'scale', title: `Tambah sektor ${insEsc(top.sector)}`,
        detail: `${insightIDR(top.suggestedAmountIDR)} untuk mendekati target alokasi.` });
    }
    if (inv.portfolio.length > 0 && inv.portfolio.length <= 2) {
      items.push({ rank: 3, tone: 'info', icon: 'shuffle', title: 'Portofolio terlalu terkonsentrasi',
        detail: `Baru ${inv.portfolio.length} aset — pertimbangkan diversifikasi.` });
    }
    if (inv.profitLoss > 0) good.push({ icon: 'trending-up', text: `Investasi +${inv.returnPercent.toFixed(1)}%` });
  }

  if (data.prevSavingRate > 0 && data.savingRate > data.prevSavingRate) good.push({ icon: 'trending-up', text: 'Saving rate naik' });
  if (data.saving > 0) good.push({ icon: 'circle-check', text: 'Cash flow positif' });
  if (data.savingRate >= 20) good.push({ icon: 'target', text: `Saving rate ${data.savingRate.toFixed(0)}%` });
  if (data.isNetWorthHighest && data.netWorth > 0) good.push({ icon: 'trophy', text: 'Net worth tertinggi' });
  if (isCurrent && data.streak >= 7) good.push({ icon: 'flame', text: `${data.streak} hari mencatat` });
  if (data.budgetMetMonths >= 3) good.push({ icon: 'shield-check', text: `${data.budgetMetMonths} bulan cash flow positif` });

  items.sort((a, b) => a.rank - b.rank);
  const row = i => `
    <li class="ig-item tone-${i.tone}">
      <span class="ig-item-ic">${insIcon(i.icon)}</span>
      <span class="ig-item-body"><strong>${i.title}</strong><span>${i.detail}</span></span>
    </li>`;

  const shown = items.slice(0, 3);
  const rest = items.slice(3);
  const list = items.length
    ? `<ul class="ig-list">${shown.map(row).join('')}</ul>
       ${rest.length ? `<details class="ig-more"><summary>${rest.length} lainnya ${insIcon('chevron-down')}</summary><ul class="ig-list">${rest.map(row).join('')}</ul></details>` : ''}`
    : `<p class="ig-allgood">${insIcon('circle-check')}<span>Tidak ada yang perlu dikhawatirkan.</span></p>`;

  const goodLine = good.length
    ? `<p class="ig-good" aria-label="Kabar baik">${insIcon('sparkles')}<span>${good.map(g => g.text).join(' · ')}</span></p>`
    : '';

  const sub = items.length ? `${items.length} hal, paling mendesak di atas` : '';
  return insightSection('Perlu perhatian', sub, `${list}${goodLine}`);
}

/* === BUDGET PACE ===
   Home shows how much is used; this shows whether that is ahead of the
   calendar — the tick is where spending "should" be today. */
function renderBudgetPace(data) {
  const items = data.budgetAnalysis.filter(b => b.target > 0);
  if (!items.length) return '';
  const isCurrent = data.isCurrentMonth;
  const timePct = isCurrent ? (Math.min(data.dayOfMonth / data.daysInMonth, 1) * 100) : 100;
  const daysLeft = Math.max(data.daysInMonth - data.dayOfMonth, 0);

  const rows = items.map(b => {
    const pct = b.progress * 100;
    let state = 'ok';
    if (b.isSaving) state = b.progress >= 1 ? 'done' : 'saving';
    else if (b.progress >= 1) state = 'over';
    else if (b.progress >= 0.9 || (isCurrent && pct > timePct + 15)) state = 'warn';
    const left = b.target - b.spent;
    const foot = isCurrent
      ? (b.isSaving
        ? (left > 0 ? `kurang ${insightShort(left)}` : `lebih ${insightShort(-left)}`)
        : (left >= 0 ? `${insightShort(left / Math.max(daysLeft, 1))}/hari` : `lebih ${insightShort(-left)}`))
      : (b.isSaving
        ? (left > 0 ? `kurang ${insightShort(left)}` : `tercapai +${insightShort(-left)}`)
        : (left >= 0 ? `hemat ${insightShort(left)}` : `over +${insightShort(-left)}`));
    return `
      <div class="ig-pace is-${state}">
        <div class="ig-pace-top">
          <span>${insEsc(b.category)}${b.isSaving ? ' <em>tabungan</em>' : ''}</span>
          <strong>${pct.toFixed(0)}%</strong>
        </div>
        <div class="ig-pace-bar">
          <span class="ig-pace-fill" style="width:${Math.min(pct, 100)}%"></span>
          ${b.isSaving || !isCurrent ? '' : `<span class="ig-pace-mark" style="left:${timePct}%" aria-hidden="true"></span>`}
        </div>
        <div class="ig-pace-foot"><span>${insightShort(b.spent)} / ${insightShort(b.target).replace('Rp ', '')}</span><span class="ig-pace-note">${foot}</span></div>
      </div>`;
  }).join('');

  const sub = isCurrent
    ? `Dana ${insightShort(data.budgetBase || 0)} · garis = batas ideal hari ini`
    : `Dana ${insightShort(data.budgetBase || 0)} · realisasi akhir`;
  const note = `<p class="ig-fine">Dana = sisa bulan lalu ${insightShort(data.carryover || 0)} + pemasukan ${insightShort(data.totalIncome)}</p>`;
  return insightSection(isCurrent ? 'Laju anggaran' : 'Realisasi anggaran', sub, `<div class="ig-rows">${rows}</div>${note}`);
}

/* === TOP SPENDING ===
   One stacked bar for the shares, then a legend row per category. */
function renderSpendingAnalysis(data) {
  const monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const monthLabel = monthNames[data.currentMonth - 1] || 'Bulan ini';
  if (!data.spendingByCategory.length) {
    return insightSection('Pengeluaran terbesar', `${monthLabel} ${data.currentYear}`, '<p class="ig-empty">Tidak ada pengeluaran tercatat di bulan ini.</p>');
  }
  const top = data.spendingByCategory.slice(0, 5);
  const colors = ['#22d3ee', '#fbbf24', '#f472b6', '#818cf8', '#fb923c'];
  const stack = top.map((c, i) => `<span style="width:${Math.max(c.percent, 0).toFixed(1)}%;background:${colors[i]}" title="${insEsc(c.category)} ${c.percent.toFixed(0)}%"></span>`).join('');
  const rows = top.map((c, i) => `
    <div class="ig-leg">
      <span class="ig-leg-name"><i style="background:${colors[i]}"></i>${insEsc(c.category)}</span>
      <span class="ig-leg-pct">${c.percent.toFixed(0)}%</span>
      <strong>${insightShort(c.amount)}</strong>
    </div>`).join('');
  return insightSection('Pengeluaran terbesar', `${monthLabel} ${data.currentYear}, per kategori`,
    `<div class="ig-stack" role="img" aria-label="Porsi pengeluaran per kategori">${stack}</div><div class="ig-rows">${rows}</div>`);
}

/* === CASH FLOW TREND (lives inside the month card) === */
function renderCashFlowAnalysis(data) {
  const history = data.monthlyHistory;
  if (history.length < 2) return '';
  const max = Math.max(...history.map(h => Math.max(h.income, h.expense)), 1);
  const avgSaving = history.reduce((s, h) => s + h.saving, 0) / history.length;
  const positive = history.filter(h => h.saving > 0).length;

  const cols = history.map(h => `
    <div class="ig-cf-col" title="${insEsc(h.label)} · masuk ${insightIDR(h.income)} · keluar ${insightIDR(h.expense)}">
      <div class="ig-cf-bars">
        <span class="in" style="height:${(h.income / max * 100).toFixed(0)}%"></span>
        <span class="out" style="height:${(h.expense / max * 100).toFixed(0)}%"></span>
      </div>
      <span class="ig-cf-net ${h.saving >= 0 ? 'pos' : 'neg'}">${h.saving >= 0 ? '+' : '−'}${insightShort(Math.abs(h.saving)).replace('Rp ', '')}</span>
      <span class="ig-cf-label">${insEsc(h.label)}</span>
    </div>`).join('');

  return `
    <div class="ig-cf-wrap">
      <div class="ig-cf-head">
        <span class="ig-cf-title">Cash flow ${history.length} bulan</span>
        <span class="ig-cf-meta">${positive}/${history.length} positif · rata-rata ${insightShort(avgSaving)}</span>
      </div>
      <div class="ig-cf" role="img" aria-label="Pemasukan dan pengeluaran ${history.length} bulan terakhir">${cols}</div>
      <div class="ig-legend">
        <span><i class="in"></i>Masuk</span>
        <span><i class="out"></i>Keluar</span>
        <span>angka = sisa</span>
      </div>
    </div>`;
}

/* === INVESTMENT === */
function renderInvestmentInsight(data) {
  const inv = data.investmentData;
  if (!inv) return '';
  const portfolio = inv.portfolio || [];
  const best = portfolio.length ? portfolio.reduce((a, b) => a.GrowthPercent > b.GrowthPercent ? a : b) : null;
  const worst = portfolio.length ? portfolio.reduce((a, b) => a.GrowthPercent < b.GrowthPercent ? a : b) : null;
  const pl = inv.profitLoss >= 0;

  const rows = [];
  if (best) rows.push(`<div class="ig-kv"><span>${insIcon('arrow-up-right')}Terbaik · ${insEsc(best.Asset)}</span><strong class="pos">+${(best.GrowthPercent * 100).toFixed(1)}%</strong></div>`);
  if (worst && best && worst.Asset !== best.Asset) rows.push(`<div class="ig-kv"><span>${insIcon('arrow-down-right')}Terlemah · ${insEsc(worst.Asset)}</span><strong class="${worst.GrowthPercent >= 0 ? 'pos' : 'neg'}">${(worst.GrowthPercent * 100).toFixed(1)}%</strong></div>`);
  (inv.rebalanceSuggestions || []).slice(0, 2).forEach(r => {
    rows.push(`<div class="ig-kv"><span>${insIcon('plus')}Top-up · ${insEsc(r.sector)}</span><strong>${insightShort(r.suggestedAmountIDR)}</strong></div>`);
  });

  const body = `
    <dl class="hx-flow ig-kpis ig-kpis-inv">
      <div class="hx-flow-item"><dt>Nilai</dt><dd>${insightShort(inv.totalValue)}</dd></div>
      <div class="hx-flow-item"><dt>Profit/Loss</dt><dd class="${pl ? 'pos' : 'neg'}">${pl ? '+' : ''}${insightShort(inv.profitLoss)}</dd></div>
      <div class="hx-flow-item"><dt>Return</dt><dd class="${inv.returnPercent >= 0 ? 'pos' : 'neg'}">${inv.returnPercent >= 0 ? '+' : ''}${inv.returnPercent.toFixed(1)}%</dd></div>
    </dl>
    ${rows.length ? `<div class="ig-rows">${rows.join('')}</div>` : ''}`;
  return insightSection('Investasi', `${portfolio.length} aset`, body);
}

/* === YEAR OVER YEAR (folded) ===
   Reads mmGetYearlySummary, which merges live transactions with archived
   years held in mm_summary. Years differ in length (2025 only starts in
   July), so growth is compared per month, not on raw totals. */
function renderYearlyProgress(data) {
  const years = data.yearlySummary || [];
  if (years.length < 1) return '';

  const maxFlow = Math.max(...years.map(y => Math.max(y.income, y.expense)), 1);
  const growth = (value, invert) => {
    if (value === null || !isFinite(value)) return '<span class="insight-yoy-growth muted">—</span>';
    const good = invert ? value < 0 : value > 0;
    return `<span class="insight-yoy-growth ${good ? 'pos' : 'neg'}">${value >= 0 ? '↑' : '↓'} ${Math.abs(value).toFixed(0)}%</span>`;
  };

  const rows = years.slice().reverse().map(y => {
    const topCats = (y.categories || []).slice(0, 3)
      .map(c => `<span class="insight-yoy-cat">${insEsc(c.category)} ${c.percent.toFixed(0)}%</span>`).join('');
    return `
      <div class="insight-yoy-row">
        <div class="insight-yoy-head">
          <strong class="insight-yoy-year">${y.year}</strong>
          <span class="insight-yoy-meta">${y.monthCount} bulan${y.archived ? ' · ringkasan' : ''}</span>
        </div>
        <div class="insight-yoy-bars">
          <div class="insight-yoy-bar-line">
            <span class="insight-yoy-bar-label">Masuk</span>
            <div class="insight-yoy-track"><div class="insight-yoy-fill income" style="width:${(y.income / maxFlow * 100).toFixed(1)}%"></div></div>
            <span class="insight-yoy-amt">${insightShort(y.income)}</span>
            ${growth(y.incomeGrowth, false)}
          </div>
          <div class="insight-yoy-bar-line">
            <span class="insight-yoy-bar-label">Keluar</span>
            <div class="insight-yoy-track"><div class="insight-yoy-fill expense" style="width:${(y.expense / maxFlow * 100).toFixed(1)}%"></div></div>
            <span class="insight-yoy-amt">${insightShort(y.expense)}</span>
            ${growth(y.expenseGrowth, true)}
          </div>
        </div>
        <div class="insight-yoy-foot">
          <span>Sisa <strong class="${y.saving >= 0 ? 'pos' : 'neg'}">${insightShort(y.saving)}</strong></span>
          <span>Rasio nabung <strong class="${y.savingRate >= 20 ? 'pos' : 'warn'}">${y.savingRate.toFixed(0)}%</strong></span>
          <span class="insight-yoy-avg">Rata-rata/bln ${insightShort(y.avgMonthlyExpense)}</span>
        </div>
        ${topCats ? `<div class="insight-yoy-cats">${topCats}</div>` : ''}
      </div>`;
  }).join('');

  const archivedNote = years.some(y => y.archived)
    ? '<p class="insight-yoy-note">Tahun bertanda “ringkasan” hanya menyimpan total per kategori — detail transaksinya sudah diarsipkan.</p>'
    : '';

  return `
    <details class="ig-fold">
      <summary><span class="hx-head-text"><span class="hx-title">Perkembangan per tahun</span><span class="hx-sub">${years.length} tahun</span></span>${insIcon('chevron-down')}</summary>
      <div class="insight-yoy ig-yoy">${rows}</div>${archivedNote}
    </details>`;
}

</script>
