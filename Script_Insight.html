<script>
/* ============================================================
   FINANCIAL INSIGHT — Frontend JavaScript
   Layout, most useful first: score + KPIs, what needs attention,
   this month vs last (with projection), budget pace, top spending,
   cash flow trend, investment, then folded extras. Icons are Lucide
   placeholders swapped in by lucide.createIcons() after render.
   ============================================================ */

let INSIGHT_DATA = null;
let INSIGHT_LOADED = false;

function loadFinancialInsight() {
  if (!window.supabaseConnected) {
    const container = document.getElementById('insightContent');
    if (container) container.innerHTML = '<div class="insight-error"><p>Database is not connected. Configure connection in Settings.</p></div>';
    return;
  }
  if (INSIGHT_LOADED && INSIGHT_DATA) {
    renderFinancialInsight(INSIGHT_DATA);
    return;
  }

  const container = document.getElementById('insightContent');
  container.innerHTML = '<div class="insight-loading"><div class="mm-spinner"></div><p>Menganalisis keuangan…</p></div>';

  google.script.run
    .withSuccessHandler(data => {
      INSIGHT_DATA = data;
      INSIGHT_LOADED = true;
      renderFinancialInsight(data);
    })
    .withFailureHandler(err => {
      container.innerHTML = `<div class="insight-error"><p>Gagal memuat data insight.</p><button class="btn-primary" onclick="loadFinancialInsight()">Coba lagi</button></div>`;
    })
    .mmGetFinancialInsight();
}

function refreshInsight() {
  INSIGHT_LOADED = false;
  INSIGHT_DATA = null;
  loadFinancialInsight();
}

// Formatting helpers — both honour the hide-amounts toggle.
function insightIDR(value) { return mmFormatIDR(value); }
function insightShort(value) { return mmFormatIDRShort(value); }
function insIcon(name) { return `<i data-lucide="${name}" aria-hidden="true"></i>`; }
function insEsc(v) { return escapeHtml(String(v == null ? '' : v)); }

function insightSection(title, sub, body, extraClass) {
  return `
    <section class="ins-section ${extraClass || ''}">
      <div class="ins-section-head">
        <h3>${title}</h3>
        ${sub ? `<p>${sub}</p>` : ''}
      </div>
      ${body}
    </section>`;
}

function renderFinancialInsight(data) {
  const container = document.getElementById('insightContent');
  const monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const now = new Date();

  let html = `
    <header class="ins-page-head">
      <div>
        <h2 class="page-title">Insight</h2>
        <p class="ins-page-sub">${monthNames[now.getMonth()]} ${now.getFullYear()} · hari ke-${data.dayOfMonth} dari ${data.daysInMonth}</p>
      </div>
      <button class="ins-refresh" onclick="refreshInsight()" aria-label="Muat ulang analisis">${insIcon('refresh-cw')}</button>
    </header>`;

  html += renderInsightHero(data);
  html += renderAttention(data);
  html += renderMonthCompare(data);
  html += renderBudgetPace(data);
  html += renderSpendingAnalysis(data);
  html += renderCashFlowAnalysis(data);
  if (data.investmentData) html += renderInvestmentInsight(data);
  html += renderYearlyProgress(data);

  container.innerHTML = html;
  if (window.lucide) lucide.createIcons();
}

/* === SCORE === */
function computeHealth(data) {
  let score = 50;
  const reasons = [];
  const add = (points, text, good) => { score += points; reasons.push({ text, good }); };

  if (data.savingRate >= 30) add(25, 'Saving rate sangat baik (≥30%)', true);
  else if (data.savingRate >= 20) add(18, 'Saving rate baik (≥20%)', true);
  else if (data.savingRate >= 10) add(10, 'Saving rate cukup (≥10%)', true);
  else if (data.savingRate > 0) add(5, 'Saving rate masih rendah (<10%)', false);
  else add(-10, 'Pengeluaran melebihi pemasukan', false);

  const overBudget = data.budgetAnalysis.filter(b => b.progress > 1 && !b.isSaving);
  const investOver = data.budgetAnalysis.filter(b => b.progress > 1 && b.isSaving);
  if (overBudget.length === 0 && data.budgetAnalysis.length > 0) add(15, 'Semua budget terkendali', true);
  else if (overBudget.length <= 1) add(8, `${overBudget.length} budget terlampaui`, false);
  else add(-5, `${overBudget.length} budget terlampaui`, false);
  if (investOver.length > 0) add(5, 'Investasi melebihi target', true);

  const history = data.monthlyHistory;
  if (history.length >= 2) {
    const positive = history.slice(-3).filter(h => h.saving > 0).length;
    if (positive === 3) add(10, 'Cash flow positif 3 bulan berturut-turut', true);
    else if (positive >= 2) add(5, 'Cash flow umumnya positif', true);
  }

  if (data.investmentData) {
    if (data.investmentData.returnPercent > 0) add(5, 'Investasi menghasilkan profit', true);
    if (data.investmentData.portfolio.length >= 3) add(5, 'Portofolio terdiversifikasi', true);
  }

  score = Math.max(0, Math.min(100, score));
  let status, tone;
  if (score >= 80) { status = 'Sangat baik'; tone = 'good'; }
  else if (score >= 60) { status = 'Baik'; tone = 'ok'; }
  else if (score >= 40) { status = 'Cukup'; tone = 'warn'; }
  else { status = 'Perlu perhatian'; tone = 'bad'; }
  return { score, status, tone, reasons };
}

function renderInsightHero(data) {
  const h = computeHealth(data);
  const r = 26;
  const circumference = 2 * Math.PI * r;
  const offset = circumference - (h.score / 100) * circumference;

  const rateDelta = data.prevSavingRate ? data.savingRate - data.prevSavingRate : null;
  const rateSub = rateDelta === null ? 'target ≥20%'
    : `${rateDelta >= 0 ? '↑' : '↓'} ${Math.abs(rateDelta).toFixed(1)} poin`;
  const pred = data.prediction || {};
  const hasPred = data.dayOfMonth >= 5 && pred.saving !== undefined;

  const expenseShare = data.totalIncome > 0 ? Math.round(data.totalExpense / data.totalIncome * 100) : null;
  const line = expenseShare === null
    ? 'Belum ada pemasukan tercatat bulan ini.'
    : `Pengeluaran ${expenseShare}% dari pemasukan bulan ini.`;

  return `
    <section class="ins-hero">
      <div class="ins-hero-top">
        <div class="ins-ring tone-${h.tone}" role="img" aria-label="Skor kesehatan ${h.score} dari 100">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="${r}" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="6"/>
            <circle class="ins-ring-arc" cx="32" cy="32" r="${r}" fill="none" stroke-width="6"
              stroke-dasharray="${circumference.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"
              stroke-linecap="round" transform="rotate(-90 32 32)"/>
          </svg>
          <strong>${h.score}</strong>
        </div>
        <div class="ins-hero-text">
          <span class="ins-label">Skor kesehatan</span>
          <span class="ins-status tone-${h.tone}">${h.status}</span>
          <p>${line}</p>
        </div>
      </div>

      <div class="ins-kpis">
        <div class="ins-kpi">
          <span>Saving rate</span>
          <strong class="${data.savingRate >= 20 ? 'pos' : data.savingRate < 0 ? 'neg' : 'warn'}">${data.savingRate.toFixed(1)}%</strong>
          <small class="${rateDelta === null ? '' : rateDelta >= 0 ? 'pos' : 'neg'}">${rateSub}</small>
        </div>
        <div class="ins-kpi">
          <span>Sisa bulan ini</span>
          <strong class="${data.saving >= 0 ? 'pos' : 'neg'}">${insightShort(data.saving)}</strong>
          <small>masuk − keluar</small>
        </div>
        <div class="ins-kpi">
          <span>Proyeksi sisa</span>
          <strong class="${!hasPred ? '' : pred.saving >= 0 ? 'pos' : 'neg'}">${hasPred ? insightShort(pred.saving) : '—'}</strong>
          <small>${hasPred ? 'akhir bulan' : 'min. hari ke-5'}</small>
        </div>
      </div>

      <details class="ins-why">
        <summary>Kenapa skor ${h.score}? ${insIcon('chevron-down')}</summary>
        <ul>
          ${h.reasons.map(x => `<li class="${x.good ? 'good' : 'bad'}">${insIcon(x.good ? 'check' : 'x')}${insEsc(x.text)}</li>`).join('')}
        </ul>
      </details>
    </section>`;
}

/* === WHAT NEEDS ATTENTION ===
   Key insights and recommendations used to be two cards saying the same
   things. One list now, most urgent first; good news becomes chips. */
function renderAttention(data) {
  const items = [];   // { rank, tone, icon, title, detail }
  const good = [];    // { icon, text }
  const daysLeft = Math.max(data.daysInMonth - data.dayOfMonth, 0);
  const timePct = data.dayOfMonth / data.daysInMonth;

  if (data.saving < 0) {
    items.push({ rank: 0, tone: 'bad', icon: 'trending-down', title: 'Pengeluaran melebihi pemasukan',
      detail: `Defisit ${insightIDR(-data.saving)} bulan ini.` });
  }

  data.budgetAnalysis.forEach(b => {
    if (!(b.target > 0)) return;
    const cat = insEsc(b.category);
    if (b.isSaving) {
      if (b.progress >= 1) good.push({ icon: 'piggy-bank', text: `${cat} melebihi target` });
      else if (b.progress < 0.5) {
        items.push({ rank: 3, tone: 'info', icon: 'piggy-bank', title: `${cat} baru ${(b.progress * 100).toFixed(0)}% dari target`,
          detail: `Kurang ${insightIDR(b.target - b.spent)} · ${daysLeft} hari lagi.` });
      }
      return;
    }
    if (b.progress >= 1) {
      items.push({ rank: 0, tone: 'bad', icon: 'octagon-alert', title: `Budget ${cat} terlampaui`,
        detail: `Lebih ${insightIDR(b.spent - b.target)}. Tahan pengeluaran ${cat} sampai akhir bulan.` });
    } else if (b.progress >= 0.9) {
      items.push({ rank: 1, tone: 'warn', icon: 'triangle-alert', title: `Budget ${cat} hampir habis`,
        detail: `Sisa ${insightIDR(b.target - b.spent)} ≈ ${insightIDR((b.target - b.spent) / Math.max(daysLeft, 1))}/hari untuk ${daysLeft} hari.` });
    } else if (b.progress > timePct + 0.15 && data.dayOfMonth >= 5) {
      items.push({ rank: 2, tone: 'warn', icon: 'gauge', title: `${cat} lebih cepat dari jadwal`,
        detail: `Terpakai ${(b.progress * 100).toFixed(0)}% di hari ke-${data.dayOfMonth} (idealnya ≤${(timePct * 100).toFixed(0)}%).` });
    }

    if (b.prevSpent > 0 && b.spent > 0) {
      const change = (b.spent - b.prevSpent) / b.prevSpent * 100;
      if (change >= 15 && b.progress < 0.9) {
        items.push({ rank: 2, tone: 'warn', icon: 'arrow-up-right', title: `Pengeluaran ${cat} naik ${change.toFixed(0)}%`,
          detail: `${insightIDR(b.spent)} vs ${insightIDR(b.prevSpent)} bulan lalu.` });
      } else if (change <= -15) {
        good.push({ icon: 'arrow-down-right', text: `${cat} turun ${Math.abs(change).toFixed(0)}%` });
      }
    }
  });

  if (data.savingRate >= 0 && data.savingRate < 20 && data.totalIncome > 0) {
    const needed = data.totalIncome * 0.2 - data.saving;
    if (needed > 0) items.push({ rank: 2, tone: 'warn', icon: 'percent', title: `Saving rate ${data.savingRate.toFixed(1)}% — di bawah 20%`,
      detail: `Kurangi pengeluaran ${insightIDR(needed)} untuk mencapai 20%.` });
  }

  const avgExpense = data.monthlyHistory.length
    ? data.monthlyHistory.reduce((s, h) => s + h.expense, 0) / data.monthlyHistory.length : 0;
  if (avgExpense > 0 && data.netWorth < avgExpense * 3) {
    items.push({ rank: 3, tone: 'info', icon: 'shield', title: 'Dana darurat belum cukup',
      detail: `Target minimal ${insightIDR(avgExpense * 3)} (3× rata-rata pengeluaran).` });
  }

  const inv = data.investmentData;
  if (inv) {
    if (inv.rebalanceSuggestions && inv.rebalanceSuggestions.length) {
      const top = inv.rebalanceSuggestions[0];
      items.push({ rank: 3, tone: 'info', icon: 'scale', title: `Tambah sektor ${insEsc(top.sector)}`,
        detail: `${insightIDR(top.suggestedAmountIDR)} untuk mendekati target alokasi.` });
    }
    if (inv.portfolio.length > 0 && inv.portfolio.length <= 2) {
      items.push({ rank: 3, tone: 'info', icon: 'shuffle', title: 'Portofolio terlalu terkonsentrasi',
        detail: `Baru ${inv.portfolio.length} aset — pertimbangkan diversifikasi.` });
    }
    if (inv.profitLoss > 0) good.push({ icon: 'trending-up', text: `Investasi +${inv.returnPercent.toFixed(1)}%` });
  }

  if (data.prevSavingRate > 0 && data.savingRate > data.prevSavingRate) good.push({ icon: 'trending-up', text: 'Saving rate naik' });
  if (data.saving > 0) good.push({ icon: 'circle-check', text: 'Cash flow positif' });
  if (data.savingRate >= 20) good.push({ icon: 'target', text: `Saving rate ${data.savingRate.toFixed(0)}%` });
  if (data.isNetWorthHighest && data.netWorth > 0) good.push({ icon: 'trophy', text: 'Net worth tertinggi' });
  if (data.streak >= 7) good.push({ icon: 'flame', text: `${data.streak} hari mencatat` });
  if (data.budgetMetMonths >= 3) good.push({ icon: 'shield-check', text: `${data.budgetMetMonths} bulan cash flow positif` });

  items.sort((a, b) => a.rank - b.rank);
  const row = i => `
    <li class="ins-item tone-${i.tone}">
      <span class="ins-item-icon">${insIcon(i.icon)}</span>
      <span class="ins-item-body"><strong>${i.title}</strong><span>${i.detail}</span></span>
    </li>`;

  const shown = items.slice(0, 4);
  const rest = items.slice(4);
  const list = items.length
    ? `<ul class="ins-list">${shown.map(row).join('')}</ul>
       ${rest.length ? `<details class="ins-more"><summary>${rest.length} lainnya ${insIcon('chevron-down')}</summary><ul class="ins-list">${rest.map(row).join('')}</ul></details>` : ''}`
    : `<div class="ins-allgood">${insIcon('circle-check')}<span>Tidak ada yang perlu dikhawatirkan bulan ini.</span></div>`;

  const chips = good.length
    ? `<div class="ins-chips" aria-label="Kabar baik">${good.map(g => `<span class="ins-chip">${insIcon(g.icon)}${g.text}</span>`).join('')}</div>`
    : '';

  const sub = items.length ? `${items.length} hal, paling mendesak di atas` : '';
  return insightSection('Perlu perhatian', sub, `<div class="ins-card">${list}${chips}</div>`);
}

/* === THIS MONTH VS LAST, WITH PROJECTION === */
function renderMonthCompare(data) {
  const hasPred = data.dayOfMonth >= 5 && data.prediction;
  const pred = data.prediction || {};
  const delta = (cur, prev, upIsGood) => {
    if (!prev) return '<span class="ins-delta">—</span>';
    const pct = (cur - prev) / Math.abs(prev) * 100;
    if (!isFinite(pct)) return '<span class="ins-delta">—</span>';
    const good = upIsGood ? pct >= 0 : pct <= 0;
    return `<span class="ins-delta ${good ? 'pos' : 'neg'}">${pct >= 0 ? '↑' : '↓'}${Math.abs(pct).toFixed(0)}%</span>`;
  };
  const rows = [
    { label: 'Pemasukan', now: insightShort(data.totalIncome), d: delta(data.totalIncome, data.prevIncome, true), p: hasPred ? insightShort(pred.income) : '—' },
    { label: 'Pengeluaran', now: insightShort(data.totalExpense), d: delta(data.totalExpense, data.prevExpense, false), p: hasPred ? insightShort(pred.expense) : '—' },
    { label: 'Sisa', now: insightShort(data.saving), d: delta(data.saving, data.prevSaving, true), p: hasPred ? insightShort(pred.saving) : '—', cls: data.saving >= 0 ? 'pos' : 'neg' },
    { label: 'Net worth', now: insightShort(data.netWorth), d: '<span class="ins-delta">—</span>', p: hasPred ? insightShort(pred.netWorth) : '—' }
  ];
  const body = `
    <div class="ins-card ins-table" role="table" aria-label="Bulan ini dibanding bulan lalu">
      <div class="ins-tr ins-th" role="row">
        <span role="columnheader"></span><span role="columnheader">Sekarang</span><span role="columnheader">vs lalu</span><span role="columnheader">Proyeksi</span>
      </div>
      ${rows.map(r => `
        <div class="ins-tr" role="row">
          <span role="rowheader">${r.label}</span>
          <strong role="cell" class="${r.cls || ''}">${r.now}</strong>
          <span role="cell">${r.d}</span>
          <span role="cell" class="ins-proj">${r.p}</span>
        </div>`).join('')}
    </div>`;
  const sub = hasPred ? `Proyeksi dari rata-rata ${data.dayOfMonth} hari berjalan` : 'Proyeksi muncul mulai hari ke-5';
  return insightSection('Bulan ini', sub, body);
}

/* === BUDGET PACE ===
   The dashboard shows how much is used; this shows whether that is ahead
   of the calendar — the marker is where spending "should" be today. */
function renderBudgetPace(data) {
  const items = data.budgetAnalysis.filter(b => b.target > 0);
  if (!items.length) return '';
  const timePct = Math.min(data.dayOfMonth / data.daysInMonth, 1) * 100;
  const daysLeft = Math.max(data.daysInMonth - data.dayOfMonth, 0);

  const rows = items.map(b => {
    const pct = b.progress * 100;
    let state = 'ok';
    if (b.isSaving) state = b.progress >= 1 ? 'done' : 'saving';
    else if (b.progress >= 1) state = 'over';
    else if (b.progress >= 0.9 || pct > timePct + 15) state = 'warn';
    const left = b.target - b.spent;
    const foot = b.isSaving
      ? (left > 0 ? `kurang ${insightShort(left)}` : `lebih ${insightShort(-left)}`)
      : (left >= 0 ? `${insightShort(left / Math.max(daysLeft, 1))}/hari` : `lebih ${insightShort(-left)}`);
    return `
      <div class="ins-pace is-${state}">
        <div class="ins-pace-top">
          <span>${insEsc(b.category)}${b.isSaving ? ' <em>tabungan</em>' : ''}</span>
          <strong>${pct.toFixed(0)}%</strong>
        </div>
        <div class="ins-pace-bar">
          <span class="ins-pace-fill" style="width:${Math.min(pct, 100)}%"></span>
          ${b.isSaving ? '' : `<span class="ins-pace-mark" style="left:${timePct}%" aria-hidden="true"></span>`}
        </div>
        <div class="ins-pace-foot"><span>${insightShort(b.spent)} / ${insightShort(b.target).replace('Rp ', '')}${!b.isSaving && left > 0 ? ' · sisa ' + insightShort(left).replace('Rp ', '') : ''}</span><span class="ins-pace-note">${foot}</span></div>
      </div>`;
  }).join('');

  return insightSection('Laju budget', `Garis putih = batas ideal hari ini (${timePct.toFixed(0)}%)`, `<div class="ins-card">${rows}</div>`);
}

/* === TOP SPENDING === */
function renderSpendingAnalysis(data) {
  if (!data.spendingByCategory.length) return '';
  const top = data.spendingByCategory.slice(0, 5);
  const colors = ['#22d3ee', '#fbbf24', '#f472b6', '#818cf8', '#fb923c'];
  const max = top[0] ? top[0].amount : 1;
  const note = top[0] && top[0].percent > 40
    ? `<p class="ins-note">${insIcon('info')}${insEsc(top[0].category)} mengambil ${top[0].percent.toFixed(0)}% pengeluaran.</p>` : '';

  const rows = top.map((c, i) => `
    <div class="ins-bar-row">
      <span class="ins-bar-name"><i class="ins-dot" style="background:${colors[i]}"></i>${insEsc(c.category)}</span>
      <span class="ins-bar-track"><span style="width:${(c.amount / max * 100).toFixed(0)}%;background:${colors[i]}"></span></span>
      <span class="ins-bar-val"><strong>${insightShort(c.amount)}</strong><small>${c.percent.toFixed(0)}%</small></span>
    </div>`).join('');
  return insightSection('Pengeluaran terbesar', 'Bulan ini, per kategori', `<div class="ins-card">${rows}${note}</div>`);
}

/* === CASH FLOW TREND === */
function renderCashFlowAnalysis(data) {
  const history = data.monthlyHistory;
  if (history.length < 2) return '';
  const max = Math.max(...history.map(h => Math.max(h.income, h.expense)), 1);
  const avgSaving = history.reduce((s, h) => s + h.saving, 0) / history.length;
  const positive = history.filter(h => h.saving > 0).length;

  const cols = history.map(h => `
    <div class="ins-cf-col" title="${insEsc(h.label)} · masuk ${insightIDR(h.income)} · keluar ${insightIDR(h.expense)}">
      <div class="ins-cf-bars">
        <span class="in" style="height:${(h.income / max * 100).toFixed(0)}%"></span>
        <span class="out" style="height:${(h.expense / max * 100).toFixed(0)}%"></span>
      </div>
      <span class="ins-cf-net ${h.saving >= 0 ? 'pos' : 'neg'}">${h.saving >= 0 ? '+' : '−'}${insightShort(Math.abs(h.saving)).replace('Rp ', '')}</span>
      <span class="ins-cf-label">${insEsc(h.label)}</span>
    </div>`).join('');

  const body = `
    <div class="ins-card">
      <div class="ins-cf">${cols}</div>
      <div class="ins-legend">
        <span><i class="ins-sw in"></i>Masuk</span>
        <span><i class="ins-sw out"></i>Keluar</span>
        <span>Angka = sisa</span>
      </div>
    </div>`;
  return insightSection('Cash flow', `${positive} dari ${history.length} bulan positif · rata-rata sisa ${insightShort(avgSaving)}`, body);
}

/* === INVESTMENT === */
function renderInvestmentInsight(data) {
  const inv = data.investmentData;
  if (!inv) return '';
  const portfolio = inv.portfolio || [];
  const best = portfolio.length ? portfolio.reduce((a, b) => a.GrowthPercent > b.GrowthPercent ? a : b) : null;
  const worst = portfolio.length ? portfolio.reduce((a, b) => a.GrowthPercent < b.GrowthPercent ? a : b) : null;
  const pl = inv.profitLoss >= 0;

  const perf = best ? `
    <div class="ins-perf">
      <span>${insIcon('arrow-up-right')}Terbaik <strong>${insEsc(best.Asset)}</strong><em class="pos">+${(best.GrowthPercent * 100).toFixed(1)}%</em></span>
      ${worst && worst.Asset !== best.Asset ? `<span>${insIcon('arrow-down-right')}Terlemah <strong>${insEsc(worst.Asset)}</strong><em class="${worst.GrowthPercent >= 0 ? 'pos' : 'neg'}">${(worst.GrowthPercent * 100).toFixed(1)}%</em></span>` : ''}
    </div>` : '';

  const rebalance = inv.rebalanceSuggestions && inv.rebalanceSuggestions.length ? `
    <div class="ins-rebal">
      <span class="ins-label">Saran top-up</span>
      ${inv.rebalanceSuggestions.slice(0, 3).map(r => `<div><span>${insEsc(r.sector)}</span><strong>+${insightShort(r.suggestedAmountIDR)}</strong></div>`).join('')}
    </div>` : '';

  const body = `
    <div class="ins-card">
      <div class="ins-kpis ins-kpis-flat">
        <div class="ins-kpi"><span>Nilai</span><strong>${insightShort(inv.totalValue)}</strong></div>
        <div class="ins-kpi"><span>Profit/Loss</span><strong class="${pl ? 'pos' : 'neg'}">${pl ? '+' : ''}${insightShort(inv.profitLoss)}</strong></div>
        <div class="ins-kpi"><span>Return</span><strong class="${inv.returnPercent >= 0 ? 'pos' : 'neg'}">${inv.returnPercent >= 0 ? '+' : ''}${inv.returnPercent.toFixed(1)}%</strong></div>
      </div>
      ${perf}${rebalance}
    </div>`;
  return insightSection('Investasi', `${portfolio.length} aset`, body);
}

/* === YEAR OVER YEAR (folded) ===
   Reads mmGetYearlySummary, which merges live transactions with archived
   years held in mm_summary. Years differ in length (2025 only starts in
   July), so growth is compared per month, not on raw totals. */
function renderYearlyProgress(data) {
  const years = data.yearlySummary || [];
  if (years.length < 1) return '';

  const maxFlow = Math.max(...years.map(y => Math.max(y.income, y.expense)), 1);
  const growth = (value, invert) => {
    if (value === null || !isFinite(value)) return '<span class="insight-yoy-growth muted">—</span>';
    const good = invert ? value < 0 : value > 0;
    return `<span class="insight-yoy-growth ${good ? 'pos' : 'neg'}">${value >= 0 ? '↑' : '↓'} ${Math.abs(value).toFixed(0)}%</span>`;
  };

  const rows = years.slice().reverse().map(y => {
    const topCats = (y.categories || []).slice(0, 3)
      .map(c => `<span class="insight-yoy-cat">${insEsc(c.category)} ${c.percent.toFixed(0)}%</span>`).join('');
    return `
      <div class="insight-yoy-row">
        <div class="insight-yoy-head">
          <strong class="insight-yoy-year">${y.year}</strong>
          <span class="insight-yoy-meta">${y.monthCount} bulan${y.archived ? ' · ringkasan' : ''}</span>
        </div>
        <div class="insight-yoy-bars">
          <div class="insight-yoy-bar-line">
            <span class="insight-yoy-bar-label">Masuk</span>
            <div class="insight-yoy-track"><div class="insight-yoy-fill income" style="width:${(y.income / maxFlow * 100).toFixed(1)}%"></div></div>
            <span class="insight-yoy-amt">${insightShort(y.income)}</span>
            ${growth(y.incomeGrowth, false)}
          </div>
          <div class="insight-yoy-bar-line">
            <span class="insight-yoy-bar-label">Keluar</span>
            <div class="insight-yoy-track"><div class="insight-yoy-fill expense" style="width:${(y.expense / maxFlow * 100).toFixed(1)}%"></div></div>
            <span class="insight-yoy-amt">${insightShort(y.expense)}</span>
            ${growth(y.expenseGrowth, true)}
          </div>
        </div>
        <div class="insight-yoy-foot">
          <span>Sisa <strong class="${y.saving >= 0 ? 'pos' : 'neg'}">${insightShort(y.saving)}</strong></span>
          <span>Rasio nabung <strong class="${y.savingRate >= 20 ? 'pos' : 'warn'}">${y.savingRate.toFixed(0)}%</strong></span>
          <span class="insight-yoy-avg">Rata-rata/bln ${insightShort(y.avgMonthlyExpense)}</span>
        </div>
        ${topCats ? `<div class="insight-yoy-cats">${topCats}</div>` : ''}
      </div>`;
  }).join('');

  const archivedNote = years.some(y => y.archived)
    ? '<p class="insight-yoy-note">Tahun bertanda “ringkasan” hanya menyimpan total per kategori — detail transaksinya sudah diarsipkan.</p>'
    : '';

  return `
    <details class="ins-section ins-fold">
      <summary><span><strong>Perkembangan per tahun</strong><small>${years.length} tahun</small></span>${insIcon('chevron-down')}</summary>
      <div class="ins-card"><div class="insight-yoy">${rows}</div>${archivedNote}</div>
    </details>`;
}

</script>
