  align-items: center;
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

.mm-detail-sub-header span {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.mm-detail-sub-header strong {
  font-size: 13px;
  font-weight: 700;
  color: var(--error);
  font-variant-numeric: tabular-nums;
}

.mm-detail-tx-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0;
}

.mm-detail-tx-row span {
  font-size: 12px;
  color: var(--text-muted);
}

.mm-detail-tx-row strong {
  font-size: 12px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* === MM Allocation Editor Grid (5 columns) === */
#mmAllocationRows .allocation-target-row {
  grid-template-columns: 50px 1fr 70px 40px 40px;
  gap: 6px;
}

@media (max-width: 480px) {
  #mmAllocationRows .allocation-target-row {
    grid-template-columns: 50px 1fr 70px 40px 40px;
  }
}

/* --- MM All Time Chart & Table --- */
.mm-history-chart-wrap {
  margin-bottom: 14px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border);
  padding: 8px 4px 0;
  overflow: hidden;
}

.mm-line-chart-wrap {
  margin-bottom: 14px;
  padding: 10px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border);
}

.mm-line-chart {
  width: 100%;
  height: 120px;
}

.mm-chart-legend-mini {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 8px;
  font-size: 11px;
  font-weight: 600;
}

.mm-alltime-table {
  display: grid;
  gap: 0;
}

.mm-alltime-header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.mm-alltime-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
}

.mm-alltime-row:last-child { border-bottom: none; }

.mm-alltime-row span {
  font-variant-numeric: tabular-nums;
}

/* ============================================================
   FINANCIAL INSIGHT — Styles
   ============================================================ */

.insight-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  gap: 12px;
  color: var(--text-muted);
}

.insight-error {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
}

.insight-error .btn-primary { margin-top: 12px; }

/* Insight Cards */
.insight-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  animation: fadeInUp 0.4s ease both;
  border: 1px solid var(--border);
}

.insight-card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

/* Held an emoji, now holds a Lucide SVG — give it a tinted tile so the
   section marker still reads at a glance without the colour of an emoji. */
.insight-card-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: rgba(var(--accent-rgb),0.10);
  color: var(--accent);
  flex-shrink: 0;
}

.insight-card-icon svg { width: 17px; height: 17px; }

.insight-card-title {
  font-size: 16px;
  font-weight: 700;
  margin: 0;
  color: var(--text);
}

/* Health Score */
.insight-health-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 28px 20px;
  background: linear-gradient(135deg, rgba(var(--accent-rgb),0.05), rgba(6,182,212,0.05));
}

.insight-health-visual {
  position: relative;
  width: 140px;
  height: 140px;
}

.health-ring { width: 100%; height: 100%; }

.health-score-center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.health-score-num {
  font-size: 36px;
  font-weight: 800;
  color: var(--text);
  display: block;
  line-height: 1;
}

.health-score-label {
  font-size: 12px;
  color: var(--text-muted);
}

.insight-health-info {
  text-align: center;
  width: 100%;
}

.health-status-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 12px;
}

.health-reasons {
  list-style: none;
  padding: 0;
  margin: 0;
}

.health-reasons li {
  font-size: 12px;
  color: var(--text-muted);
  padding: 3px 0;
}

/* Monthly Summary Grid */
.insight-summary-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.insight-summary-item {
  background: rgba(255,255,255,0.03);
  border-radius: var(--radius-sm);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.insight-summary-item:last-child:nth-child(odd) {
  grid-column: 1 / -1;
}

.insight-summary-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.insight-summary-value {
  font-size: 16px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.insight-change {
  font-size: 11px;
  font-weight: 600;
}

/* Year over year */
.insight-yoy {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.insight-yoy-row {
  background: rgba(255,255,255,0.03);
  border-radius: var(--radius-sm);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.insight-yoy-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}

.insight-yoy-year { font-size: 18px; font-weight: 700; }

.insight-yoy-meta {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.insight-yoy-bars { display: flex; flex-direction: column; gap: 6px; }

.insight-yoy-bar-line {
  display: grid;
  grid-template-columns: 44px 1fr auto auto;
  align-items: center;
  gap: 8px;
}

.insight-yoy-bar-label { font-size: 11px; color: var(--text-muted); }

.insight-yoy-track {
  height: 8px;
  border-radius: 99px;
  background: rgba(255,255,255,0.06);
  overflow: hidden;
}

.insight-yoy-fill { height: 100%; border-radius: 99px; }
.insight-yoy-fill.income  { background: var(--success); }
.insight-yoy-fill.expense { background: var(--error); }

.insight-yoy-amt {
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.insight-yoy-growth { font-size: 11px; font-weight: 600; min-width: 42px; text-align: right; }
.insight-yoy-growth.muted { color: var(--text-muted); }

.insight-yoy-foot {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  font-size: 12px;
  color: var(--text-muted);
}

.insight-yoy-avg { margin-left: auto; }

.insight-yoy-cats { display: flex; flex-wrap: wrap; gap: 6px; }

.insight-yoy-cat {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 99px;
  background: rgba(255,255,255,0.05);
  color: var(--text-muted);
}

.insight-yoy-note {
  margin-top: 10px;
  font-size: 11px;
  line-height: 1.5;
  color: var(--text-muted);
}

@media (max-width: 480px) {
  .insight-yoy-bar-line { grid-template-columns: 40px 1fr auto; }
  .insight-yoy-growth { grid-column: 3; text-align: right; }
  .insight-yoy-avg { margin-left: 0; }
}

/* Key Insights */
.insight-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.insight-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.02);
}

.insight-item-positive { border-left: 3px solid var(--success); }
.insight-item-warning { border-left: 3px solid var(--warning); }
.insight-item-negative { border-left: 3px solid var(--error); }

.insight-item-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.insight-item-text { font-size: 13px; color: var(--text); line-height: 1.5; }

/* Budget Analysis */
.insight-budget-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.insight-budget-item { margin-bottom: 2px; }

.insight-budget-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  font-size: 13px;
  font-weight: 600;
}

.insight-budget-bar {
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,0.06);
  border-radius: 4px;
  overflow: hidden;
}

.insight-budget-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.6s ease;
}

.insight-budget-meta {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

.insight-conclusion {
  font-size: 13px;
  color: var(--text-muted);
  margin: 14px 0 0;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  line-height: 1.5;
}

/* Spending Analysis */
.insight-spending-chart {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.insight-spending-row {
  display: grid;
  grid-template-columns: 100px 1fr auto;
  align-items: center;
  gap: 10px;
}

.insight-spending-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text);
}

.insight-spending-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.insight-spending-bar-wrap {
  height: 8px;
  background: rgba(255,255,255,0.06);
  border-radius: 4px;
  overflow: hidden;
}

.insight-spending-bar {
  height: 100%;
  border-radius: 4px;
  transition: width 0.6s ease;
}

.insight-spending-values {
  text-align: right;
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  min-width: 70px;
}

.insight-spending-values span {
  font-weight: 600;
  color: var(--text);
  font-size: 12px;
}

/* Investment Insight */
.insight-invest-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.insight-invest-item {
  background: rgba(255,255,255,0.03);
  border-radius: var(--radius-sm);
  padding: 12px;
  text-align: center;
}

.insight-invest-item span {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  display: block;
  margin-bottom: 4px;
}

.insight-invest-item strong {
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.insight-perf-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 14px;
}

.insight-perf-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: rgba(255,255,255,0.02);
  border-radius: var(--radius-sm);
}

.perf-label {
  font-size: 12px;
  color: var(--text-muted);
  min-width: 60px;
}

.perf-asset {
  flex: 1;
  font-size: 13px;
  font-weight: 600;
}

.perf-return {
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.insight-subtitle {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin: 0 0 10px;
}

.insight-rebalance {
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.insight-rebalance-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  font-size: 13px;
}

.insight-rebalance-amount {
  color: var(--success);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* Cash Flow Chart */
.insight-cashflow-chart {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  height: 140px;
  padding: 10px 0;
}

.insight-cf-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
}

.insight-cf-bars {
  flex: 1;
  display: flex;
  gap: 3px;
  align-items: flex-end;
  width: 100%;
}

.insight-cf-bar {
  flex: 1;
  border-radius: 3px 3px 0 0;
  min-height: 4px;
  transition: height 0.6s ease;
}

.insight-cf-bar.income { background: var(--success); }
.insight-cf-bar.expense { background: var(--error); opacity: 0.7; }

.insight-cf-label {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 6px;
  text-align: center;
}

.insight-cf-legend {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 8px;
  font-size: 11px;
  color: var(--text-muted);
}

.insight-cf-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 4px;
}

.insight-cf-dot.income { background: var(--success); }
.insight-cf-dot.expense { background: var(--error); opacity: 0.7; }

/* Prediction */
.insight-subtitle-desc {
  font-size: 12px;
  color: var(--text-muted);
  margin: 0 0 14px;
}

.insight-prediction-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.insight-pred-item {
  background: rgba(255,255,255,0.03);
  border-radius: var(--radius-sm);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.insight-pred-item span {
  font-size: 11px;
  color: var(--text-muted);
}

.insight-pred-item strong {
  font-size: 15px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.insight-note {
  font-size: 11px;
  color: var(--text-muted);
  margin: 12px 0 0;
  font-style: italic;
}

/* Recommendations */
.insight-recommendations-card {
  background: linear-gradient(135deg, rgba(var(--accent-rgb),0.04), rgba(6,182,212,0.04));
  border: 1px solid rgba(var(--accent-rgb),0.15);
}

.insight-rec-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.insight-rec-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px;
  background: rgba(255,255,255,0.03);
  border-radius: var(--radius-sm);
}

.insight-rec-icon {
  font-size: 18px;
  flex-shrink: 0;
  margin-top: 1px;
}

.insight-rec-text {
  font-size: 13px;
  line-height: 1.6;
  color: var(--text);
  margin: 0;
}

/* Achievements */
.insight-achievements {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.insight-achievement-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  background: rgba(255,255,255,0.03);
  border-radius: var(--radius-sm);
  border: 1px solid rgba(255,255,255,0.04);
}

.achievement-icon {
  font-size: 28px;
  flex-shrink: 0;
}

.achievement-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.achievement-info strong {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}

.achievement-info span {
  font-size: 12px;
  color: var(--text-muted);
}

/* Responsive */
@media (max-width: 380px) {
  .insight-invest-grid {
    grid-template-columns: 1fr;
  }
  .insight-spending-row {
    grid-template-columns: 80px 1fr auto;
  }
}

/* Eye Toggle — global hidden amount */
.amount-hidden {
  font-family: inherit;
  letter-spacing: 2px;
  opacity: 0.4;
}

/* Settings descriptions */
.settings-desc {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.6;
  margin: 0 0 14px;
}

/* Import section */
.import-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.export-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.import-label {
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  text-align: center;
}

.import-status {
  margin-top: 12px;
  padding: 12px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
}

.import-status.success {
  background: rgba(var(--success-rgb),0.1);
  color: var(--success);
  border: 1px solid rgba(var(--success-rgb),0.25);
}

.import-status.error {
  background: rgba(var(--error-rgb),0.1);
  color: var(--error);
  border: 1px solid rgba(var(--error-rgb),0.2);
}

/* Danger Zone */
.danger-zone-card {
  border-color: rgba(var(--error-rgb),0.15);
  background: rgba(var(--error-rgb),0.02);
}

.danger-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.btn-danger {
  border: 1px solid rgba(var(--error-rgb),0.25);
  border-radius: 99px;
  padding: 12px 20px;
  background: rgba(var(--error-rgb),0.06);
  color: var(--error);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
  min-height: 44px;
}

.btn-danger:hover {
  background: rgba(var(--error-rgb),0.12);
  border-color: rgba(var(--error-rgb),0.4);
}

.btn-danger-critical {
  border: 1px solid rgba(var(--error-rgb),0.4);
  border-radius: 99px;
  padding: 12px 20px;
  background: rgba(var(--error-rgb),0.1);
  color: #fff;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s, box-shadow 0.2s;
  min-height: 44px;
}

.btn-danger-critical:hover {
  background: rgba(var(--error-rgb),0.2);
  box-shadow: 0 4px 16px rgba(var(--error-rgb),0.2);
}

/* ============================================================
   TRANSACTION INPUT — Redesigned UI
   ============================================================ */

.tx-input-sheet {
  padding: 16px 20px 32px;
  /* dvh tracks the visual viewport, so the sheet shrinks when the phone
     keyboard opens instead of pushing Save underneath it. vh stays as the
     fallback for browsers without dvh. */
  max-height: 92vh;
  max-height: 92dvh;
}

.tx-type-tabs {
  display: flex;
  gap: 4px;
  background: rgba(2,6,23,0.4);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 4px;
  margin-bottom: 20px;
}

.tx-type-tab {
  flex: 1;
  min-height: 42px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  padding: 10px 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: background var(--dur), color var(--dur), box-shadow var(--dur);
}

.tx-type-tab.active {
  background: var(--accent-strong);
  color: var(--on-accent);
  box-shadow: 0 2px 10px rgba(var(--accent-rgb),0.35);
}

.tx-amount-hero {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 16px 0 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 18px;
}

.tx-amount-prefix {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-muted);
}

.tx-amount-field {
  border: none;
  background: transparent;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 36px;
  font-weight: 800;
  text-align: center;
  width: 100%;
  max-width: 280px;
  outline: none;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

.tx-amount-field::placeholder {
  color: rgba(255,255,255,0.15);
}

.tx-section {
  margin-bottom: 16px;
}

.tx-section-label {
  display: block;
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 8px;
}

.tx-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
/* Previously pointed at --text-secondary / --bg-tertiary / --danger,
   none of which exist, so it rendered unstyled. */
.iv-cash-info {
  margin-top: 8px;
  font-size: 12px;
  color: var(--text-muted);
  padding: 6px 10px;
  border-radius: 8px;
  background: rgba(255,255,255,0.05);
}
.iv-cash-info.insufficient {
  color: var(--error);
  background: rgba(var(--error-rgb),0.1);
}

.tx-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  padding: 9px 16px;
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 99px;
  background: rgba(255,255,255,0.04);
  color: #CBD5E1;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background var(--dur), border-color var(--dur), color var(--dur), transform var(--dur-fast);
  -webkit-tap-highlight-color: transparent;
}

@media (hover: hover) {
  .tx-chip:hover:not(.active) { background: rgba(255,255,255,0.08); color: var(--text); }
}

.tx-chip:active {
  transform: scale(0.95);
}

.tx-chip.active {
  background: rgba(var(--accent-rgb),0.14);
  border-color: var(--chip-color, var(--accent));
  color: var(--chip-color, var(--accent));
  box-shadow: 0 0 0 1px var(--chip-color, var(--accent)) inset, 0 2px 10px rgba(var(--accent-rgb),0.15);
}

.tx-chip-icon {
  display: flex;
  align-items: center;
}

.tx-chip-sm {
  padding: 7px 12px;
  font-size: 12px;
}

.tx-date-card {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.03);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: border-color 0.2s;
  position: relative;
  z-index: 1;
}

.tx-date-card:hover {
  border-color: rgba(var(--accent-rgb),0.3);
}

.tx-date-wrapper {
  position: relative;
}

.tx-date-hidden-input {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
  z-index: 2;
  -webkit-appearance: none;
  appearance: none;
}

.tx-date-label {
  color: var(--accent);
  font-weight: 700;
  font-size: 12px;
}

.tx-date-value {
  color: var(--text-muted);
  font-size: 12px;
}

.tx-notes-input {
  width: 100%;
  min-height: 48px;
  padding: 12px 14px;
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 14px;
  background: rgba(2,6,23,0.35);
  color: var(--text);
  font-family: inherit;
  font-size: 16px;
  font-weight: 500;
  outline: none;
  transition: border-color var(--dur), box-shadow var(--dur);
}

.tx-notes-input:focus {
  border-color: var(--accent);
  box-shadow: var(--focus-ring);
}

.tx-notes-input::placeholder {
  color: rgba(148,163,184,0.55);
}

.tx-recent-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tx-recent-chip {
  display: inline-flex;
  align-items: center;
  padding: 8px 14px;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 99px;
  background: rgba(255,255,255,0.02);
  color: var(--text-muted);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.tx-recent-chip:hover {
  background: rgba(var(--accent-rgb),0.06);
  color: var(--text);
}

.tx-save-btn {
  margin-top: 8px;
  transition: background 0.3s, transform 0.15s;
}

.tx-save-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* ============================================================
   DASHBOARD — compact layout
   Net worth card carries the month's income/expense/saving; each
   section is a header (with its action) over one card.
   ============================================================ */
.mm-dashboard-header { padding: 12px 16px 4px; align-items: center; }
.mm-greeting-line { font-size: 14px; margin: 0 0 2px; }
.mm-user-name { font-size: 18px; }
.mm-date-display { font-size: 12px; opacity: 1; gap: 6px; }

.mm-networth-card { margin: 8px 16px 22px; padding: 18px 18px 14px; }
#mmNetworthSparkline { top: 40px; bottom: auto; height: 84px; width: 48%; }

.mm-hero-stats {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,0.12);
}
.mm-hero-stat { min-width: 0; padding: 0 8px; }
.mm-hero-stat:first-child { padding-left: 0; }
.mm-hero-stat + .mm-hero-stat { border-left: 1px solid rgba(255,255,255,0.10); }
.mm-hero-stat-label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #CBD5E1;
}
.mm-hero-stat strong {
  display: block;
  margin-top: 3px;
  font-size: 14px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* Arrow + colour, never colour alone. */
.mm-hero-dot {
  display: grid;
  place-items: center;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  font-size: 10px;
  font-weight: 800;
}
.mm-hero-dot.in { background: rgba(var(--success-rgb),0.22); color: var(--success); }
.mm-hero-dot.out { background: rgba(var(--error-rgb),0.22); color: var(--error); }

.mm-dash-section { padding: 0 16px; margin-bottom: 22px; }
.mm-dash-section .mm-section-header { margin-bottom: 8px; min-height: 44px; }
.mm-section-sub { margin: 1px 0 0; font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

.mm-dash-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 14px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.045);
}
.mm-dash-card.mm-transaction-list,
.mm-dash-card.mm-budget-list { padding: 2px 14px; }
.mm-dash-card .mm-empty { padding: 20px 12px; }

/* Budget rows */
.mm-budget-row {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border: none;
  border-bottom: 1px solid var(--border);
  background: none;
  color: inherit;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  transition: transform var(--dur-fast);
  -webkit-tap-highlight-color: transparent;
}
.mm-budget-row:last-child { border-bottom: none; }
.mm-budget-row:active { transform: scale(0.985); }
.mm-budget-row-icon { display: grid; place-items: center; flex-shrink: 0; width: 36px; height: 36px; border-radius: 11px; }
.mm-budget-row-body { flex: 1; min-width: 0; display: grid; gap: 6px; }
.mm-budget-row-top, .mm-budget-row-foot { display: flex; justify-content: space-between; gap: 8px; }
.mm-budget-row-name { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mm-budget-row-pct { font-size: 12px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.mm-budget-row-foot { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.mm-budget-row-foot > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mm-budget-row-note { flex-shrink: 0; }
.mm-budget-row .mm-budget-bar { display: block; height: 6px; }
.mm-budget-row .mm-budget-bar-fill { display: block; }
.mm-budget-row.is-warn .mm-budget-bar-fill { background: var(--warning); }
.mm-budget-row.is-warn .mm-budget-row-note { color: var(--warning); }
.mm-budget-row.is-over .mm-budget-bar-fill { background: var(--error); }
.mm-budget-row.is-over .mm-budget-row-note,
.mm-budget-row.is-over .mm-budget-row-pct { color: var(--error); }

/* Breakdown: segmented control sits in the section header */
.mm-dash-section .mm-expense-tabs { margin: 0; padding: 3px; border-radius: 12px; }
.mm-dash-section .mm-expense-tab { min-height: 32px; padding: 4px 12px; font-size: 12px; border-radius: 9px; flex: none; }
.mm-dash-section .mm-donut-wrapper { width: 128px; }
.mm-dash-section .mm-donut-wrapper .chart-donut-wrap { min-height: 128px; padding: 0; }
.mm-dash-section .mm-expense-content { align-items: center; }

/* Accounts: slimmer cards */
.mm-dash-section .mm-account-card { min-width: 136px; padding: 12px; }
.mm-dash-section .mm-account-top { margin-bottom: 8px; }

/* ============================================================
   DB ACCESS BANNER
   ============================================================ */
.db-banner {
  position: fixed;
  left: 12px;
  right: 12px;
  top: calc(76px + env(safe-area-inset-top, 0px));
  z-index: 320;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 12px;
  align-items: center;
  max-width: 560px;
  margin: 0 auto;
  padding: 14px 14px 14px 16px;
  border-radius: 16px;
  border: 1px solid rgba(var(--error-rgb),0.4);
  background: linear-gradient(rgba(var(--error-rgb),0.16), rgba(var(--error-rgb),0.16)), rgba(25,33,52,0.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: var(--shadow);
  animation: fadeInUp 0.3s var(--ease-out);
}
.db-banner strong { grid-column: 1; color: var(--error); font-size: 14px; }
.db-banner span { grid-column: 1; font-size: 12px; line-height: 1.5; color: #E2E8F0; }
.db-banner code { font-size: 11px; padding: 1px 5px; border-radius: 5px; background: rgba(255,255,255,0.08); word-break: break-all; }
.db-banner button {
  grid-column: 2;
  grid-row: 1 / span 2;
  min-height: 40px;
  padding: 0 14px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.18);
  background: rgba(255,255,255,0.08);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

/* Title + close on the first line, explanation, then the action. */
.db-banner { grid-template-columns: 1fr auto; gap: 4px 8px; }
.db-banner strong { grid-column: 1; grid-row: 1; align-self: center; }
.db-banner span { grid-column: 1 / -1; grid-row: 2; }
.db-banner button { grid-column: 1; grid-row: 3; justify-self: start; margin-top: 6px; }
.db-banner .db-banner-close { grid-column: 2; grid-row: 1; margin: -6px -4px -6px 0; width: 40px; padding: 0; font-size: 20px; line-height: 1; background: transparent; border-color: transparent; color: var(--text-muted); }

/* ============================================================
   SETTINGS — grouped list layout
   Open sections with their action in the header, a sticky chip nav
   to jump between them, and only destructive/rare items folded.
   ============================================================ */
.settings-head { padding: 4px 4px 0; }
.settings-head .page-title { font-size: 26px; margin: 0; }

.settings-nav {
  position: sticky;
  top: calc(68px + env(safe-area-inset-top, 0px));
  z-index: 80;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  margin: 8px -16px 14px;
  padding: 10px 16px;
  background: var(--glass-bg);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border-bottom: 1px solid var(--border);
}
.settings-nav::-webkit-scrollbar { display: none; }
@media (max-width: 480px) { .settings-nav { margin-left: -12px; margin-right: -12px; padding-left: 12px; padding-right: 12px; } }
@media (min-width: 769px) { .settings-nav { margin-left: -32px; margin-right: -32px; padding-left: 32px; padding-right: 32px; } }

.settings-nav-chip {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 0 16px;
  border-radius: 99px;
  border: 1px solid rgba(255,255,255,0.10);
  background: rgba(255,255,255,0.04);
  color: #CBD5E1;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  transition: background var(--dur), color var(--dur), border-color var(--dur);
  -webkit-tap-highlight-color: transparent;
}
.settings-nav-chip.active {
  background: var(--accent-strong);
  border-color: transparent;
  color: var(--on-accent);
}
@media (hover: hover) {
  .settings-nav-chip:not(.active):hover { background: rgba(255,255,255,0.08); color: var(--text); }
}

.set-section {
  margin-bottom: 24px;
  scroll-margin-top: calc(68px + 72px + env(safe-area-inset-top, 0px));
  animation: fadeInUp 0.3s var(--ease-out) both;
}

.set-section-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
  margin: 0 4px 8px;
}
.set-section-title { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; color: var(--text); }
.set-section-sub { margin: 2px 0 0; font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

.set-add-btn {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 14px 0 10px;
  border-radius: 99px;
  border: 1px solid rgba(var(--accent-rgb),0.3);
  background: rgba(var(--accent-rgb),0.14);
  color: var(--accent);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background var(--dur-fast), transform var(--dur-fast);
}
.set-add-btn svg { width: 16px; height: 16px; }
.set-add-btn:active { transform: scale(0.96); }
@media (hover: hover) { .set-add-btn:hover { background: rgba(var(--accent-rgb),0.24); } }

.set-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 14px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.045);
}
.set-card + .set-card { margin-top: 10px; }
.set-card-flush { padding: 0; overflow: hidden; }
.set-card .empty-state { padding: 4px 0; }

.set-hint { margin: 10px 0 0; font-size: 12px; line-height: 1.5; color: var(--text-muted); }
.set-muted { font-size: 12px; color: var(--text-muted); }
.set-badge {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 7px;
  border-radius: 99px;
  background: rgba(255,255,255,0.07);
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 600;
  vertical-align: 1px;
}

/* --- Accounts as a list: row = edit, trash = delete --- */
.set-card-flush .mm-settings-acc-row {
  gap: 12px;
  min-height: 60px;
  padding: 10px 8px 10px 14px;
  border: none;
  border-bottom: 1px solid var(--border);
  border-radius: 0;
  background: transparent;
  cursor: pointer;
  transition: background var(--dur-fast);
}
.set-card-flush .mm-settings-acc-row:last-child { border-bottom: none; }
.set-card-flush .mm-settings-acc-row:active { background: rgba(255,255,255,0.05); }
@media (hover: hover) { .set-card-flush .mm-settings-acc-row:hover { background: rgba(255,255,255,0.03); } }
.set-card-flush .mm-settings-acc-row .icon { width: 38px; height: 38px; border-radius: 12px; background: rgba(var(--accent-rgb),0.12); color: var(--accent); }
.set-card-flush .mm-settings-acc-row .info { min-width: 0; }
.set-card-flush .mm-settings-acc-row .info .name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.set-card-flush .mm-settings-acc-row .info .meta { font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 1px; }
.set-card-flush .mm-settings-acc-row .actions { align-items: center; gap: 2px; }
.set-card-flush .mm-settings-acc-row .actions button { width: 40px; height: 40px; background: transparent; }
.set-row-chevron { display: flex; color: var(--text-muted); opacity: 0.7; }

/* --- Budget split: stacked bar + legend --- */
.set-alloc-bar {
  display: flex;
  gap: 2px;
  height: 12px;
  border-radius: 99px;
  overflow: hidden;
  background: rgba(255,255,255,0.06);
}
.set-alloc-bar span { height: 100%; transition: width 0.5s var(--ease-out); }
.set-alloc-legend {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 16px;
  margin-top: 14px;
}
.set-alloc-item { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; }
.set-alloc-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.set-alloc-name { flex: 1; min-width: 0; color: #CBD5E1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.set-alloc-item strong { font-variant-numeric: tabular-nums; }
/* Allocation editor rows: one line per sector even on a phone, and no
   card-in-a-card border since the section card already frames them. */
.set-card .allocation-target-row {
  grid-template-columns: 1fr 84px 40px;
  gap: 8px;
  padding: 0;
  border: none;
  background: none;
}
.set-card .allocation-target-row .remove-row-btn { width: 40px; height: 40px; }
.set-alloc-foot { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.set-alloc-foot .allocation-total-box { flex: 1; margin-top: 0; min-height: 48px; }
